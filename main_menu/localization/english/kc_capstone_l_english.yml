 kc_hundred_year_concord: "The Hundred-Year Concord"
 kc_hundred_year_concord_desc: "A century of elections, arbitrations, surveys, roads, ledgers, and common responses to crisis has made the Kitayama Concord older than the memory of any living signatory. Delegates now meet to turn accumulated precedent into a written constitutional settlement.\n\nDrafting Progress: #Y [GetSituationByKey('kc_hundred_year_concord').MakeScope.GetVariable('kc_articles_progress').GetValue] / 100#!\nCurrent Monthly Progress: #G [GetSituationByKey('kc_hundred_year_concord').MakeScope.GetVariable('kc_articles_monthly_progress').GetValue]#!\n\nProgress begins at 1 each month. Peace, Cohesion of at least 40, 60, or 80, and funding the Concord Secretariat accelerate the convention. War and Cohesion below 20 slow it. Readings occur at 25, 50, and 75 progress."
 kc_hundred_year_concord_monthly_tt: "The Hundred-Year Articles gain a base #G 1.00 Drafting Progress#! each month. Peace adds #G 0.25#!; war subtracts #R 0.25#!. Cohesion adds #G 0.10#! at 40, #G 0.30#! at 60, or #G 0.50#! at 80; Cohesion below 20 subtracts #R 0.50#!. Partial Secretariat funding adds #G 0.10#! and strong funding adds #G 0.25#!."
 kc_hundred_year_concord_end_tt: "Reach #Y 100 Drafting Progress#! to ratify the Hundred-Year Articles. The Situation also ends without its rewards if Japan or the Kitayama Concordate ceases to exist, or if the Concord collapses."
 kc_hundred_year_concord_map_state_tt: "Land administered directly by the Concord State while the Hundred-Year Articles are drafted."
 kc_hundred_year_concord_map_house_tt: "Land represented by a Chartered House in the Hundred-Year Council."
 KC_HUNDRED_YEAR_LEGEND_STATE: "Concord State"
 KC_HUNDRED_YEAR_LEGEND_HOUSES: "Chartered Houses"
 KC_HUNDRED_YEAR_DRAFTING_PROGRESS: "Drafting Progress"
 KC_HUNDRED_YEAR_MONTHLY_PROGRESS: "Monthly Progress"
 KC_HUNDRED_YEAR_COUNCIL_OVERVIEW: "The Hundred-Year Council"
 KC_HUNDRED_YEAR_PANEL_OVERVIEW: "Delegates are turning a century of Concord judgments, charters, surveys, and crisis settlements into the Hundred-Year Articles. Progress begins at 1 each month. Peace, strong Cohesion, and funding the Concord Secretariat accelerate the work; war and dangerously low Cohesion delay it. Constitutional choices are made at three formal readings before ratification at 100 Drafting Progress."
 KC_HUNDRED_YEAR_FIRST_READING: "First Reading: Authority — 25"
 KC_HUNDRED_YEAR_SECOND_READING: "Second Reading: Language — 50"
 KC_HUNDRED_YEAR_PUBLICATION_READING: "Publication Reading — 75"
 KC_HUNDRED_YEAR_READING_COMPLETE: "Concluded"
 KC_HUNDRED_YEAR_READING_PENDING: "Pending"

 kc_capstone.1.title: "A Century at Kitayama"
 kc_capstone.1.desc: "A century has passed since warrior houses first set aside private war for ballots, charters, and commercial rivalry. No living delegate remembers a Japan without common ledgers, circuit judgments, shared roads, and an elected shogun. Yet every institution still rests upon compromises written for an emergency that has outlived its authors.\n\nThe Council Hall fills with envoys carrying copied precedents from every harbor and inland estate. Some insist that these records prove the inviolability of the Houses that made them. Others answer that a century of common action has created duties and authority belonging to Japan itself. Before either claim can govern the next century, the Concord must decide what its peace has become."
 kc_capstone.1.a: "Convene the Hundred-Year Council."
 kc_capstone_convention_start_tt: "The #Y Hundred-Year Concord#! Situation has begun. A peaceful, well-funded Concord normally completes the Articles in approximately #Y three to five years#!; war, low Cohesion, or an underfunded Secretariat may greatly prolong the council. Constitutional readings occur at #Y 25, 50, and 75 Drafting Progress#!."

 kc_capstone.7.title: "The First Reading: Whose Authority?"
 kc_capstone.7.desc: "The first dispute concerns every clause that follows. House delegates argue that the Concord possesses only those powers individually entrusted to it by hereditary signatories. Secretariat jurists reply that uninterrupted elections, assessments, roads, and judgments have created offices whose duties cannot be withdrawn whenever one lineage objects. A third draft refuses either absolute claim and describes authority as a trust held jointly by the Houses and the common council."
 kc_capstone.7.a: "The Houses are the authors of every common power."
 kc_capstone.7.b: "Authority is a trust held jointly."
 kc_capstone.7.c: "A century of duty has created public authority."
 kc_capstone_first_reading_house_tt: "Gain #G 4 Cohesion#! and #G 5 Drafting Progress#!. At ratification this contributes #Y 15#! toward #Y House Privilege#!."
 kc_capstone_first_reading_compromise_tt: "Gain #G 2 Cohesion#! and #G 3 Drafting Progress#!. This reading creates no movement on the new constitutional value."
 kc_capstone_first_reading_common_tt: "Lose #R 3 Cohesion#! and gain #G 8 Drafting Progress#!. At ratification this contributes #Y 15#! toward #Y Concord Commonwealth#!."

 kc_capstone.8.title: "The Second Reading: A Law That Can Travel"
 kc_capstone.8.desc: "The draft is precise in the hands of a trained registrar and nearly impenetrable everywhere else. Senior Houses propose official commentaries adapted to each charter and its inherited vocabulary. Merchants and provincial petitioners demand a common vernacular edition that can be read without employing a House jurist. Court scholars instead offer an elegant recension in the language of government, sacrificing speed for consistency and imperial dignity."
 kc_capstone.8.a: "Let each House publish an authoritative commentary."
 kc_capstone.8.b: "Pay for a common vernacular edition."
 kc_capstone.8.c: "Entrust the final language to the court."
 kc_capstone_second_reading_house_tt: "Gain #G 3 Cohesion#!, #G 6 Drafting Progress#!, and a mild amount of Prestige. At ratification this contributes #Y 10#! toward #Y House Privilege#!."
 kc_capstone_second_reading_public_tt: "Spend Treasury funds equal to #R 3 months#! of Japan's trade-and-tax income and gain #G 10 Drafting Progress#!. At ratification this contributes #Y 10#! toward #Y Concord Commonwealth#!."
 kc_capstone_second_reading_court_tt: "Gain #G 4 Drafting Progress#! and a mild amount of Legitimacy. This reading creates no movement on the new constitutional value."

 kc_capstone.9.title: "The Publication Reading"
 kc_capstone.9.desc: "A constitution known only inside the Council Hall cannot bind a realm of islands. Temple workshops and urban artisans already cut contracts, calendars, religious texts, and commercial notices into blocks. Delegates must now decide whether every House will issue its own annotated Articles, the Treasury will finance one common edition, or Japan will invest in experimental movable type capable of repeatedly arranging the language of law."
 kc_capstone.9.a: "License a woodblock edition to every House."
 kc_capstone.9.b: "Finance one common edition from the Treasury."
 kc_capstone.9.c: "Fund an experimental movable-type office."
 kc_capstone_publication_house_tt: "Gain #G 5 Cohesion#! and #G 8 Drafting Progress#!. At ratification this contributes #Y 10#! toward #Y House Privilege#! and grants #Y House Imprints#! for #Y 20 years#!: #G +5% Global Merchant Power#! and #G +0.2% Estate Satisfaction Recovery#!."
 kc_capstone_publication_common_tt: "Spend Treasury funds equal to #R 6 months#! of Japan's trade-and-tax income, lose #R 2 Cohesion#!, and gain #G 15 Drafting Progress#!. At ratification this contributes #Y 10#! toward #Y Concord Commonwealth#! and grants #Y The Common Edition#! for #Y 20 years#!: #G +5% Cabinet Efficiency#! and #G −10% Change Policy Cost#!."
 kc_capstone_publication_type_tt: "Spend Japan's funds equal to #R 6 months#! of trade-and-tax income, gain #G 12 Drafting Progress#!, and move toward #Y Innovative#!. At ratification this grants #Y The Movable-Type Office#! for #Y 20 years#!: #G +0.01 Monthly Literacy#! and #G +10% Institution Growth#!."

 kc_capstone.10.title: "The Hundred-Year Articles"
 kc_capstone.10.desc: "Copies of the ratified Articles leave Kyoto beneath the seals of the court, the Concord State, and the assembled Houses. They describe no simple victory of crown over warrior or merchant over noble. Instead, they preserve the argument itself: a realm in which hereditary corporations possess liberties, common institutions possess duties, and neither may again settle their claims by private war.\n\nThe workshops required to compare, amend, and reproduce a century of judgments have transformed written government. Movable characters and precisely cut blocks circulate the same clauses through distant ports and provincial offices. The compact once improvised at Kitayama has become a constitution."
 kc_capstone.10.a: "Let the Articles bind the second century."
 kc_capstone_ratification_tt: "The new societal value #Y House Privilege vs Concord Commonwealth#! is unlocked. Its starting position combines the settlements of the #Y Unquiet Peace#!, #Y Great Reckoning#!, and #Y War That Never Was#! with all three convention readings.\n\nThe mutually exclusive Age 1 reforms #Y Articles of Chartered Liberties#! and #Y Council of Common Stewardship#! are unlocked. Both give #G +0.05 monthly Cohesion#! and move the new societal value toward their respective constitutional interpretation.\n\nJapan's capital gains #G 100 Printing Press progress#! and the chosen publication program grants its listed #Y 20-year legacy#!."
 kc_capstone.11.title: "The Articles Abandoned"
 kc_capstone.11.desc: "The delegates have left Kyoto, carrying unfinished drafts into a realm where common judgment no longer commands obedience. Without the Concord that summoned it, the Hundred-Year Council possesses neither authority nor a peace to preserve. Its clauses become curiosities in scattered House archives while banners replace seals on the roads."
 kc_capstone.11.a: "A constitution cannot outlive its peace."

