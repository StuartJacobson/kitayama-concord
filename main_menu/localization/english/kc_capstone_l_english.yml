 STATIC_MODIFIER_NAME_kc_hundred_year_common_edition: "The Common Edition"
 STATIC_MODIFIER_NAME_kc_hundred_year_movable_type: "The Movable-Type Office"

 kc_fracturing_concord: "The Fracturing Concord"
 kc_fracturing_concord_desc: "The Concord depends upon continued consent among the Chartered Houses. At any stage of its development, Cohesion below 25 creates a 1% monthly chance that accumulated disputes become a constitutional disaster. The risk rises to 3% below 15 Cohesion and 10% below 5. During the crisis, Cohesion suffers −0.50 monthly drift. Reaching 40 Cohesion restores the settlement; falling to 0 dissolves the Concord into warring states."
 kc_fracturing_concord_member: "Withholding House"
 STATIC_MODIFIER_NAME_kc_fracturing_concord_member: "Withholding House"
 KC_COHESION_FRACTURING_CONCORD: "Fracturing Concord"
 kc_fracturing_concord_response_header: "Emergency Measures"
 kc_fracturing_concord_response_desc: "Reach 40 Cohesion to restore the compact. At 0 Cohesion it collapses. An emergency conference fires every six months, and the Concord Treasury tab offers two six-month programs: JAP may subscribe national funds to the Treasury, while the Treasury may finance mediation to buy Cohesion."

 kc_capstone.2.title: "The Concord Fractures"
 kc_capstone.2.desc: "Low Cohesion has turned ordinary obstruction into a constitutional crisis. Assessments go unpaid, House delegates abandon the council, and armed retainers guard warehouses and toll gates against rival claimants. None yet openly calls for war, but each House is preparing for the possibility that judgment will no longer bind its rivals.\n\nThe Concord must rebuild consent before institutional paralysis becomes territorial defiance. Emergency measures are now available in the Treasury tab."
 kc_capstone.2.a: "Recall every House to council."
 kc_fracturing_concord_start_tt: "The #R Fracturing Concord#! disaster begins.\n\nThe crisis imposes #R −0.50 monthly Cohesion#! and economic penalties on every House. Reach #Y 40 Cohesion#! to restore the compact. If Cohesion falls to #R 0#!, the Concord dissolves and the Sengoku Jidai begins. Emergency conferences occur every #Y 6 months#!, and crisis programs are available in the Treasury tab."

 kc_capstone.3.title: "An Emergency Conference of Houses"
 kc_capstone.3.desc: "Another season of withheld assessments and rival patrols has passed. The council can purchase time from the common Treasury, concede additional authority to the hereditary Houses, or insist that the institutions of the Concord possess authority of their own."
 kc_capstone.3.a: "Finance arrears and reopen the roads."
 kc_capstone.3.b: "Guarantee the liberties of every House."
 kc_capstone.3.c: "Assert the authority of the common charter."
 kc_fracturing_concord_treasury_tt: "Spend Treasury funds equal to #Y 6 months#! of JAP trade-and-tax income and gain #G 8 Cohesion#!."
 kc_fracturing_concord_privilege_tt: "Gain #G 10 Cohesion#! and lose a mild amount of Legitimacy. After the Hundred-Year Articles are ratified, this also moves #Y 10#! toward #Y House Privilege#!."
 kc_fracturing_concord_commonwealth_tt: "Gain #G 6 Cohesion#! and lose a mild amount of Stability. After the Hundred-Year Articles are ratified, this also moves #Y 10#! toward #Y Concord Commonwealth#!."

 KC_TREASURY_EMERGENCY_PROGRAMS: "Fracturing Concord Measures"
 kc_emergency_treasury_subscription: "Subscribe an Emergency Reserve"
 kc_emergency_treasury_subscription_desc: "Transfer JAP's funds into the common Treasury so later mediation does not depend upon ordinary assessments."
 kc_emergency_subscription_ready_tt: "No emergency reserve subscription has been made during the last #Y 6 months#!."
 kc_emergency_subscription_funds_tt: "Japan holds the required #Y [SCOPE.sInternationalOrganization('recipient').MakeScope.ScriptValue('kc_treasury_six_month_cost')|2]#! gold."
 kc_emergency_treasury_subscription_effect_tt: "Transfer #R [SCOPE.sInternationalOrganization('recipient').MakeScope.ScriptValue('kc_treasury_six_month_cost')|2]#! gold from Japan to the Concord Treasury. The six-month income benchmark is capped at #Y 5,000#!, and this action has a #Y 6-month cooldown#!."
 kc_emergency_purchase_cohesion: "Finance Emergency Mediation"
 kc_emergency_purchase_cohesion_desc: "Pay arrears, reopen roads, and subsidize a new conference of the Chartered Houses."
 kc_emergency_cohesion_ready_tt: "Emergency mediation has not been financed during the last #Y 6 months#!."
 kc_emergency_cohesion_funds_tt: "The Concord Treasury holds the required #Y [SCOPE.sInternationalOrganization('recipient').MakeScope.ScriptValue('kc_treasury_six_month_cost')|2]#! gold."
 kc_emergency_purchase_cohesion_effect_tt: "Spend #R [SCOPE.sInternationalOrganization('recipient').MakeScope.ScriptValue('kc_treasury_six_month_cost')|2]#! Treasury gold and gain #G 6 Cohesion#!. The six-month income benchmark is capped at #Y 5,000#!, and this action has a #Y 6-month cooldown#!."

 kc_capstone.4.title: "The Concord Is Broken"
 kc_capstone.4.desc: "The Concord assumed that every House, however jealous of its privileges, still preferred judgment to war. That assumption is dead. Assessments go unpaid, council orders are ignored, armed retainers seize toll gates, and rival Houses invoke old domains beneath the commercial charters that once concealed them.\n\nJapan's common state survives as a nominal shogunate, but the Concord's institutions become an interregnum council that can no longer forbid war. Only the most established Houses can turn commercial influence into defensible territorial rule. The peace of Kitayama ends in a second age of warring states."
 kc_capstone.4.a: "The charters burn; the banners rise."
 kc_concord_dissolution_tt: "The transition begins after this event closes. The existing organization permanently becomes the powerless #R Warring Houses Interregnum#!: Cohesion and Entrenchment freeze, elections and laws cease, Treasury programs close, and internal wars are permitted. Every Chartered House attempts to become a landed daimyo, receiving territory where its commercial network is strongest; a House that cannot secure any location may disappear.\n\nSurviving Houses may create a #Y War of the Broken Concord#! justification against one another with no spy-network cost, lasting beyond the playable timeline. The inert register remains only to preserve the campaign's diplomatic references. You continue playing as Japan and are not annexed."
 kc_cb_warring_houses: "War of the Broken Concord"
 kc_cb_warring_houses_desc: "The Kitayama compact has failed. Rival landed Houses may settle their competing claims by force."

 kc_capstone.5.title: "The Articles Restored"
 kc_capstone.5.desc: "Assessments resume, House delegates return to their benches, and the roads are again guarded in the name of common judgment. The Concord has survived its gravest challenge—not because its authority was unquestioned, but because the Houses again chose arbitration over war."
 kc_capstone.5.a: "The Concord endures."

