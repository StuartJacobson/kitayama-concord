 kc_debug.37.title: "Test the Foundational Concord Chains"
 kc_debug.37.desc: "This debug event erases the outcomes of all five foundational historical chains, preserves the prerequisite history needed by the selected chain, and schedules every follow-up one day apart. It is intended only for rapid testing."
 kc_debug.37.a: "Test the Chinese Tally Trade."
 kc_debug.37.b: "Test the Concord After Its Founder."
 kc_debug.37.c: "Test Tsushima, Joseon, and the Wakō."
 kc_debug.37.d: "Test the Shōchō Debt Crisis."
 kc_debug.37.e: "Test Port Autonomy."
 kc_debug.37.f: "Cancel without changing history."

 kc_concord_war_service_law: "House War Service"
 kc_concord_war_service_law_desc: "The Concord must decide whether the armed establishments of its Houses remain private guarantees, voluntary auxiliaries, or a national reserve under the shogun's seal."
 kc_house_war_exemption_policy: "Exempt House Charters"
 kc_house_war_exemption_policy_desc: "Japan may neither summon nor compel Chartered Houses into its wars. Their troops and ships protect their own offices and contracts."
 kc_discretionary_house_service_policy: "Discretionary House Service"
 kc_discretionary_house_service_policy_desc: "Japan may invite every Chartered House to enter its wars, but each House retains the right to accept or refuse the summons."
 kc_universal_house_mobilization_policy: "Universal House Mobilization"
 kc_universal_house_mobilization_policy_desc: "Every Chartered House is bound to enter every Japanese war when the common seal is raised."

 kc_purchase_overseas_concession_licenses: "Purchase Overseas Concession Licenses"
 kc_purchase_overseas_concession_licenses_desc: "Subscribe money to the common Treasury in exchange for additional licenses to establish House concessions in Concord protectorates and commissions. Larger subscriptions purchase proportionally larger license grants."
 kc_overseas_concessions.1.title: "Licenses Beyond the Inland Sea"
 kc_overseas_concessions.1.desc: "The Common Ledger now recognizes overseas concessions as alienable House property. A license may sustain one warehouse, resource office, naval depot, or enforcers' guild. Licenses and completed concessions pass intact when one House redeems another's charter."
 kc_overseas_concessions.1.a: "Subscribe one year's income for one license."
 kc_overseas_concessions.1.b: "Subscribe thirty months' income for three licenses."
 kc_overseas_concessions.1.c: "Subscribe fifty-four months' income for six licenses."
 kc_overseas_concessions.1.d: "The House will not subscribe today."

 kc_overseas_warehouse: "Chartered Overseas Warehouse"
 kc_overseas_warehouse_desc: "A fortified counting house, bonded warehouse, and exchange office through which a Chartered House advances credit and gathers the profits of an overseas port."
 kc_resource_concession_office: "Resource Concession Office"
 kc_resource_concession_office_desc: "Surveyors, factors, and contracted labor intensify extraction for a Chartered House at the cost of local development and public authority."
 kc_concessionary_naval_depot: "Concessionary Naval Depot"
 kc_concessionary_naval_depot_desc: "Stores of timber, cordage, pilots, and sailors support a House's maritime presence from a protected foreign anchorage."
 kc_chartered_enforcers_guild: "Chartered Enforcers' Guild"
 kc_chartered_enforcers_guild_desc: "A licensed body of guards, interpreters, and armed agents that supplies manpower to its House and permits regiments to be raised from the concession."

 kc_tensho_embassy.1.title: "An Embassy Beyond the Southern Seas"
 kc_tensho_embassy.1.desc: "Reports from Macau and the southern exchange describe courts beyond every familiar tally route. Missionaries propose an embassy of Christian youths; the Houses propose a commercial consortium; the Secretariat argues that only a delegation bearing the common seal can speak for Japan."
 kc_tensho_embassy.1.a: "Send a delegation under the common seal."
 kc_tensho_embassy.1.b: "Let the maritime Houses finance the voyage."
 kc_tensho_embassy.1.c: "Include Christian scholars and converts."
 kc_tensho_embassy.2.title: "The Route of Many Courts"
 kc_tensho_embassy.2.desc: "At every port the delegates encounter a different law of gifts, credentials, tolls, and worship. Their conduct will decide whether what they learn becomes as public knowledge, private connection, or courtly precedent."
 kc_tensho_embassy.2.a: "Record every pilotage and protocol in common registers."
 kc_tensho_embassy.2.b: "Open House gift markets along the route."
 kc_tensho_embassy.2.c: "Guard the dignity of the Japanese court."
 kc_tensho_embassy.3.title: "Letters from Rome and Lisbon"
 kc_tensho_embassy.3.desc: "Printers, merchants, clerics, and princes ask what this commercial Japan has come to seek. The answer will shape which knowledge returns across the oceans."
 kc_tensho_embassy.3.a: "Purchase presses, maps, instruments, and books."
 kc_tensho_embassy.3.b: "Negotiate routes, contracts, and maritime insurance."
 kc_tensho_embassy.3.c: "Commission a comparison of religions and charities."
 kc_tensho_embassy.4.title: "The Delegates Return"
 kc_tensho_embassy.4.desc: "Years after their departure, the survivors return with foreign clothes, translated books, oceanic contracts, and memories no single faction can wholly claim. The Concord must now decide how Japan will preserve the record of their journey."
 kc_tensho_embassy.4.a: "Publish the observations through the Secretariat."
 kc_tensho_embassy.4.b: "Charter a permanent oceanic exchange."
 kc_tensho_embassy.4.c: "Register a durable compact of toleration."

