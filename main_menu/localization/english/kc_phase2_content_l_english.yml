 # Foundational historical chains
 kc_foreign_commerce_court_precedent_tt: "Establish a #Y Court-Sanctioned Commerce#! precedent. The imperial court will remain an arbiter of foreign titles and licensed trade."
 kc_foreign_commerce_concord_precedent_tt: "Establish a #Y Concord-Regulated Commerce#! precedent. The Secretariat will register tallies and supervise foreign obligations."
 kc_foreign_commerce_house_precedent_tt: "Establish a #Y House-Licensed Commerce#! precedent. Chartered Houses will control a greater share of foreign access."
 kc_public_order_central_precedent_tt: "Establish a #Y Central Enforcement#! precedent. Maritime peace is a common responsibility of Japan and the Concord."
 kc_public_order_negotiated_precedent_tt: "Establish a #Y Negotiated Enforcement#! precedent. Licensed seafarers may serve as regulated convoy guards."
 kc_public_order_house_precedent_tt: "Establish a #Y House Enforcement#! precedent. Maritime Houses will patrol the sea lanes under their own charters."
 kc_public_order_disorder_precedent_tt: "Refuse a durable maritime settlement. This failure will weigh upon the later constitutional crisis."
 kc_credit_tokusei_precedent_tt: "Establish a #Y Tokusei Relief#! precedent. Public order may justify the cancellation of private debts."
 kc_credit_mediated_precedent_tt: "Establish a #Y Mediated Contracts#! precedent. The Concord Treasury and its courts may restructure debts to preserve both livelihood and credit."
 kc_credit_strict_precedent_tt: "Establish a #Y Strict Contracts#! precedent. Chartered obligations will be enforced even during popular distress."
 kc_ports_municipal_precedent_tt: "Establish a #Y Municipal Port Councils#! precedent. Recognized townsmen may govern tolls, warehouses, and civic obligations."
 kc_ports_concord_precedent_tt: "Establish a #Y Concord Port Administration#! precedent. Major harbors will answer to common registers and national customs officers."
 kc_ports_house_precedent_tt: "Establish a #Y House-Port Compact#! precedent. Chartered Houses will retain port monopolies in exchange for maintaining the quays."
 kc_port_courts_common_tt: "Place inter-port contracts under common commercial courts."
 kc_port_courts_municipal_tt: "Permit licensed civic watches and municipal warehouse courts."
 kc_port_courts_house_tt: "Confirm House jurisdiction over warehouses held beneath its charter."
 kc_founder_continuity_precedent_tt: "Preserve the founder's settlement and test whether its offices can continue without his personal direction."
 kc_founder_revision_precedent_tt: "Convene a constitutional review of the founder's settlement."
 kc_founder_house_precedent_tt: "Allow the Senior Houses to reopen their individual bargains with the Concord."
 kc_founder_records_secretariat_tt: "Entrust the seals, tallies, and constitutional registers to the Concord Secretariat."
 kc_founder_records_court_tt: "Place the founder's most solemn records in imperial custody."
 kc_founder_records_houses_tt: "Divide custody of the records among the Senior Houses."

 kc_historical_concord.1.title: "An Embassy to [SCOPE.sCountry('china').GetName]"
 kc_historical_concord.1.desc: "Ashikaga Yoshimitsu proposes an embassy across the sea. The ports of [SCOPE.sCountry('china').GetName] offer silk, copper coin, books, porcelain, and formal access to the richest commercial circuit in East Asia—but its court expects Japan to speak in the language of tribute and to restrain the wakō. The Concord must decide whose dignity it represents and whose ships will profit."
 kc_historical_concord.1.a: "Accept the diplomatic form and secure the trade."
 kc_historical_concord.1.b: "Pay for envoys instructed to negotiate commercial parity."
 kc_historical_concord.1.c: "Let the maritime Houses seek less formal channels."

 kc_historical_concord.2.title: "The Title of King of Japan"
 kc_historical_concord.2.desc: "A patent from [SCOPE.sCountry('china').GetName] addresses Yoshimitsu as the King of Japan. Abroad, the title would secure recognition for ships sailing beneath his authority. At home, Japan already has a sovereign, and neither the imperial court nor the Tennō can permit a commercial document to define the realm. Lawyers, monks, and merchants search for a formula that can carry two meanings without breaking either order."
 kc_historical_concord.2.a: "It is an external title, binding only beyond our shores."
 kc_historical_concord.2.b: "Reconcile the patent with an imperial ceremony."
 kc_historical_concord.2.c: "Refuse any title that obscures the Tennō."

 kc_historical_concord.3.title: "The Division of the Tallies"
 kc_historical_concord.3.desc: "The first diplomatic bargain is only the beginning. Identical halves of official tallies must be cut, recorded, guarded, and matched at the ports of [SCOPE.sCountry('china').GetName]. Whoever holds them will decide which cargoes leave Japan, which Houses receive imported silk and coin, and who must answer when an unlicensed ship flies a false banner."
 kc_historical_concord.3.a: "The Secretariat will number and distribute every tally."
 kc_historical_concord.3.b: "The court will sanction each voyage."
 kc_historical_concord.3.c: "Divide the tallies among the commercial Houses."

 kc_historical_concord.4.title: "The First Tally Ships Return"
 kc_historical_concord.4.desc: "The licensed ships return laden with raw silk, books, fine ceramics, medicines, copper coin, and new methods of account. Their profit confirms that the Concord's foreign policy can be measured not only in ritual precedence but in warehouses filled and obligations honored. The rules established for these first voyages will shape every later encounter across the sea."
 kc_historical_concord.4.a: "Enter the cargoes and the precedent in the common register."

 kc_historical_concord.10.title: "The Empty Seat at Kitayama"
 kc_historical_concord.10.desc: "The founder of the Concord is dead. Yoshimitsu's presence had reconciled warriors who trusted no council, courtiers who accepted no merchant's arithmetic, and Houses that regarded every common rule as a temporary concession. The seals remain, the ledgers remain, and the council is summoned—but no living voice carries the authority that first joined them."
 kc_historical_concord.10.a: "The settlement is law, not a personal testament."
 kc_historical_concord.10.b: "Convene a review while succession is still peaceful."
 kc_historical_concord.10.c: "Every great House must reaffirm its own bargain."

 kc_historical_concord.11.title: "The Seals and Registers"
 kc_historical_concord.11.desc: "Clerks inventory the founder's seals, tally records, House charters, and private memoranda. Some are public instruments; others contain compromises never intended for common reading. Their new custodian will possess neither an army nor a province, yet will decide which interpretation of the Concord becomes its institutional memory."
 kc_historical_concord.11.a: "The Secretariat must inherit the records of state."
 kc_historical_concord.11.b: "Place the solemn instruments under imperial custody."
 kc_historical_concord.11.c: "Let the Senior Houses guard one another's copies."

 kc_historical_concord.12.title: "The Question of [SCOPE.sCountry('china').GetName]"
 kc_historical_concord.12.desc: "The succession has reopened Yoshimitsu's most controversial bargain. One party urges the new government to maintain relations with [SCOPE.sCountry('china').GetName] exactly as inherited. Another would suspend their courtly forms while preserving regulated commerce. The maritime Houses argue that profitable custom no longer requires a national submission. The Concord's answer will prove whether it can revise a founder's policy without repudiating his constitution."
 kc_historical_concord.12.a: "Maintain formal relations through Concord offices."
 kc_historical_concord.12.b: "Suspend the courtly forms but preserve regulated exchange."
 kc_historical_concord.12.c: "Let official relations lapse and tolerate House trade."

 kc_historical_concord.20.title: "Complaints from Joseon"
 kc_historical_concord.20.desc: "Envoys from Joseon bring lists of burned villages, stolen grain, abducted people, and ships taken by wakō operating from the straits. They demand that Japan honor the anti-piracy obligations attached to its foreign commerce. Tsushima's brokers protest that the same captains who raid one coast carry lawful cargo to another, and that a careless suppression would ruin the island."
 kc_historical_concord.20.a: "Acknowledge the obligation and investigate the ports."
 kc_historical_concord.20.b: "Demand proof before condemning our seafarers."
 kc_historical_concord.20.c: "Forward the complaint to the maritime Houses."

 kc_historical_concord.21.title: "The Fleets off Tsushima"
 kc_historical_concord.21.desc: "Joseon's fleet has entered the waters of Tsushima to strike the wakō bases directly. Smoke rises above coastal settlements while local defenders rally around storehouses used by pirates, fishermen, and lawful merchants alike. The Concord can no longer treat maritime policing as an accounting dispute: it must decide who possesses the authority and the means to keep the straits."
 kc_historical_concord.21.a: "Fund a common patrol and suppress the pirate anchorages."
 kc_historical_concord.21.b: "License the best captains as regulated convoy guards."
 kc_historical_concord.21.c: "Order the maritime Houses to police their own waters."
 kc_historical_concord.21.d: "Tsushima must defend its own customs."

 kc_historical_concord.22.title: "The Tsushima Settlement"
 kc_historical_concord.22.desc: "With the first violence spent, both shores require a durable arrangement. Joseon wants named officials who can answer for every ship. Tsushima wants licensed trade sufficient to feed an island whose soil cannot. Japanese Houses want access to Korean markets without accepting collective liability for every pirate flying a familiar banner."
 kc_historical_concord.22.a: "Create a common customs and anti-piracy office."
 kc_historical_concord.22.b: "Register annual ships and licensed convoy captains."
 kc_historical_concord.22.c: "Recognize House patrol districts in the straits."

 kc_historical_concord.23.title: "Pirates or Pilots?"
 kc_historical_concord.23.desc: "A year of records now distinguishes ships that kept their licenses from those that used them as cover. Some former raiders have become expert pilots and convoy guards; others have merely learned which seal to counterfeit. The maritime settlement is imperfect, but it has created an answerable institution where there was once only accusation and reprisal."
 kc_historical_concord.23.a: "Record the settlement as the law of the straits."

 kc_historical_concord.30.title: "The Ledgers Burn at Daigo"
 kc_historical_concord.30.desc: "Bad harvests, sickness, and political uncertainty have turned old debts into public fury. Packhorse drivers, cultivators, and townspeople seize loan registers from religious lenders and warehouse creditors. At Daigo, documents are burned before a crowd demanding tokusei—virtuous government through the cancellation of debt. Every creditor now wonders whether ink still binds; every debtor wonders whether the Concord hears anything but ink."
 kc_historical_concord.30.a: "Summon lenders, villages, and House judges at once."

 kc_historical_concord.31.title: "A Petition for Virtuous Government"
 kc_historical_concord.31.desc: "The petitioners demand cancellation. The Houses insist that commerce cannot survive if every hardship erases a contract. Secretariat clerks propose a third course: public money, reduced principal, and scheduled repayment under common supervision. None is painless. The Concord must decide whether peace rests upon relief, mediation, or enforcement."
 kc_historical_concord.31.a: "Proclaim tokusei for the distressed districts."
 kc_historical_concord.31.b: "Use the Treasury to negotiate repayment and a haircut."
 kc_historical_concord.31.c: "Enforce the House contracts and restore the records."

 kc_historical_concord.32.title: "The Credit of the Realm"
 kc_historical_concord.32.desc: "The immediate crowds have dispersed. New loans are written with the settlement in mind: some price in the possibility of public relief, some submit to Concord mediation, and others rely upon the promise that a chartered contract will be enforced. The crisis has ended, but Japan's understanding of credit has changed permanently."
 kc_historical_concord.32.a: "Let every future contract remember this settlement."

 kc_historical_concord.40.title: "The Petition of the Port Towns"
 kc_historical_concord.40.desc: "Merchants of Hyōgo, Hakata, and the growing harbor of Sakai submit a common petition. House tolls overlap, warehouse courts contradict one another, and civic works wait upon lords whose profits lie elsewhere. The petitioners do not yet demand independence; they ask that those who live by the quays possess a recognized voice in governing them."
 kc_historical_concord.40.a: "Hear the townsmen as a corporate body."
 kc_historical_concord.40.b: "Ask the Secretariat for a national port ordinance."
 kc_historical_concord.40.c: "The petition must pass through the chartered lords."

 kc_historical_concord.41.title: "Who Governs the Quays?"
 kc_historical_concord.41.desc: "Three constitutional models emerge from the hearings. Merchant elders offer to maintain docks and civic watches if recognized as municipal councils. Concord officials propose common customs schedules and nationally appointed port officers. The Houses will accept regulation only if their monopolies and jurisdictions are confirmed by compact."
 kc_historical_concord.41.a: "Charter municipal merchant councils."
 kc_historical_concord.41.b: "Establish a Concord administration for the great ports."
 kc_historical_concord.41.c: "Negotiate binding House-port compacts."

 kc_historical_concord.42.title: "Warehouse Law and Civic Peace"
 kc_historical_concord.42.desc: "A constitution for tolls is incomplete without a law for conflict. Warehouse owners want courts that understand bills, cargo shares, and marine loss. Residents demand watchmen who answer to the town rather than a distant retainer. The Houses warn that armed civic bodies and independent courts would hollow out the jurisdiction their charters guarantee."
 kc_historical_concord.42.a: "Create common commercial courts for inter-port disputes."
 kc_historical_concord.42.b: "License civic watches and municipal warehouse courts."
 kc_historical_concord.42.c: "Preserve House courts over chartered warehouses."

 kc_historical_concord.43.title: "The Ports of the Concord"
 kc_historical_concord.43.desc: "New ordinances hang at the gates of the principal harbors. They identify who maintains the quays, who judges a warehouse claim, who commands the night watch, and where customs are entered. The arrangement remains an experiment, but Japan's ports now possess a constitutional identity that history would otherwise have forced them to win amid civil war."
 kc_historical_concord.43.a: "Seal the port constitution and publish it throughout Japan."

