 kc_concord_gain_1_cohesion_tt: "The Concord gains #G 1 Cohesion#!."
 kc_concord_gain_2_cohesion_tt: "The Concord gains #G 2 Cohesion#!."
 kc_concord_lose_1_cohesion_tt: "The Concord loses #R 1 Cohesion#!."
 kc_concord_lose_2_cohesion_tt: "The Concord loses #R 2 Cohesion#!."
 kc_concord_lose_3_cohesion_tt: "The Concord loses #R 3 Cohesion#!."
 kc_concord_flavor.1.title: "Measures at the Inland Sea"
 kc_concord_flavor.1.desc: "A bale measured in Sakai does not weigh the same in Hakata, and a measure of rice recorded by one House arrives short in the warehouse of another. Merchants ask the Concord to publish common weights; the Houses answer that their measures are part of their inherited authority."
 kc_concord_flavor.1.a: "Issue calibrated measures from the Secretariat."
 kc_concord_flavor.1.b: "Let every House warrant its own measure."

 kc_concord_flavor.2.title: "A House Defaults on Its Warehouses"
 kc_concord_flavor.2.desc: "A respected Chartered House has borrowed against cargoes that never reached port. Its creditors demand seizure of warehouses in three markets, while its delegates insist that a public auction would disgrace the entire compact."
 kc_concord_flavor.2.a: "Reconcile the books under Concord supervision."
 kc_concord_flavor.2.b: "The creditors accepted the risk."

 kc_concord_flavor.3.title: "A Bridge Taken by the Rains"
 kc_concord_flavor.3.desc: "Floodwater has carried away a bridge used by post riders, pilgrims and pack trains. The neighboring House offers to rebuild it immediately if it may collect a hereditary toll; Secretariat surveyors instead propose a common assessment and a toll-free crossing."
 kc_concord_flavor.3.a: "Rebuild it as a common road."
 kc_concord_flavor.3.b: "Recognize the House toll."

 kc_concord_flavor.4.title: "The Pilots' Quarrel"
 kc_concord_flavor.4.desc: "Two associations of coastal pilots have drawn incompatible charts of the same shoals. Each accuses the other of concealing safe channels for favored Houses. Shipmasters now refuse to sail until the Concord decides whose knowledge may be trusted."
 kc_concord_flavor.4.a: "Copy both charts into a common coastal register."
 kc_concord_flavor.4.b: "A House must answer for its own pilots."

 kc_concord_flavor.5.title: "Retainers Without a Campaign"
 kc_concord_flavor.5.desc: "Peace has outlived another generation of warriors. Younger retainers know accounts and warehouse guards better than battle, yet their stipends still assume a campaign that never comes. Some seek places in the common constabulary; others demand that their Houses preserve the old obligations."
 kc_concord_flavor.5.a: "Register them for roads, musters and public peace."
 kc_concord_flavor.5.b: "Their service belongs to their Houses."

 kc_concord_flavor.6.title: "A Religious Market Seeks Judgment"
 kc_concord_flavor.6.desc: "A prosperous religious estate controls storehouses, workshops and lending contracts whose records predate the Concord. Its custodians will accept outside judgment, but only if the council recognizes the estate as a continuing trust rather than property of whichever lord holds the surrounding district."
 kc_concord_flavor.6.a: "Register the trust and publish its obligations."
 kc_concord_flavor.6.b: "Confirm its customary immunities."

 kc_concord_flavor.7.title: "The Rice Brokers Close Their Ledgers"
 kc_concord_flavor.7.desc: "Rumors of a poor harvest have emptied granaries faster than the harvest itself. Brokers refuse new paper claims, households hoard rice and several Houses insist that their own retainers must be supplied before cargo is released to the open market."
 kc_concord_flavor.7.a: "Guarantee a temporary rice-market reserve."
 kc_concord_flavor.7.b: "Every House must provision its own dependents."

 kc_concord_flavor.8.title: "The Petition of Five Villages"
 kc_concord_flavor.8.desc: "Five villages have copied the same petition onto one roll. They ask that irrigation channels, woodland boundaries and transport duties be entered in a public register rather than renegotiated whenever a House changes its steward. Their lord calls this an attack upon chartered jurisdiction."
 kc_concord_flavor.8.a: "Hear the villages and survey their obligations."
 kc_concord_flavor.8.b: "Return the petition to the chartered lord."

 kc_concord_flavor.9.title: "A School of Accounts"
 kc_concord_flavor.9.desc: "Clerks trained in temple schools, merchant houses and warrior households have begun exchanging methods for double entries, compound obligations and copied contracts. They request a permanent school whose graduates would be recognized by every Concord tribunal."
 kc_concord_flavor.9.a: "Endow a common school of accounts."
 kc_concord_flavor.9.b: "Learning should remain with its patrons."

 kc_concord_flavor.10.title: "Foreign Wares at the Customs Gate"
 kc_concord_flavor.10.desc: "New wares arrive with unfamiliar measures, contracts and claims of origin. Port Houses want freedom to bargain before rivals learn the trade; the Secretariat warns that contradictory duties will turn every harbor into a separate frontier."
 kc_concord_flavor.10.a: "Publish one calibrated customs schedule."
 kc_concord_flavor.10.b: "Let the ports compete for the trade."

 kc_concord_flavor.11.title: "Precedence in the Council Hall"
 kc_concord_flavor.11.desc: "A Senior House refuses the seat assigned by the ushers, arguing that its old military rank must precede a wealthier but younger charter. Ordinary Houses answer that a commercial peace cannot reproduce every hierarchy of the abandoned shogunate."
 kc_concord_flavor.11.a: "Seat them by office and recorded service."
 kc_concord_flavor.11.b: "Honor the inherited precedence."

 kc_concord_flavor.12.title: "Surplus in the Common Granaries"
 kc_concord_flavor.12.desc: "Careful inventories reveal that several circuit granaries hold more rice than their emergency schedules require. Village headmen propose rotating the old grain into roads and irrigation; House factors ask that it be returned to those whose assessments filled the stores."
 kc_concord_flavor.12.a: "Turn the surplus into common works."
 kc_concord_flavor.12.b: "Return it according to the House ledgers."

 kc_ezo_discoveries.1.title: "The Black Sands of Shimamaki"
 kc_ezo_discoveries.1.desc: "Workers gathering coastal sand near Shimamaki notice that the darkest grains collect beneath the water and cling stubbornly to their tools. Tatara masters brought north by the Concord recognize iron sand. The deposit is not rich enough to transform Ezo alone, but organized washing and furnaces could sustain a northern iron industry."
 kc_ezo_discoveries.1.a: "Survey the sands and license common furnaces."
 kc_ezo_discoveries.1.b: "Grant the first working claim to a House."

 kc_ezo_discoveries.2.title: "Northern Horse-Breeding Grounds"
 kc_ezo_discoveries.2.desc: "The open ground around Niikappu proves better suited to hardy horses than to the southern crops first entered in colonial surveys. Ainu handlers, migrant grooms and former retainers begin exchanging knowledge of winter forage, river crossings and breeding stock. A permanent northern stud could serve both transport and defense."
 kc_ezo_discoveries.2.a: "Create a registered stud with Ainu handlers."
 kc_ezo_discoveries.2.b: "Divide the paddocks among the Houses."

 kc_ezo_discoveries.3.title: "The Red Stone of Itomuka"
 kc_ezo_discoveries.3.desc: "Road cutters following the upper valleys west of Tokoro uncover an unusually heavy red stone and beads of liquid metal. No medieval record names an Itomuka mine; only the Concord's speculative northern surveys have exposed a deposit that history would otherwise leave buried for centuries. Physicians, metalworkers and merchants agree that the substance is mercury—and disagree sharply over who should control it."
 kc_ezo_discoveries.3.a: "Open cautious experimental adits under public inspection."
 kc_ezo_discoveries.3.b: "Grant a House concession and demand rapid production."

 kc_hereditary_charter_courts: "Hereditary Charter Courts"
 kc_hereditary_charter_courts_desc: "Recognize the great Houses as permanent commercial jurisdictions entitled to judge disputes within their own charters. Their networks strengthen overseas and domestic commerce, but exemptions narrow the revenue available to the common state. This privilege steadily favors #Y House Privilege#!."
 kc_circuit_stewardship_obligations: "Circuit Stewardship Obligations"
 kc_circuit_stewardship_obligations_desc: "Tie noble rank to the maintenance of roads, registers and public order across an assigned circuit. Control and construction improve, but manpower once reserved for House levies is redirected toward civil duties. This privilege steadily favors #Y Concord Commonwealth#!."
 kc_licensed_house_monopolies: "Licensed House Monopolies"
 kc_licensed_house_monopolies_desc: "Permit merchant associations to operate beneath exclusive House charters. Concentrated capital supports larger commercial networks, but those protected revenues remain harder for the common state to tax. This privilege steadily favors #Y House Privilege#!."
 kc_common_exchange_standards: "Common Exchange Standards"
 kc_common_exchange_standards_desc: "Require exchanges to publish compatible measures, fees and contract forms. Trade and public construction benefit, but the additional procedure makes later policy changes slightly more expensive. This privilege steadily favors #Y Concord Commonwealth#!."
 kc_temple_commercial_immunities: "Religious Commercial Immunities"
 kc_temple_commercial_immunities_desc: "Protect the schools, markets and storehouses of established religious corporations regardless of the country's current faith. Their literate administration improves, but a share of their wealth remains beyond ordinary assessment. This privilege steadily favors #Y House Privilege#!."
 kc_registered_religious_trusts: "Registered Religious Trusts"
 kc_registered_religious_trusts_desc: "Recognize religious corporations through public charters that record their property and charitable obligations. Scholarship and institutional recovery improve, but supervision leaves fewer resources for organized conversion. This privilege steadily favors #Y Concord Commonwealth#!."
 kc_village_contract_rights: "Village Contract Rights"
 kc_village_contract_rights_desc: "Allow villages to hold written contracts for woodland, irrigation and customary production beneath a House charter. Rural output and enfranchisement improve, but protected local claims reduce central tax efficiency. This privilege steadily favors #Y House Privilege#!."
 kc_common_granary_boards: "Common Granary Boards"
 kc_common_granary_boards_desc: "Place village representatives on circuit boards responsible for emergency stores and grain movement. Food reserves improve, but fewer peasants remain available for levy service. This privilege steadily favors #Y Concord Commonwealth#!."

