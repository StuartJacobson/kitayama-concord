 kc_debug.52.title: "Test the Great Embassy"
 kc_debug.52.desc: "Reset and rapidly play the four-event 1582 embassy chain. Each follow-up is scheduled one day after the previous choice."
 kc_debug.52.a: "Dispatch the embassy."
 kc_debug.53.title: "Test Overseas Subject Constitutions"
 kc_debug.53.desc: "Convert Japan's most populous existing subject to one of the new overseas subject types. This command does not create or release a country."
 kc_debug.53.a: "Create a Concord Commercial Protectorate."
 kc_debug.53.b: "Create a Chartered Extraction Commission."
 kc_debug.54.title: "Test Overseas Concession Licenses"
 kc_debug.54.desc: "Initialize every Chartered House's license account and grant each House six additional unused concession licenses."
 kc_debug.54.a: "Issue the test licenses."
 kc_debug.55.title: "Test House War Service"
 kc_debug.55.desc: "Replace the active House War Service policy without a vote so each mobilization rule can be tested in a separate reload."
 kc_debug.55.a: "Activate Exempt House Charters."
 kc_debug.55.b: "Activate Discretionary House Service."
 kc_debug.55.c: "Activate Universal House Mobilization."
