 kc_debug.32.title: "Debug: Select the Arms Settlement"
 kc_debug.32.desc: "Change the Concord's active arms policy immediately. Chartered Houses retain their existing building-based recruitment access under every settlement; the laws alter the AI's desired army size and the resources available to maintain it. Allow at least one monthly tick before comparing House behavior."
 kc_debug.32.a: "Adopt House Retinues."
 kc_debug.32.b: "Adopt Registered Retinues."
 kc_debug.32.c: "Adopt Common Arsenals."

 kc_debug.33.title: "Debug: Select the Maritime Settlement"
 kc_debug.33.desc: "Set Concord Entrenchment to 80 and change the active maritime policy immediately. Chartered Houses with Clan Shipyards retain shipbuilding access under every settlement; the laws alter the AI's desired navy size and the resources available to maintain it. Allow at least one monthly tick before comparing House behavior."
 kc_debug.33.a: "Adopt House Port Privileges."
 kc_debug.33.b: "Adopt Licensed Coastal Convoys."
 kc_debug.33.c: "Adopt the Concord Maritime Board."
