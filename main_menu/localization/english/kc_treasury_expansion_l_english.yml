 STATIC_MODIFIER_NAME_kc_treasury_maritime_underwriting: "Concord Maritime Underwriting"

 KC_TREASURY_GREAT_PROJECTS_FIRST_CENTURY: "Foundational Great Works"
 KC_TREASURY_GREAT_PROJECTS_MARITIME: "Maritime Great Works"
 KC_TREASURY_GREAT_PROJECTS_PHASE_2: "Later Great Works"
 KC_TREASURY_GREAT_PROJECTS_PHASE_2_CIVIC: "Later Civic Works"
 KC_TREASURY_GREAT_PROJECTS_LATE_MARITIME: "The Oceanic Harbor Register"
 KC_TREASURY_METROPOLITAN_CHARTER: "The Metropolitan Charter"

 kc_project_grand_irrigation: "Issue the Basin Commission"
 kc_project_grand_irrigation_desc: "Send surveyors to unite reservoirs, diversion channels, field drains, and customary water rights under a common design. Each commission permits Japan to enlarge its Concord Irrigation Works by one level."
 kc_project_irrigation_unlock_tt: "Concord Entrenchment is at least #Y 75#!."
 kc_project_irrigation_available_tt: "The Grand Irrigation Basins are at stage #Y [SCOPE.sInternationalOrganization('recipient').MakeScope.GetVariable('kc_project_irrigation_stage').GetValue|0]/5#!."
 kc_project_irrigation_funds_tt: "The Treasury holds the next stage's #Y [SCOPE.sInternationalOrganization('recipient').MakeScope.ScriptValue('kc_project_irrigation_cost')|0]#! gold cost."
 kc_project_irrigation_effect_tt: "Spend #R [SCOPE.sInternationalOrganization('recipient').MakeScope.ScriptValue('kc_project_irrigation_cost')|0]#! Treasury gold to approve the next design. Japan may then enlarge each $kc_concord_irrigation_works$ by one level. A fully supplied Level V complex provides #G +15% Monthly Development Growth#!, #G +25% Food Production#!, and #G +15% Raw Material Output#! in its location."
 kc_project_irrigation_network_4_tt: "Japan maintains at least #Y 4 effective levels#! of $kc_concord_irrigation_works$."
 kc_project_irrigation_network_10_tt: "Japan maintains at least #Y 10 effective levels#! of $kc_concord_irrigation_works$."
 kc_project_irrigation_network_20_tt: "Japan maintains at least #Y 20 effective levels#! of $kc_concord_irrigation_works$."
 kc_project_irrigation_network_35_tt: "Japan maintains at least #Y 35 effective levels#! of $kc_concord_irrigation_works$."

 kc_project_national_floodworks: "Raise the National Floodworks"
 kc_project_national_floodworks_desc: "Bind local levees, spillways, sea walls, and reclaimed lowlands into a common defense against flood and storm. Each commission permits Japan to enlarge its Concord Floodworks by one level."
 kc_project_floodworks_available_tt: "The National Floodworks are at stage #Y [SCOPE.sInternationalOrganization('recipient').MakeScope.GetVariable('kc_project_floodworks_stage').GetValue|0]/5#!."
 kc_project_floodworks_funds_tt: "The Treasury holds the next stage's #Y [SCOPE.sInternationalOrganization('recipient').MakeScope.ScriptValue('kc_project_floodworks_cost')|0]#! gold cost."
 kc_project_floodworks_effect_tt: "Spend #R [SCOPE.sInternationalOrganization('recipient').MakeScope.ScriptValue('kc_project_floodworks_cost')|0]#! Treasury gold to approve the next design. Japan may then enlarge each $kc_concord_floodworks$ by one level. A fully supplied Level V complex provides #G +0.1% Population Growth#!, #G +15% Population Capacity#!, and #G +2.5% Maximum Control#! in its location."
 kc_project_floodworks_network_5_tt: "Japan maintains at least #Y 5 effective levels#! of $kc_concord_floodworks$."
 kc_project_floodworks_network_12_tt: "Japan maintains at least #Y 12 effective levels#! of $kc_concord_floodworks$."
 kc_project_floodworks_network_25_tt: "Japan maintains at least #Y 25 effective levels#! of $kc_concord_floodworks$."
 kc_project_floodworks_network_40_tt: "Japan maintains at least #Y 40 effective levels#! of $kc_concord_floodworks$."

 kc_project_national_kaido: "Extend the National Kaido"
 kc_project_national_kaido_desc: "Join the realm with measured highways, bridges, milestones, post relays, and common maintenance assessments. Each commission extends the road standard farther across Japan."
 kc_project_kaido_unlock_tt: "Concord Entrenchment is at least #Y 85#!."
 kc_project_kaido_available_tt: "The National Kaido Spine is at stage #Y [SCOPE.sInternationalOrganization('recipient').MakeScope.GetVariable('kc_project_kaido_stage').GetValue|0]/5#!."
 kc_project_kaido_funds_tt: "The Treasury holds the next stage's #Y [SCOPE.sInternationalOrganization('recipient').MakeScope.ScriptValue('kc_project_kaido_cost')|0]#! gold cost."
 kc_project_kaido_effect_tt: "Spend #R [SCOPE.sInternationalOrganization('recipient').MakeScope.ScriptValue('kc_project_kaido_cost')|0]#! Treasury gold to complete the next road commission. At the fifth commission, Japan receives #G −2.5 Road Proximity Cost#!, while its provinces receive #G +5% Market Access#! and #G +10% Proximity Efficiency#!."

 kc_project_transmontane_tunnels: "Open the Mountain Passes"
 kc_project_transmontane_tunnels_desc: "Cut galleries, short tunnels, retaining walls, and paved passes through the mountains that divide Japan's markets. Each commission opens a more demanding class of route."
 kc_project_tunnels_available_tt: "The Transmontane Tunnels are at stage #Y [SCOPE.sInternationalOrganization('recipient').MakeScope.GetVariable('kc_project_tunnels_stage').GetValue|0]/5#!."
 kc_project_tunnels_funds_tt: "The Treasury holds the next stage's #Y [SCOPE.sInternationalOrganization('recipient').MakeScope.ScriptValue('kc_project_tunnels_cost')|0]#! gold cost."
 kc_project_tunnels_effect_tt: "Spend #R [SCOPE.sInternationalOrganization('recipient').MakeScope.ScriptValue('kc_project_tunnels_cost')|0]#! Treasury gold to complete the next mountain commission. The fifth commission grants Japan #G −30% Hills Proximity Impact#! and #G −40% Mountains Proximity Impact#!."

 kc_project_inland_sea_harbors: "Issue a Seto Harbor Ordinance"
 kc_project_inland_sea_harbors_desc: "Coordinate dredged channels, breakwaters, beacons, pilots, repair yards, and bonded warehouses along the Inland Sea. Each ordinance permits Japan to enlarge its Seto Harbor Works by one level."
 kc_project_harbors_unlock_tt: "Concord Entrenchment is at least #Y 95#!."
 kc_project_harbors_available_tt: "The Inland Sea Harbor Chain is at stage #Y [SCOPE.sInternationalOrganization('recipient').MakeScope.GetVariable('kc_project_harbors_stage').GetValue|0]/5#!."
 kc_project_harbors_funds_tt: "The Treasury holds the next stage's #Y [SCOPE.sInternationalOrganization('recipient').MakeScope.ScriptValue('kc_project_harbors_cost')|0]#! gold cost."
 kc_project_harbors_effect_tt: "Spend #R [SCOPE.sInternationalOrganization('recipient').MakeScope.ScriptValue('kc_project_harbors_cost')|0]#! Treasury gold to approve the next harbor design. Japan may then enlarge each $kc_seto_harbor_works$ by one level. A fully supplied Level V harbor provides #G +0.25 Harbor Capacity#!, while the fifth ordinance grants Japan #G −10 Port Proximity Cost#!."
 kc_project_harbors_network_3_tt: "Japan maintains at least #Y 3 effective levels#! of $kc_seto_harbor_works$."
 kc_project_harbors_network_7_tt: "Japan maintains at least #Y 7 effective levels#! of $kc_seto_harbor_works$."
 kc_project_harbors_network_12_tt: "Japan maintains at least #Y 12 effective levels#! of $kc_seto_harbor_works$."
 kc_project_harbors_network_20_tt: "Japan maintains at least #Y 20 effective levels#! of $kc_seto_harbor_works$."

 kc_project_outer_port_charters: "Charter the Great Outer Ports"
 kc_project_outer_port_charters_desc: "Carry the mature Seto harbor ordinances to Japan's great outward-facing ports. The charter admits Hakata, Nishisonogi (Nagasaki), Kagoshima, Tsuruga, Nutari (Niigata), Toshima (Edo), and Kameda (Hakodate) to the national harbor register."
 kc_project_late_maritime_settlement_tt: "Japan has completed the #Y Regulation of the Open Seas#!."
 kc_project_harbor_stage_v_tt: "The Inland Sea Harbor Chain has reached #Y Stage V#!."
 kc_project_outer_port_charters_funds_tt: "The Treasury holds the #Y [SCOPE.sInternationalOrganization('recipient').MakeScope.ScriptValue('kc_project_outer_port_charters_cost')|0]#! gold authorization cost."
 kc_project_outer_port_charters_effect_tt: "Spend #R [SCOPE.sInternationalOrganization('recipient').MakeScope.ScriptValue('kc_project_outer_port_charters_cost')|0]#! Treasury gold. Japan may construct $kc_seto_harbor_works$ in #Y Hakata, Nishisonogi (Nagasaki), Kagoshima, Tsuruga, Nutari (Niigata), Toshima (Edo), and Kameda (Hakodate)#!. No harbor is created automatically; every level must still be built, staffed, and maintained."

 kc_project_southern_ocean_harbor_line: "Extend the Southern Ocean Harbor Line"
 kc_project_southern_ocean_harbor_line_desc: "Survey and charter the southern and Pacific coastline from Nishimuro around the Kii peninsula and eastward to Kashima, joining its roads, pilots, breakwaters, and anchorages to the national harbor register."
 kc_project_outer_port_charters_required_tt: "The Concord has chartered the #Y Great Outer Ports#!."
 kc_project_outer_harbor_network_30_tt: "Japan maintains at least #Y 30 effective levels#! of $kc_seto_harbor_works$ across the existing network."
 kc_project_southern_ocean_line_funds_tt: "The Treasury holds the #Y [SCOPE.sInternationalOrganization('recipient').MakeScope.ScriptValue('kc_project_southern_ocean_line_cost')|0]#! gold authorization cost."
 kc_project_southern_ocean_harbor_line_effect_tt: "Spend #R [SCOPE.sInternationalOrganization('recipient').MakeScope.ScriptValue('kc_project_southern_ocean_line_cost')|0]#! Treasury gold. Japanese coastal locations from #Y Nishimuro to Kashima#! may construct $kc_seto_harbor_works$. Every level remains a local construction and maintenance commitment."

 kc_project_national_urban_waterworks: "Commission Urban Waterworks"
 kc_project_national_urban_waterworks_desc: "Carry clean water through wells, covered channels, aqueducts, street drains, and fire cisterns. Each commission permits Japan to enlarge its Urban Water Bureaus by one level."
 kc_project_waterworks_available_tt: "The National Urban Waterworks are at stage #Y [SCOPE.sInternationalOrganization('recipient').MakeScope.GetVariable('kc_project_waterworks_stage').GetValue|0]/5#!."
 kc_project_waterworks_funds_tt: "The Treasury holds the next stage's #Y [SCOPE.sInternationalOrganization('recipient').MakeScope.ScriptValue('kc_project_waterworks_cost')|0]#! gold cost."
 kc_project_waterworks_effect_tt: "Spend #R [SCOPE.sInternationalOrganization('recipient').MakeScope.ScriptValue('kc_project_waterworks_cost')|0]#! Treasury gold to approve the next design. Japan may then enlarge each $kc_urban_water_bureau$ by one level. A fully supplied Level V bureau provides the benefits of a Stream and #G +10% Disease Resistance#! in its location."
 kc_project_waterworks_network_3_tt: "Japan maintains at least #Y 3 effective levels#! of $kc_urban_water_bureau$."
 kc_project_waterworks_network_8_tt: "Japan maintains at least #Y 8 effective levels#! of $kc_urban_water_bureau$."
 kc_project_waterworks_network_15_tt: "Japan maintains at least #Y 15 effective levels#! of $kc_urban_water_bureau$."
 kc_project_waterworks_network_25_tt: "Japan maintains at least #Y 25 effective levels#! of $kc_urban_water_bureau$."
 AUTO_MODIFIER_NAME_kc_urban_waterworks_auto: "National Urban Waterworks"
 kc_project_phase_2_unlock_tt: "The Concord has ratified the ordinances for its #Y later national works#!."

 kc_concord_irrigation_works: "Concord Irrigation Works"
 kc_concord_irrigation_works_desc: "A staffed complex of reservoirs, diversion channels, field drains, sluices, and recorded water rights. Each level follows the latest Basin Commission approved by the Concord."
 kc_concord_irrigation_works_maintenance: "Basin Dredging and Sluice Maintenance"
 kc_seto_harbor_works: "Seto Harbor Works"
 kc_seto_harbor_works_desc: "Dredged approaches, breakwaters, pilot stations, repair yards, and bonded warehouses serving the Inland Sea. Cloth, tar, naval stores, and skilled labor keep the harbor in service."
 kc_seto_harbor_works_maintenance: "Breakwater, Pilot, and Yard Maintenance"
 kc_concord_floodworks: "Concord Floodworks"
 kc_concord_floodworks_desc: "A permanent corps maintaining levees, spillways, sea walls, drainage channels, and reclaimed ground across Japan's vulnerable coasts and lowlands."
 kc_concord_floodworks_maintenance: "Levee and Embankment Maintenance"
 kc_urban_water_bureau: "Urban Water Bureau"
 kc_urban_water_bureau_desc: "A municipal body operating wells, covered channels, aqueducts, street drains, fire cisterns, and clean-water inspections. Each town must construct and maintain its own bureau levels."
 kc_urban_water_bureau_maintenance: "Aqueduct, Drain, and Cistern Maintenance"

 kc_project_charter_megalopolis: "Issue the Metropolitan Charter"
 kc_project_charter_megalopolis_desc: "Gather the realm's surveyors, magistrates, merchants, and builders to replan one city of at least four hundred thousand people as the Concord's foremost metropolis."
 kc_project_megalopolis_unlock_tt: "Concord Entrenchment is at least #Y 100#!."
 kc_project_megalopolis_available_tt: "The Concord has not already issued its unique Metropolitan Charter."
 kc_project_megalopolis_funds_tt: "The Treasury holds at least #Y 10,000#! gold."
 kc_project_megalopolis_location_exists_tt: "Japan owns an #Y urban location#! with at least #Y 400,000 population#!."
 kc_project_megalopolis_effect_tt: "Spend #R 10,000#! Treasury gold. The selected urban location becomes a #Y Megalopolis#! and permanently receives the Metropolitan Charter modifier shown below."
 kc_select_metropolitan_location: "Select the Metropolitan Charter's Urban Location"
 trigger_no_kc_metropolitan_location: "@trigger_no! Japan owns no eligible urban location with at least 400,000 population."

