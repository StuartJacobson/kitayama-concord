 KC_NATIONAL_GREAT_PROJECTS_HEADER: "The National Works Register"
 KC_NATIONAL_GREAT_PROJECTS_DESC: "The Register records five commissions for each great undertaking. Local works must be built, staffed, and maintained before the Concord will authorize a wider design.\nAuthorized stages — Irrigation / Kaido / Harbors: #Y [InternationalOrganizationsView.GetInternationalOrganization.MakeScope.GetVariable('kc_project_irrigation_stage').GetValue|0] / [InternationalOrganizationsView.GetInternationalOrganization.MakeScope.GetVariable('kc_project_kaido_stage').GetValue|0] / [InternationalOrganizationsView.GetInternationalOrganization.MakeScope.GetVariable('kc_project_harbors_stage').GetValue|0]#!\nFloodworks / Tunnels / Waterworks: #Y [InternationalOrganizationsView.GetInternationalOrganization.MakeScope.GetVariable('kc_project_floodworks_stage').GetValue|0] / [InternationalOrganizationsView.GetInternationalOrganization.MakeScope.GetVariable('kc_project_tunnels_stage').GetValue|0] / [InternationalOrganizationsView.GetInternationalOrganization.MakeScope.GetVariable('kc_project_waterworks_stage').GetValue|0]#!"

 kc_maintain_common_granaries: "Maintain Common Granaries"
 kc_maintain_common_granaries_desc: "Coordinate warehouse reserves, emergency purchases and grain transfers across House boundaries."
 kc_treasury_granaries_unlock_tt: "Concord Entrenchment is at least #Y 20#!."
 kc_treasury_granaries_ready_tt: "The Common Granaries have not been maintained during the last #Y 5 years#!."
 kc_treasury_granaries_funds_tt: "The Treasury holds the required #Y [SCOPE.sInternationalOrganization('recipient').MakeScope.ScriptValue('kc_treasury_granary_cost')|2]#! gold."
 kc_maintain_common_granaries_effect_tt: "Spend #R [SCOPE.sInternationalOrganization('recipient').MakeScope.ScriptValue('kc_treasury_granary_cost')|2]#! gold—six months of Japan's current trade-and-tax income, capped at #Y 5,000#!. The modifier shown below applies to every Concord member for #Y 5 years#!."

 kc_fund_common_security: "Fund Common Security"
 kc_fund_common_security_desc: "Pay for permanent state forces and the registered manpower and sailors retained by Chartered Houses."
 kc_treasury_security_unlock_tt: "The Concord has resolved #Y The Unquiet Peace#!."
 kc_treasury_security_ready_tt: "Common Security has not received an appropriation during the last #Y 5 years#!."
 kc_treasury_security_funds_tt: "The Treasury holds the required #Y [SCOPE.sInternationalOrganization('recipient').MakeScope.ScriptValue('kc_treasury_security_cost')|2]#! gold."
 kc_fund_common_security_effect_tt: "Spend #R [SCOPE.sInternationalOrganization('recipient').MakeScope.ScriptValue('kc_treasury_security_cost')|2]#! gold—eight months of Japan's current trade-and-tax income, capped at #Y 5,000#!. The two modifiers shown below apply to Japan and the Chartered Houses for #Y 5 years#!; active laws still determine House force targets."

 kc_underwrite_maritime_ventures: "Underwrite Maritime Ventures"
 kc_underwrite_maritime_ventures_desc: "Insure commercial voyages, standardize contracts and provision the patrol and merchant vessels of Japan's maritime Houses."
 kc_treasury_maritime_unlock_tt: "Concord Entrenchment is at least #Y 60#! and the maritime-law settlement is available."
 kc_treasury_maritime_ready_tt: "Maritime Ventures have not been underwritten during the last #Y 5 years#!."
 kc_treasury_maritime_funds_tt: "The Treasury holds the required #Y [SCOPE.sInternationalOrganization('recipient').MakeScope.ScriptValue('kc_treasury_maritime_cost')|2]#! gold."
 kc_underwrite_maritime_ventures_effect_tt: "Spend #R [SCOPE.sInternationalOrganization('recipient').MakeScope.ScriptValue('kc_treasury_maritime_cost')|2]#! gold—nine months of Japan's current trade-and-tax income, capped at #Y 5,000#!. The modifier shown below applies to Japan and every Chartered House for #Y 5 years#!."

