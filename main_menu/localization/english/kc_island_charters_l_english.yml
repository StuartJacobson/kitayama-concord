 kc_concord_lose_4_cohesion_tt: "The Concord loses #R 4 Cohesion#!."
 kc_southern_islands_survey_claim: "the Southern Islands Survey"
 kc_luzon_compact_settlement_rights: "the Luzon Commercial Compact"
 kc_visayas_compact_settlement_rights: "the Visayan Commercial Compact"
 kc_mindanao_compact_settlement_rights: "the Mindanao Commercial Compact"
 kc_cb_southern_island_settlement: "Southern Island Settlement"
 kc_cb_southern_island_settlement_desc: "During the thirty-year warrant of the Southern Islands Survey, Japan may impose a settlement upon a surviving Ryukyuan court without first constructing a spy network."

 kc_southern_islands.1.title: "The Southern Islands Survey"
 kc_southern_islands.1.desc: "The Houses of Translation have assembled pilots' notes for Taiwan, the Ryukyus, and the sea roads leading toward Luzon. A chart alone grants no lawful right to settle or negotiate. The Concord must now warrant a survey and decide whether its soundings belong to the common register, the Chartered Houses, or the court. Whichever sponsor is chosen, Japan will receive exclusive settlement rights in Taiwan and a thirty-year mandate to settle relations with the Ryukyuan courts."
 kc_southern_islands.1.a: "Fund a common hydrographic survey."
 kc_southern_islands.1.b: "License the charts to the Chartered Houses."
 kc_southern_islands.1.c: "Place the pilots beneath court warrant."
 kc_southern_islands_access_tt: "For #Y 30 years#!, Japan receives exclusive colonial claims throughout #Y Taiwan#! and a #Y Southern Island Settlement#! casus belli against the surviving Ryukyuan courts. Unused Taiwanese claims expire with the survey mandate."

 kc_red_seal_charters.1.title: "The Ships Without One Law"
 kc_red_seal_charters.1.desc: "Japanese ships now sail beneath a confusion of House seals, court letters, port licenses, and private promises. Foreign governors cannot tell which warrant binds Japan, while captains exploit every disagreement. A vermilion seal could make the right to sail legible across the southern seas—but only after the Concord decides who may issue it."
 kc_red_seal_charters.1.a: "Issue every warrant through the common register."
 kc_red_seal_charters.1.b: "Permit accredited Houses to warrant their own ships."
 kc_red_seal_charters.1.c: "Reserve oceanic warrants to the court."
 kc_red_seal_charters.2.title: "The Counterfeit Vermilion Seal"
 kc_red_seal_charters.2.desc: "A vessel seized abroad carries a seal copied closely enough to pass at a distant harbor. Its cargo is lawful, its captain insists that he bought the warrant honestly, and three offices deny responsibility. Unless the Concord can verify seals and assign liability, the new system will merely reproduce the disorder it was meant to end."
 kc_red_seal_charters.2.a: "Pay for numbered seals and a common verification office."
 kc_red_seal_charters.2.b: "Require each House to stand surety for its captains."
 kc_red_seal_charters.2.c: "Close the registry and reissue warrants under guard."
 kc_red_seal_charters.3.title: "Who Answers Beyond the Sea?"
 kc_red_seal_charters.3.desc: "A merchant dispute in a foreign port has become a question of jurisdiction. The local ruler demands compensation; the captain invokes his Japanese warrant; and the sponsoring House claims that its liability ended when the ship cleared harbor. The seal must now declare not only who may sail, but who answers for Japanese conduct abroad."
 kc_red_seal_charters.3.a: "Let the common maritime courts answer for every seal."
 kc_red_seal_charters.3.b: "Make captains and sponsoring Houses answer together."
 kc_red_seal_charters.3.c: "Appoint court consuls in the licensed ports."
 kc_red_seal_charters.4.title: "The Register of Vermilion Sails"
 kc_red_seal_charters.4.desc: "The first complete register records every oceanic warrant, its guarantor, its captain, and the court that will hear claims against it. The initial sponsor gave the system momentum, but precedent does not bind the final constitution. Japan must decide whether the red seal represents common law, House concession, or court protection."
 kc_red_seal_charters.4.a: "Publish the Common Register of Vermilion Sails."
 kc_red_seal_charters.4.b: "Confirm the Red-Seal House Concessions."
 kc_red_seal_charters.4.c: "Establish the Court-Warranted Convoys."

 kc_ryukyu_settlement.1.title: "The Ryukyuan Memorial"
 kc_ryukyu_settlement.1.desc: "Envoys from Urasoe arrive with port registers, tribute precedents, and competing copies of the southern charts. Whether their court is independent, subordinate, or already displaced by direct Japanese rule, the islands require a durable place in the maritime order. The opening delegation will influence the talks, but it will not bind the final constitution."
 kc_ryukyu_settlement.1.a: "Convene a common conference of island ports."
 kc_ryukyu_settlement.1.b: "Let the Chartered Houses conduct the preliminary talks."
 kc_ryukyu_settlement.1.c: "Receive the memorial through the court."
 kc_ryukyu_settlement.2.title: "The Ryukyu Settlement of 1609"
 kc_ryukyu_settlement.2.desc: "The sea roads between Kyushu and Taiwan can no longer be governed by temporary surveys. The political condition of Urasoe now determines the settlement before us: an independent court may be recognized or brought beneath the Concord; an existing Japanese subject may receive a durable constitution; and directly governed islands may remain crown ports or be restored to local government."
 kc_ryukyu_settlement.2.a: "Recognize an independent Ryukyuan League of Ports."
 kc_ryukyu_settlement.2.b: "Purchase a compact and establish a Concord Protectorate."
 kc_ryukyu_settlement.2.c: "Grant the islands as a privileged House commission."
 kc_ryukyu_settlement.2.d: "Recharter our subject as a self-governing league of ports."
 kc_ryukyu_settlement.2.e: "Place our subject beneath the common protectorate charter."
 kc_ryukyu_settlement.2.f: "Entrust our subject to the Chartered Houses."
 kc_ryukyu_settlement.2.g: "Retain the islands as directly governed crown ports."
 kc_ryukyu_settlement.2.h: "Restore local government beneath a Concord Protectorate."
 kc_ryukyu_settlement.2.i: "Create a privileged House commission from the islands."

 kc_common_southern_hydrography: "Common Southern Hydrography"
 kc_common_southern_hydrography_desc: "Soundings and pilot books are copied into the common maritime register."
 kc_house_southern_charts: "Licensed Southern Charts"
 kc_house_southern_charts_desc: "Chartered Houses finance surveys and sell reliable sailing directions through their own networks."
 kc_court_southern_pilotage: "Court-Warranted Pilotage"
 kc_court_southern_pilotage_desc: "Court seals certify the pilots and charts admitted to the southern routes."
 kc_red_seal_common_warrants: "Common Red-Seal Warrants"
 kc_red_seal_common_warrants_desc: "Oceanic shipping warrants are issued through a common register."
 kc_red_seal_house_warrants: "House Red-Seal Warrants"
 kc_red_seal_house_warrants_desc: "Accredited Houses issue warrants to captains for whom they accept liability."
 kc_red_seal_court_warrants: "Court Red-Seal Warrants"
 kc_red_seal_court_warrants_desc: "The court reserves the authority to warrant oceanic voyages."
 kc_red_seal_verified_register: "Verified Vermilion Registry"
 kc_red_seal_verified_register_desc: "Numbered seals and copied registers make fraudulent warrants easier to expose."
 kc_red_seal_house_sureties: "House Sureties for Captains"
 kc_red_seal_house_sureties_desc: "Every sponsoring House must answer financially for the conduct of its licensed ships."
 kc_red_seal_closed_registry: "Reissued Court Registry"
 kc_red_seal_closed_registry_desc: "The registry has been closed, audited, and reissued beneath tighter guard."
 kc_red_seal_common_jurisdiction: "Common Maritime Jurisdiction"
 kc_red_seal_common_jurisdiction_desc: "Common courts hear foreign claims arising from any Japanese warrant."
 kc_red_seal_captains_jurisdiction: "Joint Liability at Sea"
 kc_red_seal_captains_jurisdiction_desc: "Captains and their sponsoring Houses share liability beyond Japan."
 kc_red_seal_consular_jurisdiction: "Court Consuls Abroad"
 kc_red_seal_consular_jurisdiction_desc: "Court-appointed consuls represent licensed Japanese shipping in foreign ports."
 kc_red_seal_common_register_legacy: "Common Register of Vermilion Sails"
 kc_red_seal_common_register_legacy_desc: "A national register makes Japanese oceanic shipping an institution of common law."
 kc_red_seal_house_concessions_legacy: "Red-Seal House Concessions"
 kc_red_seal_house_concessions_legacy_desc: "Chartered Houses possess broad authority to sponsor, supply, and govern oceanic ventures."
 kc_red_seal_court_convoys_legacy: "Court-Warranted Convoys"
 kc_red_seal_court_convoys_legacy_desc: "Court guarantees and organized convoys represent Japan across the southern seas."
 kc_ryukyu_league_of_ports: "Ryukyuan League of Ports"
 kc_ryukyu_league_of_ports_desc: "Japan recognizes the island courts as commercial partners along the route to Taiwan."
 kc_ryukyu_common_conference: "Common Ryukyuan Conference"
 kc_ryukyu_common_conference_desc: "Secretariat officers reconcile island petitions with the common maritime register."
 kc_ryukyu_house_conference: "House Negotiations at Urasoe"
 kc_ryukyu_house_conference_desc: "Chartered Houses use their southern contacts to prepare the settlement."
 kc_ryukyu_court_conference: "Court Reception of the Ryukyuan Memorial"
 kc_ryukyu_court_conference_desc: "The court receives the island petitions as a matter of diplomatic precedent."
 kc_ryukyu_recognized_partnership: "Recognized Ryukyuan Partnership"
 kc_ryukyu_recognized_partnership_desc: "The island government retains broad autonomy beneath a negotiated maritime partnership."
 kc_ryukyu_concord_protectorate: "Concord Protectorate of Ryukyu"
 kc_ryukyu_concord_protectorate_desc: "Common guarantees bind the Ryukyuan ports to Japan while preserving local government."
 kc_ryukyu_privileged_concession: "Privileged Ryukyuan Concession"
 kc_ryukyu_privileged_concession_desc: "Chartered Houses administer the islands as a privileged commercial commission."
 kc_ryukyu_direct_crown_ports: "Ryukyuan Crown Ports"
 kc_ryukyu_direct_crown_ports_desc: "Japan retains direct administration of the island ports and their sea lanes."

