 kc_debug.63.title: "Test the Southern Islands Survey"
 kc_debug.63.desc: "The first option opens the survey ratification with its normal thirty-year cleanup. The second immediately removes existing survey claims. The third grants the access and schedules its authoritative cleanup for the following day."
 kc_debug.63.a: "Open the Southern Islands Survey."
 kc_debug.63.b: "Expire the survey's settlement rights now."
 kc_debug.63.c: "Grant access and test cleanup tomorrow."
 kc_debug.64.title: "Test the Red-Seal Charters"
 kc_debug.64.desc: "Starts all four Red-Seal Charter events one day apart, clears prior outcomes, and funds the verification choice."
 kc_debug.64.a: "Begin the rapid Red-Seal test."
 kc_debug.65.title: "Test the Ryukyu Settlement"
 kc_debug.65.desc: "Starts the two-event 1609 settlement one day apart for the current owner of Urasoe. Test independent, Japanese-subject, and directly administered Ryukyu from separate reloads."
 kc_debug.65.a: "Open the current Ryukyu settlement."
