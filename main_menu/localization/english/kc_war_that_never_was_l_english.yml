 kc_debug.38.title: "Debug: Begin the War That Never Was"
 kc_debug.38.desc: "Prepare representative Concord precedents, set Cohesion to 70, fund Japan and the common Treasury, clear the crisis completion markers, and directly activate the War That Never Was Situation. Use this only from a formed-Concord save when the Situation is not already active."
 kc_debug.38.a: "Begin the constitutional crisis."
 kc_debug.38.b: "Cancel."
 kc_debug.39.title: "Debug: Advance the War That Never Was"
 kc_debug.39.desc: "Move the active Situation to immediately before a selected incident. Advance one month after choosing. Incidents already completed in this save will not repeat."
 kc_debug.39.a: "Advance to the Election Deadlock (19.90)."
 kc_debug.39.b: "Advance to the Credit Freeze (34.90)."
 kc_debug.39.c: "Advance to Warehouses Under Seal (49.90)."
 kc_debug.39.d: "Advance to Kyoto Without Barricades (64.90)."
 kc_debug.39.e: "Advance to the Withheld Tallies (79.90)."
 kc_debug.39.f: "Advance to the Final Convention (89.90)."
