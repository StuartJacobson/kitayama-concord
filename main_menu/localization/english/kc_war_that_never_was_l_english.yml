l_english:
 kc_war_that_never_was: "The War That Never Was"
 kc_war_that_never_was_desc: "The rivalries that once might have divided Japan into a national civil war now move through ballots, credit, warehouses, patrol jurisdictions, and the custody of foreign trade. The Concord must turn accumulated precedent into a settlement before constitutional competition becomes armed faction.\n\nSettlement Progress: #Y [GetSituationByKey('kc_war_that_never_was').MakeScope.GetVariable('kc_wnw_settlement_progress').GetValue] / 100#!\nCurrent Monthly Progress: #G [GetSituationByKey('kc_war_that_never_was').MakeScope.GetVariable('kc_wnw_monthly_progress').GetValue]#!\n\nThe crisis applies #R -0.15 monthly Cohesion#!. Progress begins at #G 0.30#! each month. Peace, Cohesion, and a funded Concord Secretariat accelerate negotiation; war and Cohesion below 25 delay it. Earlier constitutional precedents improve the corresponding incident without restricting the available choices."
 kc_war_that_never_was_monthly_tt: "The settlement gains #G 0.30 Progress#! each month. Peace adds #G 0.10#!; war subtracts #R 0.15#!. Cohesion adds #G 0.05#! at 40, #G 0.10#! at 60, or #G 0.15#! at 80; Cohesion below 25 subtracts #R 0.15#!. A funded Concord Secretariat adds #G 0.05#!. The unresolved crisis also costs #R 0.15 Cohesion#! each month."
 KC_COHESION_WAR_THAT_NEVER_WAS: "The War That Never Was"
 kc_war_that_never_was_end_tt: "Reach #Y 100 Settlement Progress#! after choosing a settlement at the Final Convention. The Situation also ends without its rewards if Japan or the Kitayama Concordate ceases to exist, or if the Concord collapses."
 kc_war_that_never_was_map_state_tt: "Land administered directly by the Concord State during the constitutional deadlock."
 kc_war_that_never_was_map_house_tt: "Land represented by a Chartered House in the rival council coalitions."
 KC_WNW_LEGEND_STATE: "Concord State"
 KC_WNW_LEGEND_HOUSES: "Chartered Houses"
 KC_WNW_SETTLEMENT_PROGRESS: "Settlement Progress"
 KC_WNW_MONTHLY_PROGRESS: "Monthly Progress"
 KC_WNW_COUNCIL_OVERVIEW: "The Rival Councils"
 KC_WNW_PANEL_OVERVIEW: "No armies have entered Kyoto, yet the pressures of the historical Onin War have appeared in constitutional form. Rival coalitions dispute electoral procedure, freeze one another's credit, place seals on warehouses, organize competing patrols, and withhold the tallies of foreign trade. Each incident tests a precedent created by the Concord's earlier history. Resolve them and reach 100 Settlement Progress before the commercial peace becomes only a pause before war."
 KC_WNW_ELECTION_MILESTONE: "The Election Deadlock - 20"
 KC_WNW_CREDIT_MILESTONE: "The Credit Freeze - 35"
 KC_WNW_WAREHOUSE_MILESTONE: "Warehouses Under Seal - 50"
 KC_WNW_ORDER_MILESTONE: "Kyoto Without Barricades - 65"
 KC_WNW_TALLIES_MILESTONE: "The Withheld Tallies - 80"
 KC_WNW_CONVENTION_MILESTONE: "The Final Convention - 90"
 KC_WNW_INCIDENT_COMPLETE: "Concluded"
 KC_WNW_INCIDENT_PENDING: "Pending"

 kc_war_never_was.1.title: "The War That Never Was"
 kc_war_never_was.1.desc: "Two coalitions arrive in Kyoto carrying claims that would once have been written on banners. Senior Houses dispute the rules of the next election. Lenders refuse paper endorsed by the opposing faction. Port councils and House officers place rival seals upon the same warehouses, while armed retainers insist that they are only guarding lawful property.\n\nIn another Japan these quarrels might have become the Onin War: ten years of street fighting, burned temples, ruined estates, and a shogunate unable to command the provinces. The Kitayama settlement has removed the ordinary road to civil war, but it has not removed ambition, succession, debt, or fear. The conflict will be fought through the institutions the Concord created—or those institutions will prove to be no stronger than paper."
 kc_war_never_was.1.a: "Let every claim be entered in the register."
 kc_wnw_opening_tt: "The #Y War That Never Was#! Situation has begun. It will normally last approximately #Y seven to ten years#!. The unresolved deadlock costs #R 0.15 Cohesion each month#! and temporarily weakens Japan's council and the commerce of every Concord member. Incidents occur at #Y 20, 35, 50, 65, 80, and 90 Settlement Progress#!."

 kc_war_never_was.2.title: "The Election Deadlock"
 kc_war_never_was.2.desc: "The rival coalitions do not dispute that the shogun must be elected. They dispute who may nominate, when an election becomes necessary, whether an incumbent House may designate continuity, and what role remains for the imperial court when no ballot commands a majority. Every procedural ruling appears neutral until one asks which coalition it favors."
 kc_war_never_was.2.a: "Let the Senior Houses settle nominations among themselves."
 kc_war_never_was.2.b: "Publish a permanent electoral calendar and procedure."
 kc_war_never_was.2.c: "Ask the Tenno to mediate precedence, not policy."
 kc_wnw_election_house_tt: "Gain #G 2 Cohesion#! and #G 3 Settlement Progress#!, and add a #Y House argument#! to the final convention. If the post-founder settlement entrusted continuity to the Houses, gain an additional #G 2 Progress#!."
 kc_wnw_election_common_tt: "Lose #R 5 Cohesion#!, gain #G 6 Settlement Progress#!, move toward #Y Innovative#!, and add a #Y Common argument#! to the final convention. If the Secretariat inherited the founder's records, reduce the net Cohesion loss to #R 3#! and gain an additional #G 2 Progress#!."
 kc_wnw_election_court_tt: "Gain #G 1 Cohesion#!, #G 4 Settlement Progress#!, a mild amount of Legitimacy, and Clergy satisfaction. If the court inherited the founder's records, gain an additional #G 2 Progress#!."

 kc_war_never_was.3.title: "The Credit Freeze"
 kc_war_never_was.3.desc: "The coalitions discover that a chartered peace can be strangled without drawing a sword. Houses refuse to honor notes carried by their rivals, temple lenders call in politically exposed debts, and merchants hoard coin against an expected cancellation. The Shōchō settlement offers a precedent—but applying it to the greatest Houses will reveal what that precedent truly meant."
 kc_war_never_was.3.a: "Declare a temporary tokusei for disputed obligations."
 kc_war_never_was.3.b: "Reopen every account before Concord mediators."
 kc_war_never_was.3.c: "Guarantee registered contracts without exception."
 kc_wnw_credit_tokusei_tt: "Lose #R 4 Cohesion#!, gain #G 4 Settlement Progress#!, add a #Y Common argument#!, and receive #Y Emergency Debt Moratorium#! for five years. If debt cancellation was the Shōchō precedent, reduce the net Cohesion loss to #R 3#! and gain an additional #G 2 Progress#!."
 kc_wnw_credit_mediation_tt: "Spend Treasury funds equal to #R 4 months#! of Japan's trade-and-tax income, then gain #G 2 Cohesion#! and #G 6 Settlement Progress#!. If mediated repayment was the Shōchō precedent, gain an additional #G 3 Progress#!."
 kc_wnw_credit_contracts_tt: "Lose #R 5 Cohesion#!, gain #G 5 Settlement Progress#!, add a #Y House argument#!, and receive #Y Guaranteed Contracts#! for five years. If strict enforcement was the Shōchō precedent, reduce the net Cohesion loss to #R 3#! and gain an additional #G 2 Progress#!."

 kc_war_never_was.4.title: "Warehouses Under Seal"
 kc_war_never_was.4.desc: "At Sakai, Hakata, and Hyogo, the same bales of silk and sacks of rice now bear seals from a municipal council, a Chartered House, and the Concord customs office. None admits to seizure; each merely refuses removal until lawful ownership is established. Prices rise while guards sleep beside cargoes too valuable to release and too dangerous to confiscate."
 kc_war_never_was.4.a: "Entrust disputed cargoes to the municipal councils."
 kc_war_never_was.4.b: "Inventory every warehouse under Concord seals."
 kc_war_never_was.4.c: "Recognize the custodial compacts of the Houses."
 kc_wnw_warehouses_municipal_tt: "Lose #R 3 Cohesion#! and gain #G 4 Settlement Progress#!, improve Burgher satisfaction, and move toward #Y Plutocracy#!. If municipal port autonomy is established precedent, gain an additional #G 3 Progress#!."
 kc_wnw_warehouses_concord_tt: "Spend Treasury funds equal to #R 2 months#! of Japan's trade-and-tax income, lose #R 4 Cohesion#!, gain #G 7 Settlement Progress#!, move toward #Y Innovative#!, and add a #Y Common argument#!. If Concord port administration is established precedent, reduce the net Cohesion loss to #R 3#! and gain an additional #G 3 Progress#!."
 kc_wnw_warehouses_house_tt: "Lose #R 6 Cohesion#!, gain #G 5 Settlement Progress#!, improve Noble and Burgher satisfaction, and add a #Y House argument#!. If House port compacts are established precedent, reduce the net Cohesion loss to #R 4#! and gain an additional #G 3 Progress#!."

 kc_war_never_was.5.title: "Kyoto Without Barricades"
 kc_war_never_was.5.desc: "Retainers gather at coalition residences, guilds close streets around their storehouses, and temple precincts admit refugees from districts where rival patrols exchange insults. The city has not become a battlefield. Keeping it from becoming one requires someone to exercise force—and every available force carries a constitutional claim."
 kc_war_never_was.5.a: "Place the capital under the Concord Constabulary."
 kc_war_never_was.5.b: "Negotiate joint patrols with wards, guilds, and temples."
 kc_war_never_was.5.c: "Register House watches and divide their jurisdictions."
 kc_war_never_was.5.d: "Let the factions exhaust themselves without recognition."
 kc_wnw_order_constabulary_tt: "Spend Treasury funds equal to #R 4 months#! of Japan's trade-and-tax income, lose #R 4 Cohesion#!, gain #G 8 Settlement Progress#!, move toward #Y Conciliatory#!, and add a #Y Common argument#!. If central patrols are established precedent, reduce the net Cohesion loss to #R 3#! and gain an additional #G 3 Progress#!."
 kc_wnw_order_negotiated_tt: "Gain #G 2 Cohesion#! and #G 6 Settlement Progress#!, and improve Burgher and Peasant satisfaction. If negotiated enforcement is established precedent, gain an additional #G 3 Progress#!."
 kc_wnw_order_houses_tt: "Lose #R 5 Cohesion#! and gain #G 5 Settlement Progress#!, improve Noble satisfaction, and add a #Y House argument#!. If House patrols are established precedent, reduce the net Cohesion loss to #R 3#! and gain an additional #G 3 Progress#!."
 kc_wnw_order_disorder_tt: "Lose #R 8 Cohesion#!, gain #G 3 Settlement Progress#!, move toward #Y Belligerent#!, and suffer #Y Tolerated Disorder#! for five years. If tolerated maritime disorder is established precedent, reduce the net Cohesion loss to #R 6#! and gain an additional #G 3 Progress#!."

 kc_war_never_was.6.title: "The Withheld Tallies"
 kc_war_never_was.6.desc: "The last usable halves of the foreign trade tallies lie in three different archives. Court custodians refuse to release their pieces without recognition of ritual authority. Concord registrars refuse to match unrecorded allotments. Maritime Houses threaten to sail under their own guarantees. Foreign merchants wait while Japan's richest trade route becomes another ballot in the factional struggle."
 kc_war_never_was.6.a: "Let the court issue the tallies under its sanction."
 kc_war_never_was.6.b: "Reunite every tally in the Concord register."
 kc_war_never_was.6.c: "Divide the allotments among the maritime Houses."
 kc_wnw_tallies_court_tt: "Gain #G 1 Cohesion#! and #G 4 Settlement Progress#!, a mild amount of Legitimacy, and Clergy satisfaction. If court-sanctioned foreign commerce is established precedent, gain an additional #G 3 Progress#!."
 kc_wnw_tallies_concord_tt: "Spend Treasury funds equal to #R 2 months#! of Japan's trade-and-tax income, lose #R 4 Cohesion#!, gain #G 7 Settlement Progress#!, move toward #Y Innovative#!, and add a #Y Common argument#!. If the Concord tally register is established precedent, reduce the net Cohesion loss to #R 3#! and gain an additional #G 3 Progress#!."
 kc_wnw_tallies_houses_tt: "Lose #R 6 Cohesion#!, gain #G 5 Settlement Progress#!, improve Noble and Burgher satisfaction, and add a #Y House argument#!. If House tally allotments are established precedent, reduce the net Cohesion loss to #R 4#! and gain an additional #G 3 Progress#!."

 kc_war_never_was.7.title: "The Final Convention"
 kc_war_never_was.7.desc: "Years of rulings have reopened the roads, released the warehouses, and made rival obligations clear again. The coalitions remain, but neither can pretend that it could have prevailed without institutions recognized by the other. The final convention must decide whether peace rests upon the liberties of coequal Houses, a dual covenant between charters and common offices, or a public ordinance binding every corporation in Japan."
 kc_war_never_was.7.a: "Seal the Compact of Coequal Houses."
 kc_war_never_was.7.b: "Ratify the Dual Covenant."
 kc_war_never_was.7.c: "Promulgate the Ordinance of Public Peace."
 kc_wnw_final_house_tt: "Gain #G 10 Settlement Progress#! and choose the #Y Compact of Coequal Houses#!. If at least two earlier incidents produced House arguments, immediately gain #G 2 Cohesion#!. The completed settlement later contributes toward #Y House Privilege#!."
 kc_wnw_final_balanced_tt: "Spend Treasury funds equal to #R 4 months#! of Japan's trade-and-tax income, gain #G 10 Settlement Progress#! and a mild amount of Legitimacy, and choose the balanced #Y Dual Covenant#!."
 kc_wnw_final_common_tt: "Lose #R 5 Cohesion#!, gain #G 10 Settlement Progress#!, move toward #Y Innovative#!, and choose the #Y Ordinance of Public Peace#!. If at least two earlier incidents produced Common arguments, reduce the net Cohesion loss to #R 3#!. The completed settlement later contributes toward #Y Concord Commonwealth#!."

 kc_war_never_was.10.title: "The Compact of Coequal Houses"
 kc_war_never_was.10.desc: "The coalition residences empty without surrendering their banners. Each House accepts that its liberties survive only because its rivals possess the same right to nomination, custody, contract, and patrol under published rules. The Compact turns faction into a recognized part of Concord government: dangerous when concealed, legitimate when entered into the register. No district of Kyoto has burned for the sake of deciding it."
 kc_war_never_was.10.a: "Let rivalry remain constitutional."
 kc_wnw_house_outcome_tt: "The crisis ends with #G 2 Cohesion#! and #Y Compact of Coequal Houses#! for #Y 20 years#!: #G +6% Global Merchant Power#!, #G +4% Trade Income#!, #G +0.2% Estate Satisfaction Recovery#!, and #G +0.05 monthly Cohesion#!. At the Hundred-Year Concord this settlement contributes #Y 20#! toward #Y House Privilege#!."

 kc_war_never_was.11.title: "The Dual Covenant"
 kc_war_never_was.11.desc: "The settlement declares that every common office originates in chartered consent, but that every accepted office thereafter owes duties to Japan as a whole. Houses may organize factions, nominate candidates, and guard inherited privileges; the Concord may publish procedures, audit shared obligations, and compel each coalition to recognize the lawful acts of the other."
 kc_war_never_was.11.a: "Two claims will preserve one peace."
 kc_wnw_balanced_outcome_tt: "The crisis ends with #G 2 Cohesion#! and the #Y Dual Covenant#! for #Y 20 years#!: #G +5% Cabinet Efficiency#!, #G +1 Diplomatic Reputation#!, #G +3% Trade Income#!, and #G +0.05 monthly Cohesion#!. It creates no movement on the later constitutional societal value."

 kc_war_never_was.12.title: "The Ordinance of Public Peace"
 kc_war_never_was.12.desc: "The ordinance does not abolish the Houses; it binds them to institutions that no single House may suspend. Elections follow a common calendar, registered contracts cross factional lines, public seals protect disputed cargo, and peace officers answer to published jurisdictions. The rival coalitions leave Kyoto knowing that they have lost the freedom to make their private quarrel the law of Japan—and gained a state strong enough to preserve their commerce."
 kc_war_never_was.12.a: "No private quarrel shall close the public road."
 kc_wnw_common_outcome_tt: "The crisis ends with #G 1 Cohesion#! and the #Y Ordinance of Public Peace#! for #Y 20 years#!: #G +8% Cabinet Efficiency#!, #G -5% Change Policy Cost#!, #G +5% Building Construction Efficiency#!, and #G +0.05 monthly Cohesion#!. At the Hundred-Year Concord this settlement contributes #Y 20#! toward #Y Concord Commonwealth#!."

 kc_war_never_was.13.title: "The Convention Disperses"
 kc_war_never_was.13.desc: "The delegates depart before their rulings can become a settlement. Whether war, collapse, or the end of the Concordate made their work irrelevant, the abandoned registers show how close Japan came to containing its rivalries without force—and how quickly commercial competition can recover its old banners when no common judgment remains."
 kc_war_never_was.13.a: "The war has found another road."

