l_english:
 kc_great_reckoning: "The Great Reckoning"
 kc_great_reckoning_desc: "The Concord's prosperity has outgrown its customary levies, private ledgers, toll exemptions, and improvised guarantees. Until Japan establishes who may assess the Chartered Houses and who must finance common institutions, the compact cannot become fully entrenched."
 kc_great_reckoning_completion_action_tt: "One of the three fiscal settlements has been enacted through the Kitayama Concord's Main Actions."
 kc_great_reckoning_settlements_header: "The Three Fiscal Settlements"
 kc_great_reckoning_settlements_desc: "Japan may enact any settlement through the Concord's Main Actions after seven years.\n\n#Y Guarantees of the Great Houses#! require Customary Assessments, 70 Cohesion, and eight Senior Houses. The mandate reduces this to six.\n\n#Y Registered Apportionment#! requires Registered Cadasters and 55 Cohesion.\n\n#Y The Common Treasury#! requires Common Kenchi, 35 Cohesion, and three levels of the Concord Ledger Office.\n\nThe matching maritime policy reduces each Treasury charge. The opening mandate provides a separate discount but never locks a settlement."

 kc_great_reckoning.1.title: "The Great Reckoning"
 kc_great_reckoning.1.desc: "Road funds, convoy licenses, mediations, and public offices have turned the Kitayama Concord into more than a promise of peace. Its revenues, however, still depend upon extraordinary appeals and inconsistent House accounts. Senior Houses invoke chartered exemptions, lesser Houses demand equal measures, and officials in Kyoto cannot distinguish poverty from concealment. We must prepare a settlement before suspicion consumes the compact."
 kc_great_reckoning.1.a: "Summon the Senior Guarantors"
 kc_great_reckoning.1.b: "Commission a General Register"
 kc_great_reckoning.1.c: "Open the Books to the Concord"
 kc_great_reckoning_guarantees_choice_tt: "All settlements remain available.\n\nChartered Houses become much more likely to support #Y Customary Assessments#! and #Y House Port Privileges#!.\n\n#Y Guarantees of the Great Houses#! will require only #Y 6#! Senior Houses instead of 8 and receives a Treasury discount."
 kc_great_reckoning_register_choice_tt: "All settlements remain available.\n\nChartered Houses become much more likely to support #Y Registered Cadasters#! and #Y Licensed Coastal Convoys#!.\n\n#Y Registered Apportionment#! receives a Treasury discount."
 kc_great_reckoning_public_choice_tt: "All settlements remain available.\n\nChartered Houses become much more likely to support #Y Common Kenchi#! and the #Y Concord Maritime Board#!.\n\nOne free level of the #Y Concord Ledger Office#! is constructed in Japan's capital and #Y The Common Treasury#! receives a Treasury discount."

 kc_great_reckoning.2.title: "The Books Are Called In"
 kc_great_reckoning.2.desc: "Japan has ordered a reckoning of the obligations that bind the Chartered Houses to the Concord. Commerce will remain unsettled until a common fiscal constitution is accepted."
 kc_great_reckoning.2.a: "Our ledgers will be ready."

 kc_great_reckoning.3.title: "Two Ledgers for One House"
 kc_great_reckoning.3.desc: "Receipts copied at a House's Kaisho bear little resemblance to the accounts presented in Kyoto. The House insists that customary gifts, temple guarantees, and local obligations cannot be expressed in the Concord's measures. Its rivals call the discrepancy concealed revenue."
 kc_great_reckoning.3.a: "Fund a commission of auditors."
 kc_great_reckoning.3.b: "Accept provisional figures and their consequences."
 kc_great_reckoning.3.c: "Let the Houses judge one another."

 kc_great_reckoning.4.title: "The Toll Gates of the Inland Sea"
 kc_great_reckoning.4.desc: "A convoy has paid House dues, harbor charges, temple tolls, and a Concord assessment on the same cargo. Its merchants refuse to sail again until someone determines which obligations are legitimate."
 kc_great_reckoning.4.a: "Redeem the disputed tolls and survey the route."
 kc_great_reckoning.4.b: "Recognize the old gates for the present."
 kc_great_reckoning.4.c: "Order the Houses to divide the proceeds."

 kc_great_reckoning.5.title: "A Run on House Credit"
 kc_great_reckoning.5.desc: "Rumors that one Senior House has overstated its guarantees spread from sakaya lenders to temple storehouses. Notes once accepted across western Japan are refused by sunset, and every creditor asks whether the Concord stands behind private promises."
 kc_great_reckoning.5.a: "Back a common examination of the guarantees."
 kc_great_reckoning.5.b: "Permit a contraction while sound accounts emerge."
 kc_great_reckoning.5.c: "The Houses issued these promises; the Houses must answer."

 kc_great_reckoning.10.title: "The Guarantees of the Great Houses"
 kc_great_reckoning.10.desc: "The Senior Houses have accepted the burden of guaranteeing the Concord's common expenses. Their charters remain privileged, but privilege now carries a public obligation. Ordinary Houses offer only a token assessment while the guarantors provide the greater share.\n\nThe comparison of accounts, measures, and obligations has made Japan's capital a full center of the #Y Renaissance#! institution."
 kc_great_reckoning.10.a: "Rank shall answer for wealth."
 kc_great_reckoning.11.title: "The Register of Common Assessments"
 kc_great_reckoning.11.desc: "Comparable cadasters and registered accounts now apportion the Concord's expenses among every Chartered House. No office sees every private transaction, but every House is measured by the same rule.\n\nThe comparison of accounts, measures, and obligations has made Japan's capital a full center of the #Y Renaissance#! institution."
 kc_great_reckoning.11.a: "One register, one proportion."
 kc_great_reckoning.12.title: "The Common Treasury"
 kc_great_reckoning.12.desc: "The Ledger Office now examines House accounts on behalf of the Concord and collects a common assessment for public purposes. The Treasury will be powerful, but every inspection will remind the Houses how much authority they have yielded.\n\nThe comparison of accounts, measures, and obligations has made Japan's capital a full center of the #Y Renaissance#! institution."
 kc_great_reckoning.12.a: "Private wealth shall sustain public institutions."
 kc_great_reckoning.13.title: "The First Annual Assessment"
 kc_great_reckoning.13.desc: "The Chartered Houses have completed their first scheduled assessment. The Concord Treasury received #Y [GetUniqueInternationalOrganization('kc_kitayama_concord').MakeScope.GetVariable('kc_last_annual_assessment').GetValue|2]#! gold, while #Y [GetUniqueInternationalOrganization('kc_kitayama_concord').MakeScope.GetVariable('kc_last_assessment_arrears').GetValue|0]#! Houses entered arrears. Future results remain visible in the Treasury tab without producing an annual message."
 kc_great_reckoning.13.a: "Enter the result in the common ledger."
 kc_great_reckoning.14.title: "Assessment Arrears Spread"
 kc_great_reckoning.14.desc: "At least ten Chartered Houses failed to meet the latest annual assessment. The shortfall has reduced Cohesion and placed the credit of otherwise solvent Houses under suspicion. Treasury funds may be used to stabilize House credit from the Concord's Treasury tab."
 kc_great_reckoning.14.a: "The ledger cannot conceal this weakness."

 kc_complete_great_reckoning_guarantees: "Enact the Guarantees of the Great Houses"
 kc_complete_great_reckoning_guarantees_desc: "Settle the Great Reckoning by making Senior rank both a fiscal privilege and a public obligation."
 kc_complete_great_reckoning_guarantees_effect_tt: "The Great Reckoning will end under #Y Guarantees of the Great Houses#!.\n\nSenior Houses will contribute approximately #Y 4%#! of annual trade-and-tax income; ordinary Houses contribute approximately #Y 0.5%#!.\n\nThe settlement restores #G 5#! Cohesion, establishes a strong #Y House Privilege#! precedent, and gives Japan's capital full #Y Renaissance#! progress."
 kc_complete_great_reckoning_registered: "Enact Registered Apportionment"
 kc_complete_great_reckoning_registered_desc: "Settle the Great Reckoning by applying a comparable proportional assessment to every Chartered House."
 kc_complete_great_reckoning_registered_effect_tt: "The Great Reckoning will end under #Y Registered Apportionment#!.\n\nEvery Chartered House will contribute approximately #Y 2%#! of annual trade-and-tax income.\n\nThe settlement provides dependable revenue without permanent Cohesion drift, establishes a balanced constitutional precedent, and gives Japan's capital full #Y Renaissance#! progress."
 kc_complete_great_reckoning_common: "Establish the Common Treasury"
 kc_complete_great_reckoning_common_desc: "Settle the Great Reckoning by empowering the Concord's Ledger Office to assess every Chartered House."
 kc_complete_great_reckoning_common_effect_tt: "The Great Reckoning will end under #Y The Common Treasury#!.\n\nEvery Chartered House will contribute approximately #Y 4%#! of annual trade-and-tax income.\n\nThe settlement costs #R 5#! Cohesion, establishes a strong #Y Public Stewardship#! precedent, and gives Japan's capital full #Y Renaissance#! progress."

 kc_great_reckoning_customary_assessments_required_tt: "The Concord has adopted #Y Customary Assessments#!."
 kc_great_reckoning_senior_guarantors_required_tt: "The Concord has at least #Y 8 Senior Houses#!, reduced to #Y 6#! by the Senior Guarantors mandate."
 kc_great_reckoning_guarantees_cohesion_required_tt: "Concord Cohesion is at least #Y 70#!."
 kc_great_reckoning_guarantees_funds_tt: "The Treasury holds six months of Japan's trade-and-tax income. The preparation mandate reduces this by three months and #Y House Port Privileges#! reduces it by another two."
 kc_great_reckoning_registered_cadasters_required_tt: "The Concord has adopted #Y Registered Cadasters#!."
 kc_great_reckoning_registered_cohesion_required_tt: "Concord Cohesion is at least #Y 55#!."
 kc_great_reckoning_registered_funds_tt: "The Treasury holds ten months of Japan's trade-and-tax income. The preparation mandate reduces this by three months and #Y Licensed Coastal Convoys#! reduces it by another two."
 kc_great_reckoning_common_kenchi_required_tt: "The Concord has adopted #Y Common Kenchi#!."
 kc_great_reckoning_common_cohesion_required_tt: "Concord Cohesion is at least #Y 35#!."
 kc_great_reckoning_common_funds_tt: "The Treasury holds fifteen months of Japan's trade-and-tax income. The preparation mandate reduces this by three months and the #Y Concord Maritime Board#! reduces it by another two."
 kc_great_reckoning_ledger_levels_required_tt: "Japan's capital has #Y 3#! completed levels of the #Y Concord Ledger Office#!."
 kc_great_reckoning_seven_years_required_tt: "At least #Y 7 years#! have passed since the Great Reckoning began."

 KC_CONCORD_ADMINISTRATION_TAB: "Administration"
 KC_TREASURY_TAB: "Treasury"
 KC_NATIONAL_GREAT_PROJECTS_TAB: "National Great Projects"
 KC_TREASURY_LEDGER_HEADER: "The Common Ledger"
 KC_TREASURY_LEDGER_DESC: "Secretariat Treasury share: #Y [InternationalOrganizationsView.GetInternationalOrganization.MakeScope.GetVariable('kc_secretariat_treasury_share_display').GetValue|2]%#!\nLast Secretariat remittance: #Y [InternationalOrganizationsView.GetInternationalOrganization.MakeScope.GetVariable('kc_last_secretariat_remittance').GetValue|2]#! gold   Annual estimate: #Y [InternationalOrganizationsView.GetInternationalOrganization.MakeScope.GetVariable('kc_secretariat_annual_remittance_estimate').GetValue|2]#! gold\nAnnual House assessment: Senior #Y [InternationalOrganizationsView.GetInternationalOrganization.MakeScope.GetVariable('kc_assessment_senior_rate').GetValue|1]%#!   Ordinary #Y [InternationalOrganizationsView.GetInternationalOrganization.MakeScope.GetVariable('kc_assessment_ordinary_rate').GetValue|1]%#!\nLast House collection: #Y [InternationalOrganizationsView.GetInternationalOrganization.MakeScope.GetVariable('kc_last_annual_assessment').GetValue|2]#! gold   Arrears: #Y [InternationalOrganizationsView.GetInternationalOrganization.MakeScope.GetVariable('kc_last_assessment_arrears').GetValue|0]#! Houses\nRichest House tax-base benchmark: #Y [InternationalOrganizationsView.GetInternationalOrganization.MakeScope.GetVariable('kc_richest_house_tax_base').GetValue|2]#!\nSenior Charter capacity: #Y [InternationalOrganizationsView.GetInternationalOrganization.MakeScope.GetVariable('kc_senior_house_slots').GetValue|0]#!\nUnused Works licenses: #Y [InternationalOrganizationsView.GetInternationalOrganization.MakeScope.GetVariable('kc_common_works_licenses').GetValue|0]#!   Issued: #Y [InternationalOrganizationsView.GetInternationalOrganization.MakeScope.GetVariable('kc_common_works_licenses_issued').GetValue|0]#!\nNext Works commission: #Y [InternationalOrganizationsView.GetInternationalOrganization.MakeScope.GetVariable('kc_common_works_next_cost').GetValue|0]#! gold"
 KC_TREASURY_PROGRAMS: "Treasury Programs"

 kc_commission_common_works: "Commission Common Works"
 kc_commission_common_works_desc: "Lower construction costs across the Concord and establish five permanent common-works districts."
 kc_common_works_ready_tt: "No Common Works program has been commissioned during the last #Y 5 years#!."
 kc_common_works_funds_tt: "The Treasury holds the fixed gold price shown as #Y Next Works commission#! in the Common Ledger."
 kc_commission_common_works_effect_tt: "Spend the fixed Common Works price shown in the ledger and issue #G 5#! player-placeable $kc_concord_works_district$ licenses to Japan. The first #Y 20#! licenses cost #Y 500 gold#! per batch; later batches double in price. The five-year national modifier is listed below."
 kc_stabilize_house_credit: "Stabilize House Credit"
 kc_stabilize_house_credit_desc: "Use the common reserve to clear assessment arrears and guarantee solvent House obligations."
 kc_stabilize_credit_arrears_tt: "At least one Chartered House entered arrears during the latest assessment."
 kc_stabilize_credit_ready_tt: "House credit has not been stabilized during the last #Y 3 years#!."
 kc_stabilize_credit_funds_tt: "The Treasury holds the required #Y [SCOPE.sInternationalOrganization('recipient').MakeScope.ScriptValue('kc_stabilize_credit_cost')|2]#! gold."
 kc_stabilize_house_credit_effect_tt: "Spend #R [SCOPE.sInternationalOrganization('recipient').MakeScope.ScriptValue('kc_stabilize_credit_cost')|2]#! Treasury gold, clear all assessment arrears, and restore #G 2#! Cohesion. The price uses the richest Chartered House's tax base, rises with the number of Houses in arrears, and cannot exceed #Y 5,000#!. The three-year House modifier is listed below."

 kc_concord_ledger_office: "Concord Ledger Office"
 kc_concord_ledger_office_desc: "A capital complex of copyists, assessors, survey archives, and common account books. Each completed level improves Japan's cabinet efficiency and taxation while expanding the capital's commercial capacity."
 kc_concord_ledger_office_requirements: "Ledger Office Supplies"
 kc_concord_ledger_office_requirements_desc: "Paper, books, and tools maintain the common registers."
 kc_concord_works_district: "Concord Works District"
 kc_concord_works_district_desc: "A Treasury-chartered concentration of surveyed plots, serviced roads, drains, warehouses, and prepared construction land in JAP-owned territory. It may be built in rural or urban locations. A level occupies one slot and provides eleven, for a net gain of ten; no location may contain more than five levels."
 kc_concord_works_district_maintenance: "Road, Drainage, and Survey Maintenance"

 kc_great_reckoning_disputed_accounts: "Disputed Accounts"
 kc_great_reckoning_disputed_accounts_desc: "Incomparable House accounts and contested exemptions obstruct trade, taxation, and credit."
 kc_great_reckoning_guarantee_mandate: "Mandate of the Senior Guarantors"
 kc_great_reckoning_guarantee_mandate_desc: "The House has been instructed to prepare a fiscal settlement led by the Senior Charters."
 kc_great_reckoning_register_mandate: "Mandate of the General Register"
 kc_great_reckoning_register_mandate_desc: "The House has been instructed to prepare comparable cadasters and registered assessments."
 kc_great_reckoning_public_mandate: "Mandate of Open Books"
 kc_great_reckoning_public_mandate_desc: "The House has been instructed to prepare its accounts for examination by common officers."
 kc_great_reckoning_audit_commission: "Commissioned Auditors"
 kc_great_reckoning_audit_commission_desc: "Treasury-funded examiners are reconciling conflicting accounts."
 kc_great_reckoning_shadow_accounts: "Shadow Accounts"
 kc_great_reckoning_shadow_accounts_desc: "Provisional figures have allowed concealed obligations and revenues to persist."
 kc_great_reckoning_toll_confusion: "Conflicting Toll Rights"
 kc_great_reckoning_toll_confusion_desc: "Overlapping harbor, House, temple, and Concord dues impede commerce."
 kc_great_reckoning_credit_contraction: "House Credit Contraction"
 kc_great_reckoning_credit_contraction_desc: "Uncertain guarantees have caused lenders to withdraw credit."
 kc_great_reckoning_house_legacy: "Legacy of the Senior Guarantees"
 kc_great_reckoning_house_legacy_desc: "Great Houses defend a commercial order in which rank carries both privilege and obligation."
 kc_great_reckoning_registered_legacy: "Legacy of Registered Apportionment"
 kc_great_reckoning_registered_legacy_desc: "Comparable accounts have made proportional obligations predictable."
 kc_great_reckoning_common_legacy: "Legacy of the Common Treasury"
 kc_great_reckoning_common_legacy_desc: "Japan possesses a public accounting institution capable of mobilizing private commerce."
 kc_concord_assessment_arrears: "Concord Assessment Arrears"
 kc_concord_assessment_arrears_desc: "This House failed to meet the latest scheduled assessment."
 kc_concord_common_works: "Concord Common Works"
 kc_concord_common_works_desc: "Common procurement and pooled contracts reduce the cost of construction throughout the Concord."
 kc_concord_credit_backstop: "Concord Credit Backstop"
 kc_concord_credit_backstop_desc: "The common Treasury temporarily guarantees solvent House obligations."

