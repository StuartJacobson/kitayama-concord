l_english:
 kc_unquiet_peace: "The Unquiet Peace"
 kc_unquiet_peace_desc: "The Concord has ended private war before it has created institutions capable of replacing the policing, convoy protection, armed arbitration, and local coercion once supplied by the warrior houses. Displaced retainers turn to banditry, maritime guards become pirates, and communities discover that peace proclaimed in Kitayama is not necessarily peace enforced on the road.\n\nConcord Entrenchment is held at 30 until Japan operates its chosen settlement for at least five years and meets its institutional requirements."

 kc_unquiet_peace_constabulary_ready_tt: "The #Y Concord Constabulary#! program has operated for five years; Japan has built at least three levels of the $kc_concord_muster_office$, maintains at least 2,500 regular soldiers, the Concord has adopted $kc_common_arsenals_policy$, and the Treasury holds twelve months of Japan's trade-and-tax income."
 kc_unquiet_peace_network_ready_tt: "The #Y Fortified Roads and Harbors#! program has operated for five years; at least 12 Japanese locations contain a completed defensive building or $kc_kaido_post_station$, the Concord uses $kc_shared_road_fund_policy$ or $kc_central_kaido_assessment_policy$, and the Treasury holds nine months of Japan's trade-and-tax income."
 kc_unquiet_peace_watches_ready_tt: "The #Y Registered House Watches#! program has operated for five years; at least 24 Chartered Houses operate a completed $kc_kaido_post_station$ or $kc_kaisho$, the Concord uses $kc_house_retinues_policy$ or $kc_registered_retinues_policy$, Cohesion is at least 60, and the Treasury holds six months of Japan's trade-and-tax income."
 kc_unquiet_peace_completion_action_tt: "Japan must complete one of the three security programs through the Kitayama Concord's #Y Main Actions#!."
 kc_unquiet_peace_programs_header: "The Three Settlements"
 kc_unquiet_peace_programs_desc: "Japan may complete any one of the three programs through the Kitayama Concord's Main Actions after five years. The opening preparation discounts its selected program but does not prevent a different settlement. Each Main Action lists its current law, Treasury, military, construction, and Cohesion requirements."

 kc_unquiet_peace_constabulary_choice_tt: "Prepare the #Y Concord Constabulary#!. This reduces its eventual Treasury requirement from twelve to nine months of Japan's trade-and-tax income. Chartered Houses receive a Constabulary mandate and strongly favor #Y Common Arsenals#! while the crisis lasts.\n\nAfter five years, Japan may complete this program through the Concord's Main Actions by constructing three Muster Office levels, maintaining 2,500 regular soldiers, and persuading the council to adopt #Y Common Arsenals#! in the Laws tab. Completion costs 3 Cohesion and establishes Professional Armies in Japan's capital.\n\nThis preparation does #Y not#! prevent Japan from completing another program at its normal cost."
 kc_unquiet_peace_network_choice_tt: "Prepare #Y Fortified Roads and Harbors#!. This reduces its eventual Treasury requirement from nine to six months of Japan's trade-and-tax income. Chartered Houses receive a Routes mandate and strongly favor #Y Shared Road Fund#! and #Y Central Kaido Assessment#! while the crisis lasts.\n\nAfter five years, Japan may complete this program through the Concord's Main Actions by securing 12 locations with completed defenses or Kaido Post Stations and persuading the council to adopt one of those policies in the Laws tab. Completion establishes Professional Armies in Japan's capital.\n\nThis preparation does #Y not#! prevent Japan from completing another program at its normal cost."
 kc_unquiet_peace_watches_choice_tt: "Prepare the #Y Registered House Watches#!. This reduces its eventual Treasury requirement from six to three months of Japan's trade-and-tax income. Chartered Houses receive a Watches mandate and strongly favor #Y House Retinues#! and #Y Registered Retinues#! while the crisis lasts.\n\nAfter five years, Japan may complete this program through the Concord's Main Actions when 24 Chartered Houses operate a completed Kaido Post Station or Kaisho, Cohesion is at least 60, and either Retinues policy has passed. Completion grants 3 Cohesion but does not establish Professional Armies.\n\nThis preparation does #Y not#! prevent Japan from completing another program at its normal cost."

 kc_complete_unquiet_peace_constabulary: "Complete the Concord Constabulary"
 kc_complete_unquiet_peace_constabulary_desc: "Conclude the Unquiet Peace by establishing salaried central peace officers supplied through common arsenals and Japan's capital Muster Office."
 kc_complete_unquiet_peace_constabulary_effect_tt: "The Unquiet Peace will end. The Treasury will pay twelve months of Japan's trade-and-tax income, reduced to nine months if this program received the opening preparation. Cohesion falls by 3, Professional Armies is established in Japan's capital, and Japan receives a twenty-year Constabulary legacy."
 PERFORM_kc_complete_unquiet_peace_constabulary_ACTION: "Complete the Concord Constabulary"
 WE_PERFORM_kc_complete_unquiet_peace_constabulary_ACTION: "We complete the Concord Constabulary."
 OTHER_PERFORMS_kc_complete_unquiet_peace_constabulary_ACTION: "[SCOPE.sCountry('actor').GetName] completes the Concord Constabulary."

 kc_complete_unquiet_peace_network: "Complete Fortified Roads and Harbors"
 kc_complete_unquiet_peace_network_desc: "Conclude the Unquiet Peace by joining defenses, post stations, ports, and messengers into an integrated security and logistics network."
 kc_complete_unquiet_peace_network_effect_tt: "The Unquiet Peace will end. The Treasury will pay nine months of Japan's trade-and-tax income, reduced to six months if this program received the opening preparation. Professional Armies is established in Japan's capital, and Japan receives a twenty-year Fortified Routes legacy."
 PERFORM_kc_complete_unquiet_peace_network_ACTION: "Complete Fortified Roads and Harbors"
 WE_PERFORM_kc_complete_unquiet_peace_network_ACTION: "We complete Fortified Roads and Harbors."
 OTHER_PERFORMS_kc_complete_unquiet_peace_network_ACTION: "[SCOPE.sCountry('actor').GetName] completes Fortified Roads and Harbors."

 kc_complete_unquiet_peace_watches: "Complete the Registered House Watches"
 kc_complete_unquiet_peace_watches_desc: "Conclude the Unquiet Peace by retaining decentralized House forces under common registers, territorial jurisdictions, and Concord arbitration."
 kc_complete_unquiet_peace_watches_effect_tt: "The Unquiet Peace will end. The Treasury will pay six months of Japan's trade-and-tax income, reduced to three months if this program received the opening preparation. Cohesion rises by 3 and Japan receives a twenty-year House Watches legacy, but Professional Armies is not established."
 PERFORM_kc_complete_unquiet_peace_watches_ACTION: "Complete the Registered House Watches"
 WE_PERFORM_kc_complete_unquiet_peace_watches_ACTION: "We complete the Registered House Watches."
 OTHER_PERFORMS_kc_complete_unquiet_peace_watches_ACTION: "[SCOPE.sCountry('actor').GetName] completes the Registered House Watches."

 kc_unquiet_peace_five_years_required_tt: "At least five years have passed since the Unquiet Peace began."
 kc_unquiet_peace_common_arsenals_required_tt: "The Concord has adopted #Y Common Arsenals#! through a vote in the #Y Laws#! tab."
 kc_unquiet_peace_road_law_required_tt: "The Concord has adopted #Y Shared Road Fund#! or #Y Central Kaido Assessment#! through a vote in the #Y Laws#! tab."
 kc_unquiet_peace_retinue_law_required_tt: "The Concord uses #Y House Retinues#! or #Y Registered Retinues#! in the #Y Laws#! tab."
 kc_unquiet_peace_muster_levels_required_tt: "Japan's capital has at least three completed levels of $kc_concord_muster_office$."
 kc_unquiet_peace_regulars_required_tt: "Japan maintains a standing force of at least 2,500 regular soldiers."
 kc_unquiet_peace_secured_locations_required_tt: "At least 12 JAP-owned locations contain a completed defense building or $kc_kaido_post_station$."
 kc_unquiet_peace_watch_houses_required_tt: "At least 24 Chartered Houses operate a completed $kc_kaido_post_station$ or $kc_kaisho$."
 kc_unquiet_peace_cohesion_required_tt: "Concord Cohesion is at least 60."
 kc_unquiet_peace_constabulary_funds_tt: "The Treasury holds twelve months of Japan's trade-and-tax income, or nine months if the Constabulary received the opening preparation."
 kc_unquiet_peace_network_funds_tt: "The Treasury holds nine months of Japan's trade-and-tax income, or six months if Fortified Roads and Harbors received the opening preparation."
 kc_unquiet_peace_watches_funds_tt: "The Treasury holds six months of Japan's trade-and-tax income, or three months if House Watches received the opening preparation."

 kc_concord_muster_office: "Concord Muster Office"
 kc_concord_muster_office_desc: "A capital complex that registers volunteers, supplies salaried guards, and converts the obligations of the commercial peace into a dependable Japanese reserve. It may be expanded to four levels, with each level employing another military cadre and increasing local manpower. It is authorized when the Unquiet Peace begins and remains as a permanent institution of the Concord State."

 STATIC_MODIFIER_NAME_kc_unquiet_peace_member_disorder: "The Unquiet Peace"
 STATIC_MODIFIER_NAME_kc_unquiet_peace_constabulary_mandate: "Constabulary Deputation"
 STATIC_MODIFIER_NAME_kc_unquiet_peace_network_mandate: "Fortified Routes Deputation"
 STATIC_MODIFIER_NAME_kc_unquiet_peace_watches_mandate: "Registered Watches Deputation"
 STATIC_MODIFIER_NAME_kc_unquiet_peace_relief_stipends: "Stipends for Displaced Retainers"
 STATIC_MODIFIER_NAME_kc_unquiet_peace_ronin_bands: "Uncompensated Rōnin Bands"
 STATIC_MODIFIER_NAME_kc_unquiet_peace_emergency_patrols: "Emergency Maritime Patrols"
 STATIC_MODIFIER_NAME_kc_unquiet_peace_maritime_disruption: "Maritime Reprisals"
 STATIC_MODIFIER_NAME_kc_unquiet_peace_common_magistrates: "Common Peace Magistrates"
 STATIC_MODIFIER_NAME_kc_unquiet_peace_unfunded_decrees: "Unfunded Peace Decrees"
 STATIC_MODIFIER_NAME_kc_unquiet_peace_constabulary_legacy: "Legacy of the Concord Constabulary"
 STATIC_MODIFIER_NAME_kc_unquiet_peace_network_legacy: "Legacy of the Fortified Routes"
 STATIC_MODIFIER_NAME_kc_unquiet_peace_watches_legacy: "Legacy of the Registered Watches"

 kc_unquiet_peace.1.title: "The Unquiet Peace"
 kc_unquiet_peace.1.desc: "The banners are furled, the roads are open, and the Chartered Houses may no longer settle a grievance by marching upon a neighbor. Yet private war performed many duties that the Concord has not replaced. Retainers who once lived by campaign wages drift between post towns. Harbor guards protect one merchant and prey upon the next. Villages appeal to house, temple, and court, but no authority knows whose men must pursue a bandit across an old domain boundary.\n\nThe Concord State has authorized a $kc_concord_muster_office$ in our capital so Japan can raise soldiers of its own. Entrenchment will remain at #Y 30#! until one program is completed through the Concord's Main Actions after at least five years. Our opening choice prepares one program at a discount but does not lock Japan into it."
 kc_unquiet_peace.1.a: "Prepare a salaried Concord Constabulary."
 kc_unquiet_peace.1.b: "Prepare to secure the roads and harbors."
 kc_unquiet_peace.1.c: "Prepare registers for the Houses' watches."

 kc_unquiet_peace.2.title: "Peace Without Policemen"
 kc_unquiet_peace.2.desc: "The Concord has forbidden war between the Houses, but the common government has not yet replaced every local military duty. Japan has begun a national program to suppress banditry, piracy, and armed private justice. Until it succeeds, every signatory will bear the commercial and administrative cost of the Unquiet Peace."
 kc_unquiet_peace.2.a: "Our charter obliges us to help keep the peace."

 kc_unquiet_peace.3.title: "Retainers Without Campaigns"
 kc_unquiet_peace.3.desc: "Thousands of lesser retainers expected service, reward, and subsistence from seasonal campaigning. Peace has made their swords unnecessary without making their households inexpensive. Some seek honest work as escorts or clerks; others collect improvised tolls along roads that no lord now patrols.\n\nThe Treasury program requires two months of Japan's trade-and-tax income and costs 10 Concord Cohesion. It is unavailable unless the Treasury holds the full assessment and the Concord has at least 10 Cohesion."
 kc_unquiet_peace.3.a: "Spend two months of Treasury income and 10 Cohesion on retraining."
 kc_unquiet_peace.3.b: "Spend 15 Cohesion and endure the rōnin bands."
 kc_unquiet_peace.3.c: "Spend 20 Cohesion to impose House watch obligations."

 kc_unquiet_peace.4.title: "Pirates Beneath Familiar Banners"
 kc_unquiet_peace.4.desc: "Coastal guards and shipborne retainers have discovered that the distinction between convoy fee and extortion depends upon who controls the harbor. Merchants demand a common patrol; maritime Houses insist that only local pilots can distinguish protector from pirate.\n\nThe Treasury program requires two months of Japan's trade-and-tax income and costs 10 Concord Cohesion. It is unavailable unless the Treasury holds the full assessment and the Concord has at least 10 Cohesion."
 kc_unquiet_peace.4.a: "Spend two months of Treasury income and 10 Cohesion on patrols."
 kc_unquiet_peace.4.b: "Spend 15 Cohesion and endure the maritime reprisals."
 kc_unquiet_peace.4.c: "Spend 20 Cohesion to impose House escort obligations."

 kc_unquiet_peace.5.title: "Who Keeps the Village Peace?"
 kc_unquiet_peace.5.desc: "A quarrel crossing an old house boundary has exposed the absence of ordinary policing. Court officials demand common magistrates, while temples, village elders, and house stewards argue that reconciliation is more durable than an unfamiliar official carrying a distant seal.\n\nThe Treasury program requires two months of Japan's trade-and-tax income and costs 10 Concord Cohesion. It is unavailable unless the Treasury holds the full assessment and the Concord has at least 10 Cohesion."
 kc_unquiet_peace.5.a: "Spend two months of Treasury income and 10 Cohesion on magistrates."
 kc_unquiet_peace.5.b: "Spend 15 Cohesion and issue an unfunded decree."
 kc_unquiet_peace.5.c: "Spend 20 Cohesion to impose local mediation duties."

 kc_unquiet_peace.10.title: "The Constabulary Keeps the Peace"
 kc_unquiet_peace.10.desc: "Five years of muster rolls, common arsenals, salaries, and patrol districts have created a force whose duty belongs to Japan rather than to any single lineage. The Concord Treasury has paid the program's assessment—twelve months of national trade-and-tax income, reduced to nine by prior preparation—and the centralization has cost #R 3#! Cohesion.\n\nProfessional Armies is now present in Japan's capital. For twenty years, the Concord Constabulary adds #G 5%#! monthly control while improving military maintenance and levy recovery."
 kc_unquiet_peace.10.a: "The peace now possesses servants of its own."

 kc_unquiet_peace.11.title: "The Fortified Routes"
 kc_unquiet_peace.11.desc: "Rather than fill the countryside with a new central force, the Concord has joined walls, post stations, harbor guards, storehouses, and messenger routes into a common security network. Bandits cannot easily cross an administrative boundary, and pirates find that neighboring ports now exchange warnings.\n\nThe Treasury has paid the program's assessment—nine months of national trade-and-tax income, reduced to six by prior preparation. Professional Armies is now present in Japan's capital, while the secured network adds #G 5%#! monthly control and improves trade and construction for twenty years."
 kc_unquiet_peace.11.a: "Every road and harbor is part of the settlement."

 kc_unquiet_peace.12.title: "The Registered Watches"
 kc_unquiet_peace.12.desc: "The Houses retain men under arms, but registers now specify their numbers, jurisdictions, and obligations to neighboring domains. This is not a monopoly of violence: it is a negotiated division of responsibility backed by Concord arbitration.\n\nThe Treasury has paid the program's assessment—six months of national trade-and-tax income, reduced to three by prior preparation—and confidence in hereditary responsibility has added #G 3#! Cohesion. For twenty years, the settlement adds #G 5%#! monthly control while improving levy strength and recovery. Unlike the centralized programs, it does not establish Professional Armies in Japan's capital."
 kc_unquiet_peace.12.a: "Peace will be kept through chartered obligation."


