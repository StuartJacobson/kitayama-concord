 KC_CONCORD_LEADER_FEMALE: "[SelectLocalization(GetUniqueInternationalOrganization('kc_kitayama_concord').MakeScope.GetVariable('kc_concord_collapsed').IsSet, 'KC_INTERREGNUM_CUSTODIAN_TITLE', 'KC_ELECTED_SHOGUN_TITLE')]"
