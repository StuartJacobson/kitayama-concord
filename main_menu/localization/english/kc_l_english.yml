 KC_WARRING_HOUSES_LEADER_FEMALE: "Nominal Shogun"
 diplomatic_status_kc_kitayama_concord_name: "House of the Kitayama Settlement"
 diplomatic_status_kc_kitayama_concord_tooltip: "This country belongs to the Kitayama settlement or to the inert register that survives its collapse."
 kc_kitayama_concord_list_who_tt: "Show the houses registered under the Kitayama settlement."
 io_opinion_kc_kitayama_concord: "Fellow Concord House"

 kc_chartered_buke_house: "Chartered Buke House"
 kc_chartered_buke_house_desc: "The samurai house remains a hereditary corporation of warriors, stewards, creditors, and merchants. Its standing now rests as much on warehouses, roads, and tax revenues as on arms."
 kc_kitayama_concordate: "Kitayama Concordate"
 kc_kitayama_concordate_desc: "Japan is governed through a permanent compact between the court, the central administration, and the chartered warrior houses. The elected shogun presides over the Concord, but neither election nor defeat transfers the Japanese state or its lands to another house."
 kc_articles_of_chartered_liberties: "Articles of Chartered Liberties"
 kc_articles_of_chartered_liberties_desc: "The Hundred-Year Articles are interpreted as a guarantee that the common institutions exist through the continuing consent of the hereditary warrior houses. The council protects chartered jurisdictions, records negotiated precedent, and strengthens Cohesion by assuring each House that commercial peace will not erase its lineage."
 kc_council_of_common_stewardship: "Council of Common Stewardship"
 kc_council_of_common_stewardship_desc: "The Hundred-Year Articles are interpreted as creating public duties greater than any single charter. Permanent committees coordinate roads, accounts, and common administration, strengthening Cohesion by proving that the institutions created by the Houses can govern for the realm as a whole."

