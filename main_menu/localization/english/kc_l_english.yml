 WE_PERFORM_kc_proclaim_kitayama_concord_ACTION: "We proclaim the Kitayama Concord."
 OTHER_PERFORMS_kc_proclaim_kitayama_concord_ACTION: "[SCOPE.sCountry('actor').GetName] proclaims the Kitayama Concord."
 kc_complete_kitayama_transition: "Ratify the Kitayama Concord"
 kc_complete_kitayama_transition_desc: "Ratify the transfer from the Japanese Shogunate to the Kitayama Concord. This action confirms the houses, lands, leadership, and founding charter before dissolving the obsolete Shogunate."
 kc_complete_kitayama_transition_effect_tt: "Transfer all remaining Shogunate members and lands to the Kitayama Concord, restore its founding policies, dissolve the obsolete Japanese Shogunate, and restore the name Japan to the founding state."
 PERFORM_kc_complete_kitayama_transition_ACTION: "Ratify the Kitayama Concord"
 WE_PERFORM_kc_complete_kitayama_transition_ACTION: "We ratify the Kitayama Concord."
 OTHER_PERFORMS_kc_complete_kitayama_transition_ACTION: "[SCOPE.sCountry('actor').GetName] ratifies the Kitayama Concord."
 kc_purchase_senior_charter: "Purchase a Senior Charter"
 kc_purchase_senior_charter_desc: "Commit two years of ordinary income to the common compact and petition for recognition as a Senior Chartered House. The privilege opens a path to the elected shogunate but adds another powerful rival to the council."
 kc_purchase_senior_charter_effect_tt: "We will pay two years of trade-and-tax income, receive Senior Chartered House status, and reduce Concord Cohesion by 2."
 PERFORM_kc_purchase_senior_charter_ACTION: "Purchase a Senior Charter"
 WE_PERFORM_kc_purchase_senior_charter_ACTION: "We purchase a Senior Charter."
 OTHER_PERFORMS_kc_purchase_senior_charter_ACTION: "[SCOPE.sCountry('actor').GetName] purchases a Senior Charter."
 kc_grant_senior_charter: "Grant a Senior Charter"
 kc_grant_senior_charter_desc: "Elevate a commercially established member to the senior council. The elected shogun or the permanent Concord State may countersign the charter; the grant costs prestige and introduces another contender for leadership."
 kc_grant_senior_charter_effect_tt: "The selected house will become a Senior Chartered House, the granting country will lose a small amount of prestige, and Concord Cohesion will fall by 2."
 PERFORM_kc_grant_senior_charter_ACTION: "Grant a Senior Charter"
 WE_PERFORM_kc_grant_senior_charter_ACTION: "We grant a Senior Charter."
 OTHER_PERFORMS_kc_grant_senior_charter_ACTION: "[SCOPE.sCountry('actor').GetName] grants a Senior Charter."
 kc_compulsory_charter_redemption: "Compulsory Charter Redemption"
 kc_compulsory_charter_redemption_desc: "Invoke the Concord's redemption clause to purchase an AI-controlled ordinary Chartered House at a valuation equal to twenty years of its trade-and-tax income. The acquired offices, holdings, personnel, manpower, and sailors pass to the purchasing Senior House. Both the valuation and the redeemed House's liquid reserves enter the Concord Treasury. Consolidation strengthens the buyer but alarms every house that fears its charter may be next."
 kc_compulsory_charter_redemption_effect_tt: "Pay [SCOPE.sCountry('target').MakeScope.ScriptValue('kc_charter_redemption_price')|2]@gold! into the Concord Treasury, place the target's liquid reserves in the Treasury, absorb [SCOPE.sCountry('target').GetName], and reduce Concord Cohesion by 5. The acquired House's Kaisho will close, preserving the one-Kaisho-per-House limit. This House cannot redeem another charter for 10 years. AI redemptions also impose a four-year Concord-wide AI cooldown; human Houses ignore that shared cooldown."
 kc_kaisho_office_required_tt: "This House maintains a completed Kaisho Commercial House"
 PERFORM_kc_compulsory_charter_redemption_ACTION: "Compulsorily Redeem a Charter"
 WE_PERFORM_kc_compulsory_charter_redemption_ACTION: "We compulsorily redeem a Chartered House."
 OTHER_PERFORMS_kc_compulsory_charter_redemption_ACTION: "[SCOPE.sCountry('actor').GetName] compulsorily redeems [SCOPE.sCountry('target').GetName]."
 kc_select_redemption_house: "Select an Ordinary Chartered House"
 trigger_no_kc_redemption_houses: "@trigger_no! No eligible AI-controlled ordinary Chartered House remains."
 kc_charter_redemption_cooldown_ready_tt: "This Senior House has not redeemed another charter within the last 10 years."
 kc_charter_redemption_price_available_tt: "The purchasing House can pay twenty years of the selected House's trade-and-tax income, with a minimum valuation of 240 gold."
 kc_charter_redemption_house_floor_tt: "More than 24 Chartered Houses remain in the Concord."
 kc_charter_redemption.2.title: "A Charter Has Been Redeemed"
 kc_charter_redemption.2.desc: "[SCOPE.sCountry('kc_redemption_buyer').GetName] has invoked the Concord's compulsory redemption clause against [SCOPE.sCountry('kc_redeemed_house').GetName]. The assessed valuation of [SCOPE.sCountry('kc_redemption_buyer').MakeScope.GetVariable('kc_last_redemption_price').GetValue|2]@gold! and [SCOPE.sCountry('kc_redemption_buyer').MakeScope.GetVariable('kc_last_redeemed_reserves').GetValue|2]@gold! in liquid reserves have entered the common Treasury. The acquired House's holdings, personnel, manpower, and sailors have passed to the purchaser.\n\nEven a lawful consolidation unsettles the council. The lesser houses see proof that commercial weakness can now end a lineage's independent charter, while rivals suspect that wealth is becoming a quieter instrument of conquest. Concord Cohesion has fallen by #R 5#!."
 kc_charter_redemption.2.a: "Record the transfer—and the council's unease."
