 kc_chartered_house: "Chartered House"
 kc_chartered_house_desc: "A signatory warrior house possessing a seat in the Kitayama council and a vote in the election of the shogun."
 kc_senior_chartered_house: "Senior Chartered House"
 kc_senior_chartered_house_desc: "A wealthy and established house granted an enhanced council seat and eligibility to contest the elected shogunate. Senior charters strengthen commerce but sharpen competition within the Concord."
 kc_senior_house_slot_available_tt: "The Concord has an open Senior Charter slot. It begins with #Y 3#! and gains #G +1#! capacity at every #Y 10 Entrenchment#!, to a maximum of #Y 13#!."
 kc_presiding_house: "Presiding House"
 kc_presiding_house_desc: "The house of the current elected shogun. This office grants leadership privileges but transfers no land, country tag, or permanent ownership."
 kc_concord_state: "Concord State"
 kc_concord_state_desc: "The central Japanese state and permanent guarantor of the Kitayama settlement. Its authority survives changes of shogun and allows it to countersign Senior Charters even when another house presides."
 MODIFIER_TYPE_NAME_kc_chartered_house_can_participate_in_parliament: "$kc_chartered_house$ in the Council"
 MODIFIER_TYPE_DESC_kc_chartered_house_can_participate_in_parliament: "This allows a Chartered House to participate in the deliberations of the Kitayama Concord."
