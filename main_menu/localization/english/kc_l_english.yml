 MODIFIER_TYPE_DESC_kc_presiding_house_agenda_impact: "This modifies the support enjoyed by proposals sponsored by the current Presiding House."

 kc_concord_secretariat_bureaucracy: "Concord Secretariat"
 kc_concord_secretariat_bureaucracy_desc: "The commercial peace is sustained by registrars, circuit mediators, account examiners, courier offices, and clerks able to reconcile the privileges of more than a hundred warrior houses. Its permanent records provide a minor improvement to Estate Satisfaction Recovery. Funding may be adjusted through the ordinary bureaucracy maintenance slider to purchase Cohesion, reduce the cost of Diplomatic Spending, and remit part of its nominal budget to the common Treasury. All funded effects strengthen with the Secretariat's own bureaucracy Entrenchment. At full maintenance it supplies approximately #G +0.14#! Cohesion, #G -15%#! Diplomatic Spending Cost, and a #G 25%#! Treasury share at 0 Entrenchment; #G +0.21#!, #G -22.5%#!, and #G 37.5%#! at 50; and #G +0.28#!, #G -30%#!, and #G 50%#! at 100."
 MODIFIER_TYPE_NAME_kc_concord_secretariat_bureaucracy_impact_modifier: "$kc_concord_secretariat_bureaucracy$ Impact"
 MODIFIER_TYPE_DESC_kc_concord_secretariat_bureaucracy_impact_modifier: "This modifies the effectiveness of the $kc_concord_secretariat_bureaucracy$."
 MODIFIER_TYPE_NAME_kc_concord_secretariat_treasury_share: "Secretariat Treasury Share"
 MODIFIER_TYPE_DESC_kc_concord_secretariat_treasury_share: "The share of the Concord Secretariat's nominal maintenance budget remitted to the common Treasury each month."
 MODIFIER_TYPE_NAME_monthly_concord_bureaucracy_cohesion: "Cohesion from the Concord Secretariat"
 MODIFIER_TYPE_DESC_monthly_concord_bureaucracy_cohesion: "Monthly Concord Cohesion purchased by maintaining Japan's native Concord bureaucracy."
 MODIFIER_TYPE_NAME_monthly_concord_law_cohesion: "Cohesion from Concord Laws"
 MODIFIER_TYPE_DESC_monthly_concord_law_cohesion: "The recurring political cost of maintaining the Concord's active middle and ambitious laws."

 kc_concord_cohesion: "Concord Cohesion"
 kc_concord_cohesion_desc: "The immediate willingness of the court and chartered warrior houses to preserve their commercial peace. Institutional self-preservation weakens at every ten points of Cohesion and supplies no free growth at 80 or above. Japan may maintain the Concord Secretariat through the native Bureaucracy panel to purchase further monthly Cohesion; its effect strengthens with both maintenance and bureaucracy Entrenchment. Accommodating laws have no monthly cost; each middle law costs 0.02 and each ambitious law costs 0.04 monthly Cohesion. Below 25 the Concord is fractured; 25–49 is contentious; 50–74 is functional; 75–89 is an integrated market; and 90 or more represents the Kitayama Peace."
 KC_COHESION_DISPLAY: "$VAL|2$"
 kc_concord_entrenchment: "Concord Entrenchment"
 kc_concord_entrenchment_desc: "The accumulated authority of common precedents, offices, roads, contracts, and elections. Entrenchment rises permanently and grows faster at high Cohesion. It unlocks one additional Senior Charter slot at every ten points, expanding capacity from three to thirteen. At 75–89 Cohesion it reaches maturity in roughly one hundred years."
 KC_ENTRENCHMENT_DISPLAY: "$VAL|2$"
