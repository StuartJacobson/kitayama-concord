 kc_debug.29.title: "Test the Concord Secretariat"
 kc_debug.29.desc: "Select an exact native bureaucracy Entrenchment value for the Concord Secretariat. At full maintenance, its expected monthly Cohesion contribution is approximately 0.14, 0.18, 0.21, 0.25, and 0.28 at 0, 25, 50, 75, and 100 Entrenchment. Diplomatic Spending Cost reduction should be approximately 15%, 18.75%, 22.5%, 26.25%, and 30%, while the Treasury share should be 25%, 31.25%, 37.5%, 43.75%, and 50%. At 50% maintenance all three funded effects should be halved; Estate Satisfaction Recovery remains constant."
 kc_debug.29.a: "Set Secretariat Entrenchment to 0."
 kc_debug.29.b: "Set Secretariat Entrenchment to 25."
 kc_debug.29.c: "Set Secretariat Entrenchment to 50."
 kc_debug.29.d: "Set Secretariat Entrenchment to 75."
 kc_debug.29.e: "Set Secretariat Entrenchment to 100."
 kc_debug.40.title: "Fund the Concord Secretariat"
 kc_debug.40.desc: "Set the Secretariat's maintenance directly. Combine this with event kc_debug.29, advance one month, and compare the Treasury share, last monthly remittance, and annual estimate in the Common Ledger."
 kc_debug.40.a: "Suspend Secretariat funding."
 kc_debug.40.b: "Fund half of the Secretariat budget."
 kc_debug.40.c: "Fund the full Secretariat budget."
 KC_ENTRENCHMENT_PEACE: "The Kitayama Peace"

 kc_entrenchment.1.title: "The Courts of Kitayama"
 kc_entrenchment.1.desc: "In the Concord's first years, every quarrel between a warrior house, a temple estate, a guild, and a merchant had to be settled anew. Yet the same stewards and accountants have now met around the same Kitayama tables for a generation. Their copied judgments circulate with contracts, and a decision honored in one harbor is increasingly cited in another.\n\nThe council can no longer pretend that these precedents are merely private compromises. #Y $kc_concord_arbitration_law$#! is now available, with #G $kc_lineage_arbitration_policy$#! adopted as the provisional settlement. More uniform courts may be proposed through the Concord's Laws panel, but they must win the Houses' weighted vote."
 kc_entrenchment.1.a: "Let precedent bind what the sword once settled."
 kc_entrenchment.2.title: "A Realm Measured"
 kc_entrenchment.2.desc: "Every house keeps careful accounts, but fields, harvests, tolls, and obligations are recorded according to local custom. A levy described as modest in one domain may exceed a heavy assessment in its neighbor. Decades of Kaisho ledgers and shared road contributions have finally given Concord clerks enough comparable records to translate between them.\n\n#Y $kc_concord_assessment_law$#! is now available, with #G $kc_customary_assessments_policy$#! preserving inherited measures as the provisional settlement. Registered cadasters or a common kenchi may be proposed through the Laws panel if the council will accept the intrusion."
 kc_entrenchment.2.a: "First compare the ledgers; then decide what may be measured."
 kc_entrenchment.3.title: "Beyond the Inland Sea"
 kc_entrenchment.3.desc: "The peace of the Houses has filled the Inland Sea with cargoes, but prosperity also draws raiders, private toll collectors, and competition for pilots. Voyages toward Ezo, the Sea of Japan, and more distant markets cannot be protected by isolated harbor arrangements alone. Merchants now demand charts they can trust and convoys whose licenses remain valid beyond one house's coast.\n\n#Y $kc_concord_maritime_law$#! is now available, with #G $kc_house_port_privileges_policy$#! recognized as the provisional settlement. Common convoys or a permanent maritime board may be proposed through the Laws panel."
 kc_entrenchment.3.a: "Japan's commercial peace must reach the water."
 kc_entrenchment.4.title: "Promises Made Transferable"
 kc_entrenchment.4.desc: "Temple guarantees, warehouse receipts, and promises recorded by the Kaisho already move wealth without moving the rice, copper, or silver behind it. As the same obligations pass between several Houses, repayment increasingly depends upon the Concord's reputation rather than the honor of a single lineage. A promise made in one city can now purchase goods in another.\n\n#Y $kc_concord_credit_law$#! is now available, with #G $kc_temple_guaranteed_credit_policy$#! adopted as the provisional settlement. House clearinghouses or standardized Concord notes may be proposed through the Laws panel, exchanging political trust for far greater mobility of capital."
 kc_entrenchment.4.a: "A trusted promise may travel farther than coin."
 kc_entrenchment.5.title: "Accounts That Travel"
 kc_entrenchment.5.desc: "A Kaisho ledger was once meaningful only to the House whose seal closed it. Ten years of Concord arbitration, remittances, temple guarantees, and repeated dealings have begun to change that. Creditors now ask what a House owes across the compact, not merely what silver lies in its storehouse.\n\nBeginning at #Y 10 Concord Entrenchment#!, Japan's capital gains #G 0.80 monthly progress#! toward the #Y Banking#! institution. At the Concord's normal growth rate this makes Banking available around 20 Entrenchment. The progress ends naturally once Banking reaches full presence."
 kc_entrenchment.5.a: "Let reputation become collateral."
 kc_entrenchment.6.title: "A Hall for the Concord"
 kc_entrenchment.6.desc: "For half a century of institutional growth, the Council of Houses has borrowed rooms from palaces, temples, Kaisho, and the court. Its ballots, archives, committees, and petitioners now require a permanent seat whose authority belongs neither to one lineage nor to the shogun of the moment.\n\nAt #Y 50 Concord Entrenchment#! Japan may construct the unique #G $kc_concord_council_hall$#! in its capital. The hall strengthens cabinet administration, reduces the cost of changing policy, improves control in the capital, and provides a permanent seat for the Council of Houses."
 kc_entrenchment.6.a: "Give the compact a house of its own."

