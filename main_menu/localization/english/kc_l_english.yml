l_english:
 kc_concord_monthly_maintenance_tt: "The Concord quietly reconciles its membership, leadership, Treasury registers, constitutional state, and authorized national works."
 kc_kitayama_concord: "Kitayama Concord"
 kc_kitayama_concord_desc: "A compact between the court and Japan's warrior houses. While Cohesion endures, the buke redirect their rivalries into commerce, public works, and elections. If the Articles collapse, only an inert register of the former settlement survives while the Houses return to war."
