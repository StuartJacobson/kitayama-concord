 MODIFIER_TYPE_DESC_kc_chartered_house_agenda_impact: "This modifies the support enjoyed by proposals sponsored by the Chartered Houses."
 MODIFIER_TYPE_NAME_kc_senior_chartered_house_can_participate_in_parliament: "$kc_senior_chartered_house$ in the Council"
 MODIFIER_TYPE_DESC_kc_senior_chartered_house_can_participate_in_parliament: "This allows a Senior Chartered House to participate in the deliberations of the Kitayama Concord."
 MODIFIER_TYPE_NAME_kc_senior_chartered_house_agenda_impact: "Council Influence of Senior Houses"
 MODIFIER_TYPE_DESC_kc_senior_chartered_house_agenda_impact: "This modifies the support enjoyed by proposals sponsored by Senior Chartered Houses."
 MODIFIER_TYPE_NAME_kc_concord_state_can_participate_in_parliament: "$kc_concord_state$ in the Council"
 MODIFIER_TYPE_DESC_kc_concord_state_can_participate_in_parliament: "This allows the central Japanese state to participate permanently in the deliberations of the Kitayama Concord."
 MODIFIER_TYPE_NAME_kc_concord_state_agenda_impact: "Council Influence of the Concord State"
 MODIFIER_TYPE_DESC_kc_concord_state_agenda_impact: "This modifies the support enjoyed by proposals sponsored by the central Japanese state."
