 kc_proclaim_kitayama_concord: "Proclaim the Kitayama Concord"
 kc_proclaim_kitayama_concord_desc: "Convene the court and the great warrior houses at Kitayama. In exchange for preserving hereditary honor, private retinues, and seats in a common council, the houses will renounce war against one another and accept commerce and public works as the proper measure of rivalry."
 kc_proclaim_kitayama_concord_effect_tt: "Create the Kitayama Concord, transfer the Shogunate's members and lands, and establish the founder as its first elected shogun. The Japanese Shogunate will remain temporarily. Open the Kitayama Concord from the organization bar at the bottom of the screen, then use Ratify the Kitayama Concord to complete the transition."
 trigger_no_kc_shogunate_available: "@trigger_no! The Japanese Shogunate is not available or we do not lead it."
