 kc_internal_wars_forbidden_tt: "The Kitayama Concord forbids war between its member houses."
 kc_raise_extraordinary_contribution: "Make an Extraordinary Contribution"
 kc_raise_extraordinary_contribution_desc: "Transfer six months of Japan's current trade-and-tax income, capped at 5,000 gold, from the central state's accounts into the Concord Treasury. No assessment is imposed upon the Chartered Houses and Cohesion is unchanged."
 kc_raise_extraordinary_contribution_effect_tt: "Japan pays #R [SCOPE.sInternationalOrganization('recipient').MakeScope.ScriptValue('kc_treasury_six_month_cost')|2]#! gold into the Concord Treasury. The six-month income benchmark is capped at #Y 5,000#!; Cohesion is unchanged, and neither fiscal action may be used again for 1 year."
 PERFORM_kc_raise_extraordinary_contribution_ACTION: "Make an Extraordinary Contribution"
 WE_PERFORM_kc_raise_extraordinary_contribution_ACTION: "We make an extraordinary contribution to the Concord Treasury."
 OTHER_PERFORMS_kc_raise_extraordinary_contribution_ACTION: "[SCOPE.sCountry('actor').GetName] makes an extraordinary contribution to the Concord Treasury."
 kc_fund_concord_mediation: "Fund a Concord Mediation"
 kc_fund_concord_mediation_desc: "Pay travel stipends, settle commercial claims, and sponsor neutral arbitration between rival houses. Drawing upon the common treasury can repair the compact without transferring money to the elected shogun."
 kc_fund_concord_mediation_effect_tt: "The Concord Treasury spends #R [SCOPE.sInternationalOrganization('recipient').MakeScope.ScriptValue('kc_treasury_six_month_cost')|2]#! gold and Cohesion rises by #G 2#!. The six-month income benchmark is capped at #Y 5,000#!, and neither fiscal action may be used again for 1 year."
 PERFORM_kc_fund_concord_mediation_ACTION: "Fund a Concord Mediation"
 WE_PERFORM_kc_fund_concord_mediation_ACTION: "We fund a Concord mediation."
 OTHER_PERFORMS_kc_fund_concord_mediation_ACTION: "[SCOPE.sCountry('actor').GetName] funds a Concord mediation."
 kc_distribute_council_patronage: "Distribute Council Patronage"
 kc_distribute_council_patronage_desc: "Use Treasury appointments, commercial guarantees, and access to the common administration to make Japan's position decisive in the law ballot currently before the Council."
 kc_distribute_council_patronage_effect_tt: "Concord Cohesion falls by 5 and Japan receives #G +300#! votes in the current Concord law ballot. The patronage bonus expires when that ballot passes or fails."
 PERFORM_kc_distribute_council_patronage_ACTION: "Distribute Council Patronage"
 WE_PERFORM_kc_distribute_council_patronage_ACTION: "We distribute Council patronage."
 OTHER_PERFORMS_kc_distribute_council_patronage_ACTION: "[SCOPE.sCountry('actor').GetName] distributes Council patronage."
 kc_concord_fiscal_action_ready_tt: "The Concord has not used a fiscal action within the last year."
 kc_extraordinary_contribution_funds_tt: "Japan holds the required #Y [SCOPE.sInternationalOrganization('recipient').MakeScope.ScriptValue('kc_treasury_six_month_cost')|2]#! gold."
 kc_concord_mediation_funds_tt: "The Concord Treasury holds the required #Y [SCOPE.sInternationalOrganization('recipient').MakeScope.ScriptValue('kc_treasury_six_month_cost')|2]#! gold."

 kc_concord_council_law: "Council Charter"
 kc_concord_council_law_desc: "The rules by which the hereditary houses participate in the common government."
 kc_hereditary_council_policy: "Hereditary Seats"
 kc_hereditary_council_policy_desc: "Each chartered lineage possesses an enduring seat, making commercial reform acceptable to the old warrior aristocracy."
 kc_rotating_council_policy: "Rotating Magistracies"
 kc_rotating_council_policy_desc: "Administrative offices circulate between qualified houses, rewarding competence and preventing a permanent court faction."
 kc_wealth_weighted_council_policy: "Assessed Council Franchise"
 kc_wealth_weighted_council_policy_desc: "Council influence follows registered commercial contributions. The resulting administration is capable and wealthy, but hereditary houses resent the elevation of taxable resources over lineage."

 kc_concord_market_law: "Market Compact"
 kc_concord_market_law_desc: "The terms under which houses, guilds, temples, and ports participate in the common market."
 kc_protected_guilds_policy: "Protected Guilds"
 kc_protected_guilds_policy_desc: "Traditional za privileges are confirmed, but tolls and standards are coordinated by the council."
 kc_licensed_exchanges_policy: "Licensed Exchanges"
 kc_licensed_exchanges_policy_desc: "Guild privileges remain, while the Concord licenses additional exchanges and arbitrates competition between established and new merchants."
 kc_open_exchange_policy: "Open Exchange"
 kc_open_exchange_policy_desc: "Barriers between house domains are reduced and commercial knowledge is allowed to circulate freely."

 kc_concord_arms_law: "Arms Compromise"
 kc_concord_arms_law_desc: "The settlement that gives the warrior houses honor and security without permitting private war."
 kc_house_retinues_policy: "House Retinues"
 kc_house_retinues_policy_desc: "Each Chartered House retains broad authority to recruit and maintain its own defensive army. House military targets and support rise, but these forces remain hereditary rather than accountable to common officers."
 kc_registered_retinues_policy: "Registered Retinues"
 kc_registered_retinues_policy_desc: "House forces remain under hereditary commanders, but their numbers, armories and obligations are recorded by common magistrates. Recruitment remains possible while the intended size of private armies is reduced."
 kc_common_arsenals_policy: "Common Arsenals"
 kc_common_arsenals_policy_desc: "Weapons and military stores pass into common depots. Japan's permanent army expands; existing House forces are grandfathered but private recruitment, manpower and maintenance become substantially less practical."

 kc_concord_roads_law: "Road Administration"
 kc_concord_roads_law_desc: "The apportionment of tolls, road maintenance, bridges, post stations, and the burdens imposed upon the houses by common infrastructure."
 kc_house_tolls_policy: "Traditional House Tolls"
 kc_house_tolls_policy_desc: "Houses retain their customary barriers and revenues. This reassures hereditary interests but fragments markets and delays common construction."
 kc_shared_road_fund_policy: "Shared Road Fund"
 kc_shared_road_fund_policy_desc: "The houses contribute to a negotiated fund for roads, bridges, and post stations without surrendering full control to the central administration."
 kc_central_kaido_assessment_policy: "Central Kaidō Assessment"
 kc_central_kaido_assessment_policy_desc: "A common assessment finances an integrated road network. Trade and construction flourish, but the houses resent permanent central claims upon their revenues."

 kc_concord_arbitration_law: "Commercial Adjudication"
 kc_concord_arbitration_law_desc: "Unlocked at 20 Concord Entrenchment. Repeated settlements between warrior houses, temples, guilds, and merchants have created enough precedent to define who may judge commercial disputes."
 kc_lineage_arbitration_policy: "Lineage Arbitration"
 kc_lineage_arbitration_policy_desc: "Disputes remain under hereditary house tribunals, with senior retainers expected to preserve face and negotiate a settlement before contracts are enforced. The familiar procedure reassures the buke but privileges lineage over consistent law."
 kc_mixed_commercial_benches_policy: "Mixed Commercial Benches"
 kc_mixed_commercial_benches_policy_desc: "House stewards sit beside guild elders, temple accountants, and Kaisho clerks. Judgments remain local, but written contracts and shared commercial practice receive equal standing."
 kc_concord_commercial_court_policy: "Concord Commercial Court"
 kc_concord_commercial_court_policy_desc: "A permanent court of trained magistrates hears disputes crossing house boundaries and publishes precedents binding throughout the Concord. Commerce becomes faster and more predictable, but hereditary courts lose authority."

 kc_concord_assessment_law: "Assessment and Survey"
 kc_concord_assessment_law_desc: "Unlocked at 40 Concord Entrenchment. Decades of ledgers and road assessments allow the council to compare local land measures, taxable output, and obligations that were once intentionally incomparable."
 kc_customary_assessments_policy: "Customary Assessments"
 kc_customary_assessments_policy_desc: "Each house retains its inherited measures and negotiates a customary contribution. This protects local privilege and political peace, though incompatible records make construction and exchange cumbersome."
 kc_registered_cadasters_policy: "Registered Cadasters"
 kc_registered_cadasters_policy_desc: "Local surveys remain valid after registration in a common ledger. Clerks translate between house measures, improving taxation and planning without imposing one standard upon every domain."
 kc_common_kenchi_policy: "Common Kenchi"
 kc_common_kenchi_policy_desc: "Concord surveyors conduct a common land and productivity assessment, recording fields, settlements, and obligations under shared measures. The resulting fiscal and infrastructure gains are substantial, but the survey exposes and displaces inherited exemptions."

 kc_concord_maritime_law: "Maritime Administration"
 kc_concord_maritime_law_desc: "Unlocked at 60 Concord Entrenchment. Merchant traffic, coastal raiding, and competition for northern and overseas ventures force the Houses to decide whether Japan's sea lanes are private privileges or a common responsibility."
 kc_house_port_privileges_policy: "House Port Privileges"
 kc_house_port_privileges_policy_desc: "Individual Houses retain authority over harbors, pilots, coastal levies and convoy arrangements. Chartered Houses are encouraged to maintain substantial private fleets."
 kc_licensed_coastal_convoys_policy: "Licensed Coastal Convoys"
 kc_licensed_coastal_convoys_policy_desc: "The Concord recognizes House fleets but issues common licenses, schedules and anti-piracy obligations. Shipbuilding remains available while the intended size of private fleets is reduced."
 kc_concord_maritime_board_policy: "Concord Maritime Board"
 kc_concord_maritime_board_policy_desc: "A permanent board centralizes charts, pilots, patrols and provisioning. Japan's fleet expands; existing House vessels are grandfathered but additional private naval expansion becomes expensive and slow."

 kc_concord_credit_law: "Credit Settlement"
 kc_concord_credit_law_desc: "Unlocked at 80 Concord Entrenchment. Temple guarantees, Kaisho ledgers, and inter-house payments have matured into a national credit system whose promises can circulate farther than the silver or rice behind them."
 kc_temple_guaranteed_credit_policy: "Temple-Guaranteed Credit"
 kc_temple_guaranteed_credit_policy_desc: "Trusted temples continue to witness obligations, safeguard deposits, and guarantee repayment through reputation and sacred sanction. Their conservative networks lower risk while preserving familiar moral limits upon finance."
 kc_house_clearinghouses_policy: "House Clearinghouses"
 kc_house_clearinghouses_policy_desc: "Senior Houses operate licensed clearinghouses that settle reciprocal debts and exchange bills between their Kaisho. Credit expands through private cooperation without granting a monopoly to the central state."
 kc_concord_notes_policy: "Concord Notes"
 kc_concord_notes_policy_desc: "The common Treasury and registered clearinghouses issue standardized notes accepted for taxes, contracts, and long-distance settlement. Capital moves more readily, but lesser houses fear dependence upon institutions dominated by the wealthiest members."

 kc_kaisho: "Kaisho Commercial House"
 kc_kaisho_desc: "A chartered counting house, warehouse, and arbitration hall through which a warrior lineage finances trade and supervises contracts."
 kc_kaisho_requirements: "Ledgers and Contracts"

 kc_jisha_za: "Jisha-za Temple"
 kc_jisha_za_desc: "A temple-linked guild combining sacred guarantees, literacy, credit, lodging, and commercial arbitration."

 kc_concord_council_hall: "Concord Council Hall"
 kc_concord_council_hall_desc: "A permanent capital chamber for the weighted Council of Houses, its clerks, archives, law ballots, commercial petitions, and public accounts. Unlike a shogun's palace, the hall belongs to the compact itself."
 kc_concord_council_hall_requirements: "Council Archives and Ceremonial Furnishings"

 kc_kaido_post_station: "Kaido Post Station"
 kc_kaido_post_station_desc: "A maintained relay of roads, bridges, pack animals, storehouses, and messengers serving both commerce and government."

 kc_tea_gardens: "House Tea Gardens"
 kc_tea_gardens_desc: "A Chartered House concession joining managed tea gardens, drying sheds, tools, timber works, credit, and transport. It can exist only where tea already grows, produces additional tea for its House, and improves the underlying raw-material economy by #G 5%#!. All Houses share one local concession limit that scales with development and RGO capacity in the same manner as a Shoen."
 kc_managed_tea_gardens: "Managed Tea Cultivation"
 kc_reserved_tea_garden_concession_tt: "No other House holds the tea concession here, or this House already holds it. The concession holder may construct every level permitted by the location's development and RGO size."

 kc_silk_farm: "House Silk Farm"
 kc_silk_farm_desc: "Mulberry plots, rearing houses, reeling sheds, tools, and House credit intensify an established silk district. It can exist only in a silk-producing location, produces additional silk for its House, and improves local raw-material output by #G 5%#!. All Houses share one local concession limit that scales with development and RGO capacity in the same manner as a Shoen."
 kc_managed_silk_farm: "Managed Sericulture"
 kc_reserved_silk_farm_concession_tt: "No other House holds the silk concession here, or this House already holds it. The concession holder may construct every level permitted by the location's development and RGO size."

 kc_iwor_stewardship: "Iwor Stewardship"
 kc_iwor_stewardship_desc: "A Chartered House recognizes Ainu customary hunting grounds, fisheries, gathering routes, and seasonal land use, employing local Ainu tribesmen without replacing their communities. Customary hunting dues produce wild game while the stewardship increases the location's existing raw-material output by #G 15%#!. The first House to establish a stewardship reserves that concession and may construct both permitted levels."
 kc_reserved_iwor_stewardship_concession_tt: "No other House holds the stewardship concession here, or this House already holds it. The concession holder may construct both permitted levels."
 kc_iwor_stewardship_dues: "Customary Hunting Dues"

 kc_iwor_exchange: "Iwor Exchange"
 kc_iwor_exchange_desc: "A negotiated storehouse and market employs local Ainu tribesmen to bring one customary northern product into wider Concord trade. Its production method may exchange furs, fish, grain, or timber, while its stronger brokerage network supplies income and merchant influence to its House. The first House to establish an exchange reserves that concession and may construct both permitted levels."
 kc_reserved_iwor_exchange_concession_tt: "No other House holds the exchange concession here, or this House already holds it. The concession holder may construct both permitted levels."
 kc_iwor_fur_exchange: "Pelt Exchange"
 kc_iwor_fish_exchange: "Fisheries Exchange"
 kc_iwor_grain_exchange: "Millet and Grain Exchange"
 kc_iwor_timber_exchange: "Timber Exchange"

 kc_house_ledgers: "House Ledgers"
 kc_house_ledgers_desc: "Standardized accounts and written contracts allow a warrior house to measure prestige in credit, cargo, and dependable payment."
 kc_kaido_stewardship: "Kaido Stewardship"
 kc_kaido_stewardship_desc: "Treating highways and post stations as shared assets binds distant domains into a more productive archipelago."
 kc_temple_credit: "Temple Credit Networks"
 kc_temple_credit_desc: "Religious institutions already possess literacy, trust, and far-reaching connections; formal charters turn those assets into dependable credit."


