l_english:
 kc_commercial_protectorate: "Concord Commercial Protectorate"
 kc_commercial_protectorate_desc: "A negotiated overseas compact whose local government retains broad internal authority while Japan guarantees its ports and Chartered Houses may hold licensed commercial concessions. Concord Japan may establish this subject while releasing a country or province through Make Subjects."
 LEAD_kc_commercial_protectorate: "$LIST$ is a [SUBJECT_TYPE.GetName]"
 AM_kc_commercial_protectorate: "[SUBJECT_TYPE.GetName] of $LIST$."
 kc_chartered_extraction_commission: "Chartered Extraction Commission"
 kc_chartered_extraction_commission_desc: "A coercive overseas commission in which local government survives beneath House concessions, compulsory remittances, and Japanese military guarantees. Establishing each independent Commission costs #R 3.00#! Concord Cohesion. Concord Japan may establish it while releasing a country or province through Make Subjects."
 LEAD_kc_chartered_extraction_commission: "$LIST$ is a [SUBJECT_TYPE.GetName]"
 AM_kc_chartered_extraction_commission: "[SUBJECT_TYPE.GetName] of $LIST$."
 kc_cb_continental_settlement: "Continental Settlement"
 kc_cb_continental_settlement_desc: "Impose a single comprehensive settlement upon Korea and decide its constitutional relationship with the Kitayama Concord."
 kc_cb_chartered_treaty_coast: "Chartered Treaty-Coast War"
 kc_cb_chartered_treaty_coast_desc: "Compel the holder of China's mandate to release one or more of five limited coastal sectors as locally governed Commercial Protectorates. Each sector costs 20 War Score; all five together cost 100."
 kc_cb_extraction_treaty_coast: "Extraction Treaty-Coast War"
 kc_cb_extraction_treaty_coast_desc: "Compel the holder of China's mandate to release one or more of five limited coastal sectors as House-dominated Extraction Commissions. Each sector costs 20 War Score; all five together cost 100."
 kc_impose_korean_settlement: "Impose the Korean Settlement"
 kc_impose_korean_settlement_entry: "Impose the Korean Settlement upon [TARGET_COUNTRY.GetNameWithFlag]"
 kc_impose_korean_settlement_entry_short: "Impose the Korean Settlement upon [TARGET_COUNTRY.GetNameWithFlagWithNoTooltip]"
 kc_impose_korean_settlement_desc: "Transfer the Korean region to Japan so its final constitutional settlement can be proclaimed."
 kc_impose_korean_settlement_select_region: "The Lands of the Korean Settlement"
 kc_impose_korean_settlement_region_tt: "Select the Korea Region. Every location there held by the defeated country will pass to Japan for the final settlement."
 kc_impose_korean_settlement_no_region: "The Korea Region is not available for settlement."
 kc_charter_coastal_protectorate: "Charter Treaty Ports"
 kc_charter_coastal_protectorate_entry: "Charter [target.GetName] Treaty Ports"
 kc_charter_coastal_protectorate_entry_short: "Charter [target.GetNameWithNoTooltip] Treaty Ports"
 kc_charter_coastal_protectorate_desc: "Release the designated ports of the selected Chinese coastal sector as a Concord Commercial Protectorate. Five sectors are available at 20 War Score each."
 kc_establish_coastal_extraction_commission: "Commission Treaty Ports"
 kc_establish_coastal_extraction_commission_entry: "Commission [target.GetName] Treaty Ports"
 kc_establish_coastal_extraction_commission_entry_short: "Commission [target.GetNameWithNoTooltip] Treaty Ports"
 kc_establish_coastal_extraction_commission_desc: "Release the designated ports of the selected Chinese coastal sector as a Chartered Extraction Commission. Five sectors are available at 20 War Score each; each new Commission also costs 3.00 Concord Cohesion."
 kc_fixed_korean_settlement_cost: "Comprehensive Korean settlement"
 kc_fixed_treaty_coast_cost: "One limited treaty-coast sector"
 kc_select_treaty_coast_area: "Select a Commercial Treaty Coast"
 kc_select_extraction_coast_area: "Select an Extraction Commission"
 kc_no_treaty_coast_areas: "@trigger_no! The mandate holder owns no eligible location in the five limited treaty-coast sectors."
 antagonism_kc_korean_settlement: "Imposed a comprehensive Korean settlement in a [peace_treaty|e]"
 antagonism_kc_commercial_treaty_coast: "Established a Commercial Protectorate in a [peace_treaty|e]"
 antagonism_kc_extraction_treaty_coast: "Established an Extraction Commission in a [peace_treaty|e]"
 kc_overseas_settlements.1.title: "Registers for a Taiwanese Province"
 kc_overseas_settlements.1.desc: "The first full survey of this Taiwanese province records established communities, new settlers, and competing House claims. The Concord must decide whether its rule begins with treaties, mixed registers, or concessionary extraction."
 kc_overseas_settlements.1.a: "Recognize registered treaty ports."
 kc_overseas_settlements.1.b: "Compile mixed settlement registers."
 kc_overseas_settlements.1.c: "Issue House concession surveys."
 kc_overseas_settlements.2.title: "A Compact with Tondo"
 kc_overseas_settlements.2.desc: "Tondo's court offers loyalty in return for a commercial guarantee equal to five years of its own trade-and-tax income. The compact can be opened by a Japanese foothold in Luzon or Taiwan, or by commanding the largest share of trade at Maynila. If ratified, Tondo will become a Commercial Protectorate, receive Japanese Luzon holdings, and transfer its remaining settlement rights to Japan."
 kc_overseas_settlements.2.a: "Purchase Tondo's loyalty and conclude the Luzon Compact."
 kc_overseas_settlements.2.b: "Postpone negotiations for five years."
 kc_overseas_settlements.3.title: "A Compact with Cebu"
 kc_overseas_settlements.3.desc: "Cebu's court offers loyalty in return for a commercial guarantee equal to five years of its own trade-and-tax income. The compact can be opened by a Japanese foothold in the Visayas or Taiwan, or by commanding the largest share of trade at Maynila. If ratified, Cebu will become a Commercial Protectorate, receive Japanese Visayan holdings, and transfer its remaining settlement rights to Japan."
 kc_overseas_settlements.3.a: "Purchase Cebu's loyalty and conclude the Visayan Compact."
 kc_overseas_settlements.3.b: "Postpone negotiations for five years."
 kc_overseas_settlements.4.title: "A Compact with Butuan"
 kc_overseas_settlements.4.desc: "Butuan's court offers loyalty in return for a commercial guarantee equal to five years of its own trade-and-tax income. The compact can be opened by a Japanese foothold in Mindanao or Taiwan, or by commanding the largest share of trade at Maynila. If ratified, Butuan will become a Commercial Protectorate, receive Japanese Mindanao holdings, and transfer its remaining settlement rights to Japan."
 kc_overseas_settlements.4.a: "Purchase Butuan's loyalty and conclude the Mindanao Compact."
 kc_overseas_settlements.4.b: "Postpone negotiations for five years."
 kc_overseas_settlements.5.title: "The Northern Colonial Administration"
 kc_overseas_settlements.5.desc: "Our first permanent register beyond Liaodong is too distant for ordinary provincial government. Surveyors recommend a colonial administration able to absorb later settlements throughout the Amur and Sakhalin country."
 kc_overseas_settlements.5.a: "Charter the Northern Colonial Administration."
 kc_overseas_settlements.5.b: "Retain direct rule for five more years."
 kc_continental.1.title: "The Continental War That Never Was"
 kc_continental.1.desc: "Across the strait, Korea controls the road to the continental markets. Generals see a single decisive campaign; Houses see ports and contracts; the Secretariat sees a test of whether a concord founded to prevent civil war may export order by force."
 kc_continental.1.a: "Exchange embassies across the strait."
 kc_continental.1.b: "Pursue House-to-House exchange compacts."
 kc_continental.1.c: "Authorize a continental settlement by force."
 kc_continental.2.title: "Registers for a Continental Army"
 kc_continental.2.desc: "Authorization is not mobilization. Powder, food, shipping, and wages must now pass through institutions designed for commerce rather than invasion."
 kc_continental.2.a: "Fund common magazines from the Treasury."
 kc_continental.2.b: "Contract the campaign to the Houses."
 kc_continental.2.c: "Mobilize with the registers we possess."
 kc_continental.3.title: "The Strait Remains Open"
 kc_continental.3.desc: "The Concord has chosen exchange over conquest. The decision is not pacifism, but a judgment that contracts and embassies can cross the strait more cheaply than armies."
 kc_continental.3.a: "Enter the precedent in the common ledger."
 kc_continental.4.title: "The Korean Settlement"
 kc_continental.4.desc: "The Korean court has yielded and the peninsula now awaits a constitution. A unified protectorate would preserve its institutions; four commissions would multiply House opportunities; direct rule would demand a costly occupation."
 kc_continental.4.a: "Charter one Korean Commercial Protectorate."
 kc_continental.4.b: "Divide Korea into four Extraction Commissions."
 kc_continental.4.c: "Retain Korea under direct Japanese administration."
 kc_continental.5.title: "Beyond Korea: The Treaty Coast"
 kc_continental.5.desc: "Korean harbors place the Concord at the threshold of [SCOPE.sCountry('china').GetName]. Advocates of continued expansion reject an impossible conquest of the whole realm. Instead they propose five limited treaty-coast sectors, each costing twenty War Score, so an incomplete victory can still secure a partial settlement while the entire design costs one hundred."
 kc_continental.5.a: "Authorize both treaty-coast doctrines."
 kc_continental.5.b: "Let Korea be the terminal settlement."
 kc_continental.7.title: "A Chartered Coast"
 kc_continental.7.desc: "A coastal area has entered the Concord's overseas order as a Commercial Protectorate. Its government remains local; Japanese authority is concentrated in guarantees, ports, and licensed concessions."
 kc_continental.7.a: "Register the new protectorate."
 kc_continental.8.title: "An Extraction Coast"
 kc_continental.8.desc: "A coastal jurisdiction has been placed beneath a Chartered Extraction Commission. Its larger remittances enrich the overseas system, but coercive concessions have already reduced Concord Cohesion by #R 3.00#!."
 kc_continental.8.a: "Register the commission and its liabilities."
 kc_taiwan_registered_treaty_ports: "Registered Taiwanese Treaty Ports"
 kc_taiwan_registered_treaty_ports_desc: "Local communities retain recognized land and port rights beneath a negotiated Concord register."
 kc_taiwan_mixed_settlement_registers: "Mixed Taiwanese Settlement Registers"
 kc_taiwan_mixed_settlement_registers_desc: "New settlers and established communities share a deliberately imperfect provincial register."
 kc_taiwan_house_concession_surveys: "Taiwanese House Concession Surveys"
 kc_taiwan_house_concession_surveys_desc: "Survey lines prioritize House production claims over local demographic stability."
 kc_northern_direct_administration: "Provisional Northern Administration"
 kc_northern_direct_administration_desc: "Japan continues to manage its distant northern settlements directly while a permanent charter is postponed."
 kc_strait_embassies: "Embassies Across the Strait"
 kc_strait_embassies_desc: "Regular Korean embassies make continental exchange a diplomatic institution rather than a military project."
 kc_strait_exchange_compacts: "Strait Exchange Compacts"
 kc_strait_exchange_compacts_desc: "Licensed Houses coordinate Korean trade through durable private compacts."
 kc_continental_common_magazines: "Continental Common Magazines"
 kc_continental_common_magazines_desc: "Treasury-funded magazines coordinate food, powder, and replacements for an overseas campaign."
 kc_continental_house_contracts: "Continental House Contracts"
 kc_continental_house_contracts_desc: "Chartered Houses underwrite the war in return for influence over its settlement."
 kc_continental_unprepared_mobilization: "Unprepared Continental Mobilization"
 kc_continental_unprepared_mobilization_desc: "Japan has authorized a continental war without paying to adapt its commercial registers for mass mobilization."
 kc_direct_korean_administration: "Direct Korean Administration"
 kc_direct_korean_administration_desc: "The peninsula is held directly, bringing revenue at the price of control and diplomatic administration."
 kc_korean_terminal_settlement: "Korea as the Terminal Settlement"
 kc_korean_terminal_settlement_desc: "Japan publicly limits its continental order to Korea and converts victory into a stable diplomatic boundary."
