 kc_debug.56.title: "Test Taiwanese Settlement"
 kc_debug.56.desc: "Open the Taiwanese provincial settlement panel for a fixed western province."
 kc_debug.56.a: "Open the Taiwanese policy panel."
 kc_debug.57.title: "Test Philippine Compacts"
 kc_debug.57.desc: "Open one local economic compact. The relevant country must still exist for acceptance to function."
 kc_debug.57.a: "Test the Tondo compact."
 kc_debug.57.b: "Test the Cebu compact."
 kc_debug.57.c: "Test the Butuan compact."
 kc_debug.58.title: "Test Northern Colonial Administration"
 kc_debug.58.desc: "Give Japan Nayoro as a test foothold and open the northern colonial charter."
 kc_debug.58.a: "Prepare the northern charter."
 kc_debug.59.title: "Test the Continental Question"
 kc_debug.59.desc: "Open the Continental War That Never Was without waiting for 1585."
 kc_debug.59.a: "Convene the continental council."
 kc_debug.60.title: "Test the Korean Settlement"
 kc_debug.60.desc: "Transfer locations in the Korean region owned by KOR to Japan and open the constitutional settlement."
 kc_debug.60.a: "Simulate the Korean victory."
 kc_debug.61.title: "Test the Treaty-Coast Doctrines"
 kc_debug.61.desc: "Authorize and grant both event CBs against the current CHI mandate holder."
 kc_debug.61.a: "Grant both treaty-coast CBs."
