l_english:
 kc_overseas_subjects.1.title: "A Harbor Petitions the Common Treasury"
 kc_overseas_subjects.1.desc: "The government of [SCOPE.sCountry('kc_overseas_subject').GetName] petitions for quays, bonded warehouses, and navigational works. The work may be financed by the common Treasury, conceded to the Houses, or entrusted to local councils."
 kc_overseas_subjects.1.desc.korea: "The government of [SCOPE.sCountry('kc_overseas_subject').GetName] petitions for repairs to Korean river landings, coastal quays, and the roads joining them. Every proposed warehouse reopens the question of whether the peninsula is a partner of the Concord or a field for House concessions."
 kc_overseas_subjects.1.desc.china: "The treaty ports of [SCOPE.sCountry('kc_overseas_subject').GetName] have outgrown their first bonded compounds. Chinese magistrates, Japanese factors, and harbor guilds each submit a different plan for new quays and warehouses."
 kc_overseas_subjects.1.desc.philippines: "The harbor councils of [SCOPE.sCountry('kc_overseas_subject').GetName] ask the Concord to improve anchorages, storehouses, and storm shelters without surrendering the compact that placed those ports under local government."
 kc_overseas_subjects.1.desc.taiwan: "The mixed registers of [SCOPE.sCountry('kc_overseas_subject').GetName] now require permanent quays and warehouses. Local communities insist that new works respect the treaty lines recorded during the first surveys."
 kc_overseas_subjects.1.a: "Finance common harbor works from the Treasury."
 kc_overseas_subjects.1.b: "Concede the works to a House syndicate."
 kc_overseas_subjects.1.c: "Recognize a locally financed harbor council."

 kc_overseas_subjects.2.title: "Whose Court Judges the Contract?"
 kc_overseas_subjects.2.desc: "A dispute in [SCOPE.sCountry('kc_overseas_subject').GetName] pits a local merchant against a Chartered House factor. Both contracts are valid under different seals, and the judgment will define whose law follows Concord trade overseas."
 kc_overseas_subjects.2.desc.korea: "A Korean guild in [SCOPE.sCountry('kc_overseas_subject').GetName] refuses a House factor's interpretation of a warehouse lease. The old local court, the House tribunal, and the Concord register each claim jurisdiction."
 kc_overseas_subjects.2.desc.china: "A Chinese merchant in [SCOPE.sCountry('kc_overseas_subject').GetName] presents a magistrate's judgment against a Japanese House factor, who answers with a treaty-port charter bearing the Concord seal."
 kc_overseas_subjects.2.desc.philippines: "A harbor chief in [SCOPE.sCountry('kc_overseas_subject').GetName] invokes the original compact against a House factor's private contract. Both sides ask Japan to confirm which promise governs the port."
 kc_overseas_subjects.2.desc.taiwan: "A dispute in [SCOPE.sCountry('kc_overseas_subject').GetName] crosses local custom, a settler register, and a House concession. No court can decide it without defining the limits of all three."
 kc_overseas_subjects.2.a: "Register the judgment of the local courts."
 kc_overseas_subjects.2.b: "Uphold the Chartered House tribunal."
 kc_overseas_subjects.2.c: "Send Concord mediators to reconcile both seals."

 kc_overseas_subjects.3.title: "The Commission's Quota Falls into Arrears"
 kc_overseas_subjects.3.desc: "The Extraction Commission governing [SCOPE.sCountry('kc_overseas_subject').GetName] reports that its assessed quota cannot be met without seizing seed, tools, and merchant inventories. Its charter-holders dispute whether the shortfall is temporary hardship or organized resistance."
 kc_overseas_subjects.3.desc.korea: "The Extraction Commission in [SCOPE.sCountry('kc_overseas_subject').GetName] has missed its quota after poor harvests and blocked inland roads. Korean petitioners call the assessment ruinous; House factors call the petitions coordinated resistance."
 kc_overseas_subjects.3.desc.china: "Customs receipts in [SCOPE.sCountry('kc_overseas_subject').GetName] no longer match the Commission's ledgers. Chinese brokers blame disrupted markets, while House agents allege that cargo is being diverted beyond the treaty coast."
 kc_overseas_subjects.3.desc.philippines: "The Commission in [SCOPE.sCountry('kc_overseas_subject').GetName] cannot collect its quota without violating older harbor compacts and tribute obligations. Local leaders threaten to close the roads to its warehouses."
 kc_overseas_subjects.3.desc.taiwan: "The Commission in [SCOPE.sCountry('kc_overseas_subject').GetName] has assessed fields and forests that local registers never placed under House concession. Its quota is now both unpaid and openly disputed."
 kc_overseas_subjects.3.a: "Remit the quota and restore productive households."
 kc_overseas_subjects.3.b: "Enforce the assessment in full."
 kc_overseas_subjects.3.c: "Let the sponsoring Houses guarantee the shortfall."

 kc_overseas_subjects.4.title: "A Petition to Rewrite the Commission Charter"
 kc_overseas_subjects.4.desc: "Officials and merchants from [SCOPE.sCountry('kc_overseas_subject').GetName] submit a revised charter. They offer dependable treaty-port trade in return for ending compulsory extraction, while the sponsoring Houses demand stronger guarantees instead."
 kc_overseas_subjects.4.desc.korea: "Officials from [SCOPE.sCountry('kc_overseas_subject').GetName] ask Japan to replace the Korean Commission with a commercial protectorate recognizing local taxation and law. The concessionary Houses answer that only a tighter charter can secure the peninsula."
 kc_overseas_subjects.4.desc.china: "Merchants and magistrates from [SCOPE.sCountry('kc_overseas_subject').GetName] propose converting the treaty-coast Commission into a commercial protectorate. House factors warn that loosening the charter will surrender the very customs revenue won by war."
 kc_overseas_subjects.4.desc.philippines: "Delegates from [SCOPE.sCountry('kc_overseas_subject').GetName] ask that their Commission be rewritten as a negotiated harbor compact. The Houses insist that oceanic risk entitles them to firmer concessions."
 kc_overseas_subjects.4.desc.taiwan: "Settlers and established communities in [SCOPE.sCountry('kc_overseas_subject').GetName] petition to replace concessionary extraction with a treaty-port protectorate grounded in the first provincial surveys."
 kc_overseas_subjects.4.a: "Redeem the charter and establish a Commercial Protectorate."
 kc_overseas_subjects.4.b: "Register reforms while preserving the Commission."
 kc_overseas_subjects.4.c: "Tighten the extraction charter."

 kc_overseas_subjects.5.title: "Two Houses, One Concession"
 kc_overseas_subjects.5.desc: "Two Chartered Houses present overlapping licenses in [SCOPE.sCountry('kc_overseas_subject').GetName]. One claims the warehouse, the other the road and resource district serving it. Their private guards have begun marking the same gates."
 kc_overseas_subjects.5.a: "Purchase both claims and issue one common register."
 kc_overseas_subjects.5.b: "Confirm the senior House's concession."
 kc_overseas_subjects.5.c: "Return the disputed ground to local magistrates."

 kc_overseas_subjects.6.title: "The Overseas Assessment"
 kc_overseas_subjects.6.desc: "The annual registers from [SCOPE.sCountry('kc_overseas_subject').GetName] are complete. The Concord may draw an extraordinary assessment into the common Treasury, reinvest its share locally, or allow the Houses to receive the remittance directly."
 kc_overseas_subjects.6.a: "Collect the registered assessment for the Treasury."
 kc_overseas_subjects.6.b: "Reinvest the common share overseas."
 kc_overseas_subjects.6.c: "Let the Houses receive their remittances directly."

