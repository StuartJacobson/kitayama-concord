l_english:
 kc_phase2_framework.1.title: "The Concord Faces the Open Sea"
 kc_phase2_framework.1.desc: "The Hundred-Year Articles can settle precedence between a House warehouse and a temple estate, define the obligations of a road steward, and carry the same judgment from Kyoto to the Inland Sea. They say far less about interpreters, foreign captains, distant courts, or settlements beyond Japan's familiar sea roads.\n\nMerchants now return with charts whose edges do not end at Korea or China. Port councils ask whose seal may license a voyage. Senior Houses claim that their hereditary connections make them Japan's natural representatives abroad, while the Concord State argues that no private charter should speak for the whole realm. The court proposes to record both forms of authority until experience supplies a lasting rule.\n\nThe Renaissance advancement #Y Registers of the Open Sea#! is researched automatically and grants a dedicated bureaucracy slot. The #Y Office of Maritime Exchange#! will be established automatically at half funding, after which the Concord must settle its maritime constitution."
 kc_phase2_framework.1.a: "Let qualified Houses carry their own seals abroad."
 kc_phase2_framework.1.b: "Foreign powers shall receive one common seal."
 kc_phase2_framework.1.c: "Record both claims beneath the court's authority."

 kc_office_maritime_exchange_bureaucracy: "Office of Maritime Exchange"
 kc_office_maritime_exchange_bureaucracy_desc: "Interpreters, port inspectors, maritime judges, customs registrars, and surveyors give the Concord a permanent means of dealing with countries and seas beyond Japan. Its accumulated correspondence and charts provide #G +1 Diplomatic Reputation#! and #G +10% Maritime Presence#! at every funding level. At full maintenance and zero bureaucracy Entrenchment, the Office provides #G +5% Institution Growth#!, #G -20% Diplomatic Spending Cost#!, and #G +125 Trade, Naval, and Colonial Range#!. These funded benefits strengthen to twice those values at 100 Entrenchment. Underfunding raises Merchant Maintenance and reduces Burgher Satisfaction. Its maintenance uses the standard bureaucracy cost multiplier and does not remit funds to the Concord Treasury."
 MODIFIER_TYPE_NAME_kc_office_maritime_exchange_bureaucracy_impact_modifier: "$kc_office_maritime_exchange_bureaucracy$ Impact"
 MODIFIER_TYPE_DESC_kc_office_maritime_exchange_bureaucracy_impact_modifier: "This modifies the effectiveness of the $kc_office_maritime_exchange_bureaucracy$."

 kc_registers_open_sea: "Registers of the Open Sea"
 kc_registers_open_sea_desc: "The Concord extends the logic of its domestic ledgers to foreign ports, interpreters, shipping licenses, and diplomatic correspondence. This automatically researched advancement reserves a bureaucracy slot for the Office of Maritime Exchange."
 kc_licensed_oceanic_convoys: "Licensed Oceanic Convoys"
 kc_licensed_oceanic_convoys_desc: "Common sailing rules, recognized convoy captains, and enforceable shares allow Japanese shipping to travel farther without turning every voyage into an improvised private expedition."
 kc_standardized_teppo_workshops: "Standardized Teppō Workshops"
 kc_standardized_teppo_workshops_desc: "Gunsmiths may retain their local methods, but gauges, shot, fittings, and inspection marks must be intelligible to arsenals and soldiers throughout the Concord."
 kc_houses_of_translation: "Houses of Translation"
 kc_houses_of_translation_desc: "Permanent colleges of interpreters compare foreign books, contracts, charts, and religious arguments instead of allowing knowledge to remain the private possession of a single visiting mission or House."
 kc_silver_clearing_exchanges: "Silver Clearing Exchanges"
 kc_silver_clearing_exchanges_desc: "Regional exchange houses reconcile bullion, notes, temple credit, and House obligations through published standards, reducing delays without assuming that every coin or contract is identical."
 kc_colonial_survey_registers: "Colonial Survey Registers"
 kc_colonial_survey_registers_desc: "Surveyors record coasts, anchorages, treaty lands, settlement obligations, and colonial jurisdictions before distant ventures harden into private possessions that the Concord cannot govern."

 kc_council_of_licensed_ports: "Council of Licensed Ports"
 kc_council_of_licensed_ports_desc: "Japan's principal ports and Chartered Houses receive broad authority to negotiate, equip shipping, and maintain foreign commercial relationships under revocable Concord licenses. The system rewards initiative and maritime competition, but its overlapping jurisdictions make common administration less efficient."
 kc_national_board_of_exchange: "National Board of Exchange"
 kc_national_board_of_exchange_desc: "Foreign correspondence, customs standards, institutional exchange, and major commercial rules are coordinated by a national board responsible to the Concord State. Its common administration is efficient, but established warrior lineages resent the steady transfer of authority from inherited charters to public offices."

 kc_phase2_framework.2.title: "The Maritime Constitution"
 kc_phase2_framework.2.desc: "Registers and interpreters can describe the world beyond Japan, but they cannot decide who possesses the authority to act there. The Chartered Houses demand licenses broad enough to reward risk, inherited contacts, and private initiative. Officials of the Concord State answer that foreign courts must receive one seal, one standard, and one accountable voice.\n\nThe settlement chosen here will become a permanent part of the Concord's government. Its reform supplies the additional reform slot it occupies."
 kc_phase2_framework.2.a: "Let the licensed ports carry Japan onto the seas."
 kc_phase2_framework.2.b: "Foreign exchange requires one national board."

 kc_debug.41.title: "Prepare the Second-Century Concord"
 kc_debug.41.desc: "The first option marks the Hundred-Year Articles complete, sets Concord Entrenchment to 100, removes any existing maritime constitutional choice, and reopens the normal Phase 2 introduction. The Maritime Constitution follows after thirty days. The second exposes all five advancements that will normally be unlocked by later Phase 2 stories and grants a large amount of Research Progress."
 kc_debug.41.a: "Open Phase 2 through its normal introduction."
 kc_debug.41.b: "Expose every story-gated Phase 2 advancement."
 kc_debug.42.title: "Fund the Office of Maritime Exchange"
 kc_debug.42.desc: "Set the Office's maintenance directly and compare its funded effects and recurring expense. The Office must already exist."
 kc_debug.42.a: "Suspend the Office's funding."
 kc_debug.42.b: "Fund half of the Office's budget."
 kc_debug.42.c: "Fund the Office's full budget."
 kc_debug.43.title: "Entrench the Office of Maritime Exchange"
 kc_debug.43.desc: "Set the Office's native bureaucracy Entrenchment directly. At full maintenance its funded effects should be at their listed base values at zero Entrenchment, halfway to double strength at 50, and exactly double at 100."
 kc_debug.43.a: "Set Office Entrenchment to 0."
 kc_debug.43.b: "Set Office Entrenchment to 50."
 kc_debug.43.c: "Set Office Entrenchment to 100."
