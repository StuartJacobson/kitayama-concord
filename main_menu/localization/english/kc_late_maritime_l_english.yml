 # Merchants of Competing Europes
 kc_competing_europes.1.title: "Four Flags at the Exchange Hall"
 kc_competing_europes.1.desc: "The Southern Exchange Hall was built to translate unfamiliar weights, languages, and contracts into Japanese law. It now faces a different problem: merchants serving rival European crowns and chartered companies have arrived together. Each promises silver, arms, and oceanic intelligence; each also asks that its competitors be placed behind it. Japan must decide who hears these rival claims."
 kc_competing_europes.1.a: "Let every company bid before the common auction."
 kc_competing_europes.1.b: "Assign each company a Chartered House broker."
 kc_competing_europes.1.c: "Rank every license under national seals."
 kc_competing_europes.2.title: "The Price of Exclusivity"
 kc_competing_europes.2.desc: "One foreign company offers favorable credit, cannon, and guaranteed shipping space if its rivals are denied the same privileges. Its clerks call this an ordinary bargain. The Houses call it a chance to secure an entire route. The Maritime Office warns that a monopoly written today may become foreign leverage tomorrow."
 kc_competing_europes.2.a: "Pay the cost of preserving open competition."
 kc_competing_europes.2.b: "Permit rotating, time-limited House concessions."
 kc_competing_europes.2.c: "Accept a regulated preferred supplier."
 kc_competing_europes.3.title: "Chapel, Warehouse, and Countinghouse"
 kc_competing_europes.3.desc: "Foreign merchants insist that worship, burial, and pastoral care cannot be separated from long residence. Japanese converts answer that licensed commerce has already created communities requiring law and protection. Temple interests fear that warehouses will become missions, while port magistrates care chiefly that every resident can be registered and held liable."
 kc_competing_europes.3.a: "Separate the chapel from the warehouse in law."
 kc_competing_europes.3.b: "Permit worship inside registered company quarters."
 kc_competing_europes.3.c: "Place every foreign quarter under national supervision."
 kc_competing_europes.4.title: "The Register of Competing Companies"
 kc_competing_europes.4.desc: "Years of rival petitions have clarified the dispute. No single foreign crown or company can define Japan's maritime future. The final register must instead define the Japanese institution through which all of them compete."
 kc_competing_europes.4.a: "Establish a common competitive register."
 kc_competing_europes.4.b: "Confirm the Chartered Houses as foreign brokers."
 kc_competing_europes.4.c: "Create a national register of foreign companies."

 # Japanese Overseas Communities
 kc_overseas_communities.1.title: "Streets Called Nihonmachi"
 kc_overseas_communities.1.desc: "Red-Seal captains report that Japanese warehouses abroad no longer stand alone. Streets of lodgings, workshops, shrines, chapels, kitchens, and family houses have grown around them. Local rulers welcome the customs revenue but ask who speaks for these settlements when a captain has sailed and a House factor is far away."
 kc_overseas_communities.1.a: "Negotiate municipal charters with local rulers."
 kc_overseas_communities.1.b: "Recognize proprietary House enclaves."
 kc_overseas_communities.1.c: "Enter every quarter in a national consular register."
 kc_overseas_communities.2.title: "Two Laws in One Street"
 kc_overseas_communities.2.desc: "A disputed cargo has become a test of jurisdiction. The contract was written under a Japanese seal, witnessed by local brokers, financed by a Chartered House, and breached inside a foreign port. Every court can claim the case, and none can enforce a judgment alone."
 kc_overseas_communities.2.a: "Endow mixed courts with common funds."
 kc_overseas_communities.2.b: "Make the sponsoring House guarantor and judge."
 kc_overseas_communities.2.c: "Refer Red-Seal disputes to Japanese consuls."
 kc_overseas_communities.3.title: "Children of Two Shores"
 kc_overseas_communities.3.desc: "The overseas quarters are no longer inhabited only by temporary merchants. Mixed families now inherit houses, debts, languages, and obligations on both shores. Their petitions ask whether the Concord recognizes them as local townspeople, registered maritime families, or dependents of the Houses that first sponsored their settlements."
 kc_overseas_communities.3.a: "Recognize their civic membership on both shores."
 kc_overseas_communities.3.b: "Protect families through reciprocal registries."
 kc_overseas_communities.3.c: "Let Houses sponsor inheritance and passage."
 kc_overseas_communities.4.title: "The Returning Ships"
 kc_overseas_communities.4.desc: "Returning merchants bring remittances, foreign books, navigational experience, converts, and lawsuits. Their money can improve common infrastructure, expand private House capital, or professionalize the Maritime Office that keeps correspondence with communities abroad."
 kc_overseas_communities.4.a: "Match their remittances with common works."
 kc_overseas_communities.4.b: "Let House capital follow the returning merchants."
 kc_overseas_communities.4.c: "Endow the Maritime Office with their knowledge."
 kc_overseas_communities.5.title: "Articles for Communities Abroad"
 kc_overseas_communities.5.desc: "The Nihonmachi cannot remain accidental extensions of individual voyages. The Concord must recognize a durable system for their courts, families, remittances, and relations with local rulers."
 kc_overseas_communities.5.a: "Ratify municipal compacts with local authorities."
 kc_overseas_communities.5.b: "Ratify a network of House consular enclaves."
 kc_overseas_communities.5.c: "Ratify a national consular service."

 # Regulation of the Open Seas
 kc_regulation_open_seas: "Regulation of the Open Seas"
 kc_regulation_open_seas_desc: "A century of Red-Seal voyages, foreign companies, Japanese communities abroad, treaty ports, and Chartered House fleets has made overseas contact permanent. The Concord must replace its provisional maritime constitution with lasting Articles defining whether the open seas are administered by autonomous Houses, registered public ports, or a national maritime service."
 kc_regulation_open_seas_end_tt: "The settlement concludes at #Y 100 Ratification Progress#!, or ends unsuccessfully if Japan, the Concord, or the Concordate settlement ceases to exist."
 kc_regulation_open_seas_monthly_tt: "The settlement gains #G 0.70 Progress#! each month. A funded Office of Maritime Exchange adds #G 0.20#!, the Red-Seal system adds #G 0.05#!, overseas subjects add #G 0.05#!, and peace adds #G 0.05#!. War subtracts #R 0.15#!, and Cohesion below 20 subtracts another #R 0.15#!."
 kc_regulation_open_seas_map_state_tt: "Japan directs the final ratification of the Concord's open-seas constitution."
 kc_regulation_open_seas_map_house_tt: "A Chartered House supplies ships, merchants, and political pressure to the open-seas settlement."
 KC_ROS_LEGEND_STATE: "Concord State"
 KC_ROS_LEGEND_HOUSES: "Chartered Houses"
 KC_ROS_SETTLEMENT_PROGRESS: "Ratification Progress"
 KC_ROS_MONTHLY_PROGRESS: "Monthly Progress"
 KC_ROS_COUNCIL_OVERVIEW: "The Open-Seas Articles"
 KC_ROS_PANEL_OVERVIEW: "Earlier reforms and maritime settlements supply influence but do not bind the final vote. House freedom favors commerce and colonial initiative; registered ports balance local law with common guarantees; national administration favors naval coordination and a permanent foreign service."
 KC_ROS_HOUSE_INFLUENCE: "Chartered Ports"
