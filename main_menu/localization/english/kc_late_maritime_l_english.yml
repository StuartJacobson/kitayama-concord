 kc_regulation_open_seas.1.title: "The Open Seas Cannot Be Unwritten"
 kc_regulation_open_seas.1.desc: "Japan can no longer regulate foreign contact by treating every voyage as an exception. Houses maintain oceanic accounts, Japanese families live beneath foreign laws, and rival companies petition permanent offices. The council opens a final set of Articles—not to close the seas, but to decide who governs an open maritime realm."
 kc_regulation_open_seas.1.a: "Let the chartered ports present the first draft."
 kc_regulation_open_seas.1.b: "Begin from reciprocal public registers."
 kc_regulation_open_seas.1.c: "Ask the Maritime Office for a national code."
 kc_regulation_open_seas.2.title: "Who May Carry the Seal?"
 kc_regulation_open_seas.2.desc: "A Red Seal protects merchants only because ports abroad believe Japan will honor it. The council must decide whether Houses warrant their own captains, public registrars share liability, or a national office alone issues oceanic credentials."
 kc_regulation_open_seas.2.a: "Let each House answer for its captains."
 kc_regulation_open_seas.2.b: "Create reciprocal registers and common sureties."
 kc_regulation_open_seas.2.c: "Reserve oceanic seals to the national office."
 kc_regulation_open_seas.3.title: "Residence of Foreign Companies"
 kc_regulation_open_seas.3.desc: "Foreign factors now expect to remain for years rather than seasons. Their leases, servants, warehouses, and debts require a durable jurisdiction inside Japanese ports."
 kc_regulation_open_seas.3.a: "Let Houses lease and police company quarters."
 kc_regulation_open_seas.3.b: "Charter self-governing wards under mixed courts."
 kc_regulation_open_seas.3.c: "Place all company residences beneath national magistrates."
 kc_regulation_open_seas.4.title: "Faith and Law in the Open Ports"
 kc_regulation_open_seas.4.desc: "Commerce has carried religious communities in both directions. The question is no longer whether belief can cross the sea, but which institution registers worship, protects residents, and prosecutes violations of local peace."
 kc_regulation_open_seas.4.a: "Leave worship clauses to individual House contracts."
 kc_regulation_open_seas.4.b: "Guarantee registered worship under port law."
 kc_regulation_open_seas.4.c: "Make national magistrates responsible for every foreign congregation."
 kc_regulation_open_seas.5.title: "Protection of Communities Abroad"
 kc_regulation_open_seas.5.desc: "A riot in an overseas quarter and the seizure of a Japanese cargo expose the limits of informal protection. Any answer must respect local rulers while ensuring that merchants and families do not become hostages to distant disputes."
 kc_regulation_open_seas.5.a: "House guarantors will negotiate restitution."
 kc_regulation_open_seas.5.b: "Fund reciprocal municipal protection compacts."
 kc_regulation_open_seas.5.c: "Dispatch national consuls and protected convoys."
 kc_regulation_open_seas.6.title: "House Fleets and National War"
 kc_regulation_open_seas.6.desc: "Merchant ships can carry soldiers, and warships can carry private cargo. The council must define when a House fleet remains a private instrument, when it serves a common convoy, and when it falls under national naval command."
 kc_regulation_open_seas.6.a: "House fleets remain free outside declared war."
 kc_regulation_open_seas.6.b: "Register mixed convoys for common defense."
 kc_regulation_open_seas.6.c: "National command governs wartime shipping."
 kc_regulation_open_seas.7.title: "The Treasury of the Sea"
 kc_regulation_open_seas.7.desc: "The final dispute concerns money. Lighthouses, consuls, courts, rescue ships, charts, and interpreters cannot be maintained by seals alone. The Articles must decide whether dues remain with the Houses, pass through port trusts, or support a national maritime assessment."
 kc_regulation_open_seas.7.a: "Houses retain dues and maintain their own routes."
 kc_regulation_open_seas.7.b: "Create audited port trusts for maritime services."
 kc_regulation_open_seas.7.c: "Establish a national maritime assessment."
 kc_regulation_open_seas.10.title: "The Articles of the Open Seas"
 kc_regulation_open_seas.10.desc: "Every article has been entered, disputed, copied, and sealed. Japan will remain connected to foreign markets and communities under any settlement. The final decision is constitutional: whether that connection belongs chiefly to autonomous Chartered Houses, reciprocal public ports, or a national maritime administration."
 kc_regulation_open_seas.10.a: "Ratify the Commonwealth of Chartered Ports."
 kc_regulation_open_seas.10.b: "Ratify the Articles of Registered Open Ports."
 kc_regulation_open_seas.10.c: "Ratify the National Maritime Administration."
 kc_regulation_open_seas.11.title: "The Open-Seas Articles Abandoned"
 kc_regulation_open_seas.11.desc: "The constitutional order required to ratify the Open-Seas Articles has ceased to function. Ships and merchants remain, but no common settlement now binds their competing jurisdictions."
 kc_regulation_open_seas.11.a: "The registers close unfinished."

 # Final reforms
 kc_commonwealth_chartered_ports: "Commonwealth of Chartered Ports"
 kc_commonwealth_chartered_ports_desc: "Autonomous Chartered Houses and port councils govern Japan's oceanic commerce under common guarantees. The system gives merchants the broadest initiative and strengthens overseas concessions, but its overlapping privileges continually test Concord Cohesion. At least half-funding the Office of Maritime Exchange activates additional range and merchant-maintenance benefits."
 kc_articles_registered_open_ports: "Articles of Registered Open Ports"
 kc_articles_registered_open_ports_desc: "Reciprocal registers, mixed courts, and public port trusts reconcile Japanese, foreign, and local law. This is the most balanced settlement for diplomacy, institutions, estates, and Cohesion. At least half-funding the Office of Maritime Exchange activates additional range, merchant-power, and diplomatic-spending benefits."
 kc_national_maritime_administration: "National Maritime Administration"
 kc_national_maritime_administration_desc: "Oceanic seals, wartime shipping, consular protection, and foreign-company residence pass beneath a permanent national service. It offers the strongest naval and administrative coordination while reducing House autonomy. At least half-funding the Office of Maritime Exchange activates additional naval range, maintenance, and diplomatic-spending benefits."

