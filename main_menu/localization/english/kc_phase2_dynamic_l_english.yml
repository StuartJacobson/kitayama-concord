l_english:
 kc_phase2_flavor.1.title: "A Gunsmith's Patent"
 kc_phase2_flavor.1.desc: "A guild of gunsmiths presents a matchlock mechanism whose interchangeable measurements would allow repairs far from its original workshop. The inventor asks whether useful knowledge belongs in a common register, under a House patent, or behind the walls of the old arsenals."
 kc_phase2_flavor.1.a: "Publish common gauges through the Concord."
 kc_phase2_flavor.1.b: "Grant the inventors a protected House patent."
 kc_phase2_flavor.1.c: "Leave weapons knowledge to the old arsenals."
 kc_phase2_flavor.2.title: "Powder Leaks from the Magazines"
 kc_phase2_flavor.2.desc: "Pirates have acquired powder packed in barrels bearing the seals of several Chartered Houses. No clerk admits selling it, yet every ledger contains enough ambiguity to hide the missing stock."
 kc_phase2_flavor.2.a: "Send common inspectors into every magazine."
 kc_phase2_flavor.2.b: "Make each House police its own contracts."
 kc_phase2_flavor.2.c: "Concentrate powder in court-regulated arsenals."
 kc_phase2_flavor.3.title: "The Silver Leaves Faster Than It Arrives"
 kc_phase2_flavor.3.desc: "Foreign merchants exchange silk and medicines for Japanese silver, while rival House scales disagree over every ingot. The trade enriches the ports, but an unmeasured flow of bullion threatens prices and public credit."
 kc_phase2_flavor.3.a: "Clear silver through a common assay board."
 kc_phase2_flavor.3.b: "Recognize the Houses' bullion accounts."
 kc_phase2_flavor.3.c: "Require the seal of the court assay office."
 kc_phase2_flavor.4.title: "A Treaty with Two Meanings"
 kc_phase2_flavor.4.desc: "Two copies of a harbor agreement have returned from the southern seas. In one, the foreign captain received warehouse privileges; in the other, he merely received permission to unload. Both translators defend their text."
 kc_phase2_flavor.4.a: "Reconcile both texts in the common bureau."
 kc_phase2_flavor.4.b: "Let the sponsoring House defend its translation."
 kc_phase2_flavor.4.c: "Repudiate the disputed clause."
 kc_phase2_flavor.5.title: "Confraternities at the Quays"
 kc_phase2_flavor.5.desc: "Christian confraternities have begun feeding sailors, tending the sick, and burying strangers in the treaty ports. Their charity wins converts as readily as sermons, and nearby temples fear that foreign silver is buying a new congregation."
 kc_phase2_flavor.5.a: "Register the confraternities as civic charities."
 kc_phase2_flavor.5.b: "Pair their relief houses with local temples."
 kc_phase2_flavor.5.c: "Forbid charities funded from abroad."
 kc_phase2_flavor.6.title: "The Temples Answer the Foreign Schools"
 kc_phase2_flavor.6.desc: "Temple schools answer the interpreters of the southern ports with new lessons in arithmetic, medicine, and geography. The dispute is no longer whether foreign knowledge will enter Japan, but through whose institutions it will be taught."
 kc_phase2_flavor.6.a: "Join temple learning to the common translation houses."
 kc_phase2_flavor.6.b: "License competing House academies."
 kc_phase2_flavor.6.c: "Place the curriculum beneath court review."
 kc_phase2_flavor.7.title: "A Community Omitted from the Survey"
 kc_phase2_flavor.7.desc: "A colonial chart describes fields, timber, and anchorages but leaves an inhabited valley blank. Surveyors claim that no recognized title was presented; the omitted community insists that the map is being used to dispossess it."
 kc_phase2_flavor.7.a: "Send a common boundary commission."
 kc_phase2_flavor.7.b: "Uphold the proprietary survey."
 kc_phase2_flavor.7.c: "Negotiate a compact with the community."
 kc_phase2_flavor.8.title: "A Governor Keeps a Second Ledger"
 kc_phase2_flavor.8.desc: "Copies of a colonial governor's private accounts reveal duties never entered in Kyoto's register. He argues that distant administration requires a reserve beyond the reach of slow-moving council votes."
 kc_phase2_flavor.8.a: "Audit the colony and recover every missing tally."
 kc_phase2_flavor.8.b: "Recognize a limited colonial reserve."
 kc_phase2_flavor.8.c: "The distant ports may keep their own books."
 kc_phase2_flavor.9.title: "No Japanese Subject Shall Be Cargo"
 kc_phase2_flavor.9.desc: "A returning pilot reports Japanese captives sold through a foreign harbor under contracts disguised as long service. Merchants warn that a confrontation may close profitable routes; the families demand that the Concord treat the traffic as piracy."
 kc_phase2_flavor.9.a: "Prohibit the trade and pursue every ship involved."
 kc_phase2_flavor.9.b: "Demand an indemnity from the foreign merchants."
 kc_phase2_flavor.9.c: "Do not endanger the southern trade."
 kc_phase2_flavor.10.title: "Pilots Return with Foreign Arts"
 kc_phase2_flavor.10.desc: "Pilots returning from distant ports bring copied rutters, unfamiliar medicines, star tables, and notebooks kept in several languages. The Concord must decide which knowledge belongs first in its public registers."
 kc_phase2_flavor.10.a: "Publish the rutters for Japan's navigators."
 kc_phase2_flavor.10.b: "Send the medical notes to the hospitals and temples."
 kc_phase2_flavor.10.c: "Permit the Houses to keep proprietary archives."

 kc_christian_contact.1.title: "Alms beneath a Foreign Cross"
 kc_christian_contact.1.desc: "The Southern Articles regulated foreign worship, but sailors, widows, laborers, and the sick now gather around Christian relief houses in the treaty ports. Their growing native confraternities are neither embassies nor temples. The Concord must decide what civil standing they possess."
 kc_christian_contact.1.a: "Register them as civic relief confraternities."
 kc_christian_contact.1.b: "Require every house to work beside a temple."
 kc_christian_contact.1.c: "No foreign money shall purchase Japanese loyalties."
 kc_christian_contact.2.title: "Subjects of Two Communities"
 kc_christian_contact.2.desc: "Baptized merchants insist that faith does not release them from Japanese law; temple leagues answer that private worship has already become a public network. The question before the Concord is not theology, but whether subjects may belong openly to both the commonwealth and a foreign church."
 kc_christian_contact.2.a: "Recognize peaceful Christian communities."
 kc_christian_contact.2.b: "Confine public worship to the registered ports."
 kc_christian_contact.2.c: "Suppress native congregations beyond the quays."
 kc_christian_contact.3.title: "A Shogun at the Font"
 kc_christian_contact.3.desc: "Years of regulated contact have brought Christian books and counselors into the highest circles of government. Some now whisper that the elected shogun could receive baptism without surrendering the Concord itself. Most councillors call the idea an avoidable constitutional earthquake."
 kc_christian_contact.3.a: "Protect conscience, but the shogun shall keep the old rites."
 kc_christian_contact.3.b: "Preserve the compact of registered port worship."
 kc_christian_contact.3.c: "The shogun shall receive baptism."
 kc_christian_conversion_cohesion_tt: "The Concord loses #R 20 Cohesion#!. This is an extreme constitutional break and may place the Concord in immediate danger."

