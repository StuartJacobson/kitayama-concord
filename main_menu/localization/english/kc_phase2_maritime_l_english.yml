 kc_debug.44.title: "Test the Tallies of Ningbo"
 kc_debug.44.desc: "Starts the four-event Ningbo chain immediately and schedules each follow-up one day apart. Japan and the Concord Treasury receive ample test funds. The final settlement should automatically research Licensed Oceanic Convoys."
 kc_debug.44.a: "Begin the rapid Ningbo test."
 kc_debug.45.title: "Test the Southern Sea Exchange"
 kc_debug.45.desc: "Prepares the Phase 2 maritime prerequisites and starts the Southern Sea Exchange at zero progress with its normal monthly rate. Japan and the Concord Treasury receive ample test funds."
 kc_debug.45.a: "Open the Southern Sea Exchange."
 kc_debug.46.title: "Advance an Exchange Ratification"
 kc_debug.46.desc: "Moves an active Southern Sea Exchange to immediately before the selected milestone. Advance one monthly tick to fire that event. Previously completed milestones will not repeat."
 kc_debug.46.a: "Move to the firearms article at 20."
 kc_debug.46.b: "Move to the powder incident at 40."
 kc_debug.46.c: "Move to the silver article at 55."
 kc_debug.46.d: "Move to the translation article at 70."
 kc_debug.46.g: "Move to the Southern Islands Survey at 76."
 kc_debug.46.e: "Move to the missionary petition at 82."
 kc_debug.46.f: "Move to the treaty-port article at 92."
 kc_debug.47.title: "Complete the Southern Sea Exchange"
 kc_debug.47.desc: "Moves the active situation to 99.90 progress. Advance one monthly tick to complete it and choose the constitutional settlement."
 kc_debug.47.a: "Move to the final settlement."
 kc_debug.48.title: "Test the Colonialism Bridge"
 kc_debug.48.desc: "Enables a debug substitute for the normal requirements of a colonial-nation subject and knowledge of a country whose capital lies in Europe, then opens the Colonial Survey Registers chain one day later. Its follow-up events also arrive one day apart. Kyoto gains one New World institution point per month while the override remains active."
 kc_debug.48.a: "Enable the institution-progress override."
 kc_debug.48.b: "Remove the institution-progress override."
 kc_debug.49.title: "Test the Second National Works Register"
 kc_debug.49.desc: "Prepares the completed Southern Sea Exchange, removes the later Great Projects unlock, and opens the Second National Works Register one day later."
 kc_debug.49.a: "Open the second works register."
