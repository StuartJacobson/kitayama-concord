l_english:
 MODIFIER_TYPE_NAME_kc_maritime_office_funding: "Maritime Office Funding"
 MODIFIER_TYPE_DESC_kc_maritime_office_funding: "The effective maintenance assigned to the Office of Maritime Exchange, strengthened by its own bureaucratic Entrenchment."
 MODIFIER_TYPE_NAME_kc_maritime_office_underfunding: "Maritime Office Underfunding"
 MODIFIER_TYPE_DESC_kc_maritime_office_underfunding: "The unfunded share of the Office of Maritime Exchange, strengthened by its own bureaucratic Entrenchment."

 kc_southern_exchange_hall: "Southern Exchange Hall"
 kc_southern_exchange_hall_desc: "A treaty-port compound of bonded warehouses, assay rooms, interpreter offices, chart archives, and maritime courts. Only one may operate in Japan, making its host port the formal gateway of the Southern Sea Exchange."
 kc_southern_exchange_hall_maintenance: "Treaty-Port Stores and Registers"

 kc_ningbo.1.title: "The Tallies Come Due"
 kc_ningbo.1.desc: "The old tally settlement with [GetCountry('CHI').GetName] has endured, but the trade it created now outruns its rules. Two Japanese consortia have assembled rival missions for Ningbo. Each bears seals, cargo, interpreters, and claims of precedence; neither accepts that the other's license is valid. The Concord must decide whether Japan arrives as one registered embassy, several chartered ventures, or a court-guaranteed delegation."
 kc_ningbo.1.a: "Send one embassy under the common register."
 kc_ningbo.1.b: "License the rival House missions separately."
 kc_ningbo.1.c: "Let the court warrant every tally and seal."

 kc_ningbo.2.title: "Two Missions for One Seal"
 kc_ningbo.2.desc: "At Ningbo the argument narrows to a single question: whose document is entered first? The dispute is no mere ceremony. The first mission receives the best warehouses, the favorable exchange, and the right to present its gifts before the other. Port officials of [GetCountry('CHI').GetName] refuse to judge an internal Japanese quarrel, while both delegations warn that yielding would invalidate contracts written across half of Japan."
 kc_ningbo.2.a: "The Concord register determines precedence."
 kc_ningbo.2.b: "Divide the quota and recognize both ventures."
 kc_ningbo.2.c: "Only court seals may establish precedence."

 kc_ningbo.3.title: "The Quays of Ningbo"
 kc_ningbo.3.desc: "Porters have stopped moving cargo. Warehouse doors are barred, retainers gather around their principals, and rumors claim that one mission intends to seize the other's tallies. In another history this quarrel would spill blood across Ningbo. The Concord has one last opportunity to make liability, compensation, and registered precedence stronger than private force."
 kc_ningbo.3.a: "Pay for common arbitration and compensate the port."
 kc_ningbo.3.b: "Recognize the first license and make its House answer."
 kc_ningbo.3.c: "The court will guarantee an indemnity."

 kc_ningbo.4.title: "The Sea Roads Compact"
 kc_ningbo.4.desc: "New copies of the Ningbo settlement are carried to every licensed port. They define who may assemble an oceanic mission, which seals foreign officials may accept, how competing cargoes receive quotas, and who pays when a quarrel interrupts trade. What nearly became a private war has instead created Japan's first durable law of oceanic convoys."
 kc_ningbo.4.a: "Publish the National Tally Registry."
 kc_ningbo.4.b: "Confirm the Chartered Maritime League."
 kc_ningbo.4.c: "Seal the Court-Governed Sea Roads."

 kc_southern_sea_exchange: "The Southern Sea Exchange"
 kc_southern_sea_exchange_desc: "Ships arriving through Japan's southern ports carry more than cargo. Matchlocks, silver accounts, unfamiliar charts, interpreters, new forms of worship, and competing claims to port jurisdiction force the Concord to decide how foreign exchange becomes Japanese law. Progress rises fastest when the Office of Maritime Exchange is fully maintained, oceanic convoys are licensed, a developed coastal city serves commerce, Japan has adopted a maritime constitution, and the realm is at peace."
 kc_southern_sea_exchange_end_tt: "The Southern Sea Exchange concludes at #Y 100 Exchange Progress#!, or ends unsuccessfully if Japan, the Concord, or the Concordate settlement ceases to exist."
 kc_southern_sea_exchange_monthly_tt: "The Exchange gains #G 0.35 Progress#! each month. A fully funded Office of Maritime Exchange adds #G 0.25#!; partial funding adds #G 0.10#!. Licensed Oceanic Convoys add #G 0.10#!, a coastal Japanese city adds #G 0.05#!, and either maritime Concord reform adds #G 0.05#!. War subtracts #R 0.15#!."
 kc_southern_sea_exchange_map_state_tt: "Japan directs the common ordinances, workshops, translation houses, and treaty-port settlement of the Southern Sea Exchange."
 kc_southern_sea_exchange_map_house_tt: "A Chartered House participates in the commercial and constitutional bargaining of the Southern Sea Exchange."
 KC_SSE_LEGEND_STATE: "Concord State"
 KC_SSE_LEGEND_HOUSES: "Chartered Houses"
 KC_SSE_EXCHANGE_PROGRESS: "Exchange Progress"
 KC_SSE_MONTHLY_PROGRESS: "Monthly Progress"
 KC_SSE_COUNCIL_OVERVIEW: "The Articles of Southern Exchange"
 KC_SSE_PANEL_OVERVIEW: "The council must ratify standards for firearms, bullion clearing, translation, a survey of the southern islands, foreign worship, and a permanent treaty port. Funding the Office of Maritime Exchange shortens the proceedings, but every article still asks who controls the knowledge and profits entering Japan: the common institutions, the Chartered Houses, or the court."
 KC_SSE_ARMS_ARTICLE: "Arms and Powder Ordinance"
 KC_SSE_SILVER_ARTICLE: "Silver-Clearing Ordinance"
 KC_SSE_TRANSLATION_ARTICLE: "Houses of Translation"
 KC_SSE_SOUTHERN_ISLANDS_SURVEY: "Southern Islands Survey"
 KC_SSE_TREATY_PORT_ARTICLE: "The Great-Ship Port"
 KC_SSE_RATIFIED: "Ratified"
 KC_SSE_PENDING: "Awaiting Debate"

 kc_southern_exchange.1.title: "The Matchlock at the Southern Wharf"
 kc_southern_exchange.1.desc: "A southern-bound ship has brought an unfamiliar iron weapon into a Japanese port. Its mechanism is compact, its barrel costly, and its owners more interested in silver, silk, and safe anchorage than conquest. House merchants want prototypes distributed immediately. Concord officials ask for a measured examination. Court officers warn that any foreign instrument entering Japan must first acquire a lawful place within the realm."
 kc_southern_exchange.1.a: "Examine the weapon under common supervision."
 kc_southern_exchange.1.b: "Let licensed Houses commission prototypes."
 kc_southern_exchange.1.c: "Confine all exchange to a guarded wharf."

 kc_southern_exchange.2.title: "The Missing Screw"
 kc_southern_exchange.2.desc: "Japanese smiths can reproduce the barrel, stock, and lock, but a small threaded screw exposes the limits of workshop standards. The problem is soluble: gauges, templates, and patient instruction can turn one curiosity into a reproducible weapon. The harder question is whether those standards belong to the Concord, to licensed gunsmithing Houses, or to court magazines."
 kc_southern_exchange.2.a: "Fund common gauges and publish the pattern."
 kc_southern_exchange.2.b: "Charter competing gunsmithing workshops."
 kc_southern_exchange.2.c: "Reserve the pattern for court magazines."

 kc_southern_exchange.3.title: "Powder Without Saltpeter"
 kc_southern_exchange.3.desc: "A matchlock without powder is an expensive club. Domestic supplies cannot yet meet the demand of every arsenal and House workshop, while foreign merchants raise their prices as soon as they learn how urgently Japan needs saltpeter. The Concord may finance common contracts, tolerate House monopolies, or restrict powder to guarded magazines."
 kc_southern_exchange.3.a: "Secure common powder contracts from the Treasury."
 kc_southern_exchange.3.b: "Permit House monopolies to find the supply."
 kc_southern_exchange.3.c: "Restrict powder to a few guarded magazines."

 kc_southern_exchange.4.title: "Silver for Silk"
 kc_southern_exchange.4.desc: "Japanese silver now passes through southern warehouses in quantities the old ledgers were never designed to record. Assayers disagree over fineness, creditors discount unfamiliar marks, and foreign merchants exploit the difference between House accounts. A common clearing standard could deepen exchange, but only by deciding whose scales and guarantees bind every contract."
 kc_southern_exchange.4.a: "Create a common silver-clearing register."
 kc_southern_exchange.4.b: "Recognize the bullion accounts of the Houses."
 kc_southern_exchange.4.c: "Require court assay seals on foreign silver."

 kc_southern_exchange.5.title: "The Houses of Translation"
 kc_southern_exchange.5.desc: "Charts, contracts, medical notes, devotional texts, and workshop instructions pile up faster than the available interpreters can read them. Translation can no longer remain an improvised service performed at the gangplank. Japan needs permanent houses where languages are taught, manuscripts compared, and technical words made intelligible."
 kc_southern_exchange.5.a: "Endow common Houses of Translation."
 kc_southern_exchange.5.b: "License interpreter guilds to the Houses."
 kc_southern_exchange.5.c: "Establish a court translation bureau."

 kc_southern_exchange.6.title: "The Missionaries' Petition"
 kc_southern_exchange.6.desc: "Foreign religious teachers request the same legal clarity already granted to merchants and interpreters. They ask where they may preach, where visiting sailors may worship, and which authority will answer for disputes. The petition does not require Japan to abandon its faith; it requires the Concord to decide whether foreign worship is open, registered, or restricted as a matter of civil law."
 kc_southern_exchange.6.a: "Permit open preaching under ordinary law."
 kc_southern_exchange.6.b: "Register worship within licensed ports."
 kc_southern_exchange.6.c: "Permit private worship but restrict preaching."

 kc_southern_exchange.7.title: "A Port for the Great Ships"
 kc_southern_exchange.7.desc: "Ocean-going ships cannot be governed from a temporary warehouse. The Exchange requires one permanent compound with assay rooms, bonded stores, interpreters, chart archives, and a court able to judge foreign contracts. Hakata offers deep commercial experience, Kagoshima stands nearest the southern routes, while the Maritime Office proposes choosing the largest suitable harbor on administrative grounds."
 kc_southern_exchange.7.a: "Seat the Southern Exchange Hall at Hakata."
 kc_southern_exchange.7.b: "Seat the Southern Exchange Hall at Kagoshima."
 kc_southern_exchange.7.c: "Let the Maritime Office select the leading port."

 kc_southern_exchange.10.title: "The Articles of Southern Exchange"
 kc_southern_exchange.10.desc: "The last ordinance is copied beside the Ningbo tallies. Japan now possesses reproducible firearms, clearing rules for silver, permanent translators, a precedent for foreign worship, and one lawful gateway for great ships. The Southern Sea Exchange will remain open, but its constitutional character must be declared: a league of chartered ventures, a national maritime service, or treaty ports governed under court guarantee."
 kc_southern_exchange.10.a: "Confirm the Chartered Southern Exchange."
 kc_southern_exchange.10.b: "Establish the National Maritime Exchange."
 kc_southern_exchange.10.c: "Recognize Court-Regulated Treaty Ports."

 kc_southern_exchange.11.title: "The Southern Articles Abandoned"
 kc_southern_exchange.11.desc: "The institutions that sustained the negotiations have failed before a final settlement could be sealed. Merchants and interpreters preserve what knowledge they can, but no common law binds the southern exchange."
 kc_southern_exchange.11.a: "The sea remains, even when the register closes."


 kc_phase2_projects.1.title: "The Second National Works Register"
 kc_phase2_projects.1.desc: "The Southern Articles brought more than firearms and silver into Japan. Foreign sounding lines can be compared with Kaidō surveys; mine drainage can be adapted to river embankments; and the measurements kept by the Houses of Translation can now be reconciled with a century of provincial accounts. The first national works proved that the Concord could build across the boundaries of the Houses. A second register may now authorize the harder works that earlier surveyors could describe but not administer."
 kc_phase2_projects.1.a: "Open the second register of national works."
 kc_phase2_projects_unlock_tt: "Unlocks the five-stage #Y National Floodworks#!, #Y Transmontane Tunnels#!, and #Y National Urban Waterworks#! in the Concord's National Great Projects panel. Every stage must still be authorized and paid for from the Concord Treasury, while local Floodworks and Water Bureaus must be constructed and maintained by Japan."

 kc_colonial_surveys.1.title: "Charts Returned from Across the Ocean"
 kc_colonial_surveys.1.desc: "A colonial administration now sends pilots' reports, coastal soundings, and measured routes back to Kyoto. Direct knowledge of a European capital allows the Houses of Translation to compare those records with foreign charts. While both connections remain and the New World Institution is not yet present, Japan's capital gains #G 1 New World Institution Progress each month#!. The first question is who shall reconcile reports produced by sailors who use different names, measures, and commercial interests."
 kc_colonial_surveys.1.a: "Establish a common hydrographic register."
 kc_colonial_surveys.1.b: "License competing House chart companies."
 kc_colonial_surveys.1.c: "Compile a court atlas under the imperial seal."

 kc_colonial_surveys.2.title: "Whose Name Is Written on the Shore?"
 kc_colonial_surveys.2.desc: "A chart is already a claim. A bay entered under a House seal may become its private harbor; a settlement counted by the central register will expect common law and protection; and treaty land described without its existing communities may become the seed of a future war. The Concord must decide what legal authority accompanies its surveyors beyond Japan."
 kc_colonial_surveys.2.a: "Every colony shall answer to the common register."
 kc_colonial_surveys.2.b: "Recognize proprietary charters issued to the Houses."
 kc_colonial_surveys.2.c: "Record negotiated colonial compacts under court guarantee."

 kc_colonial_surveys.3.title: "The Colonial Survey Registers"
 kc_colonial_surveys.3.desc: "Kyoto now receives standardized charts, settlement rolls, anchorage reports, and copies of every colonial charter. The record is imperfect, but distant officials can no longer turn a seasonal landing into a private possession merely by keeping it out of the Concord's books. The open-sea register has become an instrument of colonial government."
 kc_colonial_surveys.3.a: "Seal the Colonial Survey Registers."
 kc_colonial_surveys_unlock_tt: "Automatically researches #Y Colonial Survey Registers#!. Japan retains its chosen colonial settlement for twenty years."

