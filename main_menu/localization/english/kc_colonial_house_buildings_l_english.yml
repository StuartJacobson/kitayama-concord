l_english:
 kc_house_anchorage: "House Anchorage"
 kc_house_anchorage_desc: "A guarded House quay combining pilots, convoy stores, harbor watchmen, and coastal factors. It sustains sailors and commercial income without replacing a true Clan Shipyard. Only one House Anchorage may operate in a location."
 kc_colonial_house_exchange: "Colonial House Exchange"
 kc_colonial_house_exchange_desc: "A compact counting house staffed by local and Japanese merchants. It reconciles contracts, advances credit, and returns one percent of the colonial location's tax base to its Chartered House."
 kc_colonial_tea_gardens: "Colonial Tea Gardens"
 kc_colonial_tea_gardens_desc: "House capital, tools, drying sheds, and local cultivation knowledge establish tea beyond Japan. The first House reserves the local tea charter and may develop roughly half the levels available to a comparable domestic estate."
 kc_colonial_silk_farm: "Colonial Silk Farm"
 kc_colonial_silk_farm_desc: "Mulberry plots, rearing houses, and reeling sheds join local sericultural knowledge to House credit. The first House reserves the local silk charter and may develop roughly half the levels available to a comparable domestic estate."
 kc_chartered_paddy_syndicate: "Colonial Paddy Syndicate"
 kc_chartered_paddy_syndicate_desc: "Where rice is already known, the Syndicate finances canals, dikes, mills, granaries, seed exchange, and contracts with local cultivators. Suitable humid lowlands can thereby provision both colony and oceanic trade."
 kc_house_alum_works: "Colonial Alum Works"
 kc_house_alum_works_desc: "A Chartered House finances the difficult quarrying, washing, and refining of alunite into alum for dyers, silk finishers, tanners, paper makers, and glassworkers. In western North America the works recognize deposits near Marysvale and Blawn Wash in Utah and the Goldfield and Sulphur districts of Nevada."
 kc_northern_house_whaling_station: "Colonial Whaling Station"
 kc_northern_house_whaling_station_desc: "Local pilots and shore crews hunt and render whales and other northern sea mammals. Bone, teeth, baleen, and rendered products enter the market as ivory while edible portions sustain the settlement."
 kc_house_provisioning_depot: "Colonial Provisioning Depot"
 kc_house_provisioning_depot_desc: "Salted food, spare cordage, grain, and emergency stores are kept under a House seal, improving the reliability of both colonial markets and passing fleets."
 kc_chartered_timber_yard: "Chartered Timber Yard"
 kc_chartered_timber_yard_desc: "A House concession seasons colonial lumber and combines it with tar and iron tools to produce standardized spars, planks, cordage fittings, and other naval supplies."

 kc_reserved_colonial_tea_concession_tt: "No rival Chartered House has reserved this location's colonial tea charter. The reserving House may build every level allowed by the local colonial-estate cap."
 kc_reserved_colonial_silk_concession_tt: "No rival Chartered House has reserved this location's colonial silk charter. The reserving House may build every level allowed by the local colonial-estate cap."
 kc_reserved_colonial_rice_concession_tt: "No rival Chartered House has reserved this location's paddy charter. The reserving House may build every level allowed by the local colonial-estate cap."
 kc_reserved_colonial_alum_concession_tt: "No rival Chartered House has reserved this location's alum rights. The reserving House may build both available levels."
 kc_reserved_colonial_timber_concession_tt: "No rival Chartered House has reserved this location's naval-timber charter. The reserving House may build every level allowed by the local colonial-estate cap."

 kc_colonial_managed_tea: "Chartered Colonial Tea"
 kc_colonial_managed_silk: "Chartered Colonial Silk"
 kc_chartered_paddy_irrigation: "Contracted Paddy Irrigation"
 kc_house_alum_refining: "Low-Fuel Alum Refining"
 kc_northern_whale_rendering: "Shore Whaling and Rendering"
 kc_colonial_naval_timber: "Seasoned Naval Timber"

 kc_debug.73.title: "Share Japan's Existing Charts"
 kc_debug.73.desc: "Every current Chartered House will discover every area already known to Japan. This is a large one-time operation intended for established test saves; keep the game paused while it resolves. Future successful explorations are shared automatically and do not require this command."
 kc_debug.73.a: "Copy Japan's charts into every House register."
