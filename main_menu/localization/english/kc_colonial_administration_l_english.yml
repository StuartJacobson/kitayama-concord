 kc_colonial_administration.1.title: "Articles for a Distant Administration"
 kc_colonial_administration.1.desc: "The court's geographers call these shores adjacent to Asia, but the ledgers tell a different story. Months at sea separate the new settlement from Kyoto, while local petitions already outrun the officials sent to answer them. The Concord's articles permit a chartered colonial administration wherever distance has made direct government impractical."
 kc_colonial_administration.1.a: "Constitute a colonial administration."
 kc_colonial_administration.1.b: "Keep the province under direct Concord rule."
